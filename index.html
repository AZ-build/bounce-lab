<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#050507; --panel:#0b0c10; --raise:#15171d; --edge:rgba(255,255,255,.07);
  --text:#e8f1ff; --soft:#a9b4c6; --mute:#677285;
  --cy:#3ef6ff; --mg:#ff3fb4; --gd:#ffc23a;
  --sign:"Tilt Neon",system-ui,sans-serif; --f:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;background:var(--void);color:var(--text);overflow:hidden;font:400 16px/1.45 var(--f);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas#c.hot{cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* a realistic neon tube: white-hot core, coloured glow, wide bloom */
.neon{--n:var(--mg);color:color-mix(in srgb,var(--n) 25%,#fff);text-shadow:0 0 1px #fff,0 0 4px var(--n),0 0 10px var(--n),0 0 22px var(--n),0 0 44px color-mix(in srgb,var(--n) 70%,transparent),0 0 90px color-mix(in srgb,var(--n) 45%,transparent)}

/* header: a neon sign bolted to the lab wall */
#hdr{position:fixed;left:0;right:0;top:0;padding:max(24px,env(safe-area-inset-top)) 22px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#logo{font:400 clamp(40px,11.5vw,70px)/1 var(--sign);letter-spacing:.01em;animation:power 1.6s steps(1) both .3s}
@keyframes power{0%{opacity:.08}8%{opacity:.9}10%{opacity:.15}18%{opacity:1}21%{opacity:.4}26%,100%{opacity:1}}
#sub{margin-top:12px;font:600 12px var(--f);letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
#hint{margin-top:6px;font-size:15px;color:var(--soft);transition:opacity .8s;max-width:24ch}
body.played #hint{opacity:0}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%),conic-gradient(from 20deg,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.7);color:#dfe6f0}
.round:active,.x:active,.shr:active{filter:brightness(1.25)}
.round.off{color:var(--mute)}
@media (prefers-reduced-motion:reduce){#logo{animation:none}}

/* wall-mounted energy readout */
#hud{position:fixed;left:22px;top:calc(max(24px,env(safe-area-inset-top)) + clamp(122px,31vw,150px));padding:3px;border-radius:12px;pointer-events:none;
  background:linear-gradient(180deg,#9aa1ab,#3a3f47 30%,#1b1d22 60%,#4b515a);box-shadow:0 8px 22px rgba(0,0,0,.7)}
#hud .scr{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 14px;padding:8px 12px 9px;border-radius:9px;background:#050607;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);box-shadow:inset 0 2px 10px rgba(0,0,0,.9)}
#hud .lbl{font:600 10px var(--f);letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
#hud .n{--n:var(--gd);font:700 26px/1 var(--f);font-variant-numeric:tabular-nums;grid-row:2}
#hud .pw{display:flex;gap:3px;grid-row:2;align-self:center}
#hud .pw i{width:9px;height:16px;border-radius:2px;background:#15171b;box-shadow:inset 0 1px 2px #000}
#hud .pw i.on{background:#bffcff;box-shadow:0 0 4px var(--cy),0 0 10px var(--cy)}
#hud .b{font-size:11px;color:var(--mute);grid-column:1/3;letter-spacing:.04em}
#hud.bump .n{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
#combo{--n:var(--gd);position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.85);font:400 34px var(--sign);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#combo.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* gravity dial: a wall-mounted gauge with a steel knob, up beside the header like the energy readout */
#grav{position:fixed;right:22px;top:calc(max(24px,env(safe-area-inset-top)) + clamp(110px,29vw,140px));width:84px;touch-action:none;z-index:4;cursor:grab;outline:none;text-align:center;--gc:#3ef6ff}
#grav .dial{position:relative;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),conic-gradient(from 30deg,#23262c,#5d636d,#1e2126,#4a5059,#23262c,#5d636d,#1e2126,#4a5059,#23262c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.6),0 0 0 1px #000,0 10px 24px rgba(0,0,0,.75)}
#grav svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#grav .knob{transition:transform .08s linear}
#grav:focus-visible .dial{box-shadow:0 0 0 2px var(--gc),0 10px 24px rgba(0,0,0,.75)}
#grav.turning{cursor:grabbing}
#grav .rd{margin-top:6px;line-height:1.1;pointer-events:none}
#grav .rd b{--n:var(--gc);display:block;font:700 14px var(--f);font-variant-numeric:tabular-nums}
#grav .rd span{font:600 8px var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);padding-left:.24em}

/* surge: a steel push button with a charge ring */
#surge{position:fixed;left:18px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 21px);width:66px;height:66px;border-radius:50%;z-index:5;display:grid;place-items:center;--p:1;
  background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%),conic-gradient(from 20deg,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.6),0 0 0 1px #000,0 8px 22px rgba(0,0,0,.8)}
#surge:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#ffd27a calc(var(--p) * 1turn),rgba(255,255,255,.07) 0);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#surge.ready:before{background:#ffd27a;box-shadow:0 0 12px #ffb43a}
#surge.ready{animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.6),0 0 0 1px #000,0 0 22px rgba(255,180,58,.55),0 8px 22px rgba(0,0,0,.8)}}
#surge svg{width:28px;height:28px;fill:#ffe2a0;filter:drop-shadow(0 0 3px #ffb43a) drop-shadow(0 0 8px #ffb43a);transition:opacity .2s}
#surge:not(.ready) svg{opacity:.35;filter:none}
#surge:active{transform:scale(.95)}
#surge span{position:absolute;top:100%;margin-top:7px;font:600 9px var(--f);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);padding-left:.26em}
@media (prefers-reduced-motion:reduce){#surge.ready{animation:none}}
#hdr .knobs{display:flex;gap:10px}

/* bottom dock */
#dock{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 14px);transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:5}
#bList{white-space:nowrap;height:52px;padding:0 26px;border-radius:999px;font:700 15px var(--f);letter-spacing:.16em;text-transform:uppercase;color:#f4ffff;border:3px solid transparent;background:radial-gradient(120% 140% at 50% 0%,rgba(20,90,100,.9),rgba(4,22,26,.95)) padding-box,linear-gradient(180deg,#9aa1ab,#3a3f47 30%,#1b1d22 55%,#5b616b 80%,#22252b) border-box;box-shadow:0 0 6px var(--cy),0 0 20px rgba(62,246,255,.5),0 8px 24px rgba(0,0,0,.7),inset 0 0 0 1.5px #b9fbff,inset 0 0 14px rgba(62,246,255,.5);text-shadow:0 0 1px #fff,0 0 10px var(--cy);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bList:active{transform:scale(.97)}
#dock .round{width:52px;height:52px}
#bInstall{display:none}
body.can-install #bInstall{display:grid}
#demo{position:fixed;right:22px;bottom:max(18px,env(safe-area-inset-bottom));font-size:12px;color:var(--mute);pointer-events:none;line-height:52px}

/* sheets: dark glass panels with a neon tube along the top edge */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
body.modal #scrim{opacity:1;pointer-events:auto}
.sheet{--c:var(--cy);position:fixed;left:50%;bottom:0;width:min(460px,100vw);max-height:min(88vh,780px);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,1,.3,1);z-index:11;background:linear-gradient(180deg,rgba(22,23,28,.55),rgba(5,6,8,.88)),url(assets/concrete.png) 0 0/256px 256px,#0d0e11;border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 2px 0 rgba(0,0,0,.7),inset 0 0 60px rgba(0,0,0,.6),0 -24px 80px rgba(0,0,0,.85);display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sheet.on{transform:translate(-50%,0)}
.sheet:before{content:"";position:absolute;top:0;left:28px;right:28px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--c) 35%,#fff);box-shadow:0 0 4px var(--c),0 0 14px var(--c),0 0 34px var(--c)}
@media (min-width:760px) and (min-height:640px){.sheet{bottom:50%;border-radius:26px;transform:translate(-50%,58%) scale(.97);opacity:0;transition:transform .4s cubic-bezier(.2,1,.3,1),opacity .3s;pointer-events:none}.sheet.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.sheet .x{position:absolute;top:18px;right:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;z-index:2;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%),conic-gradient(from 20deg,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.7);color:#dfe6f0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:30px 24px max(24px,env(safe-area-inset-bottom))}

/* game card */
.ch{display:flex;align-items:center;gap:18px;padding-right:40px}
.orb{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),0 10px 24px rgba(0,0,0,.7)}
.ch h2{--n:var(--c);font:400 36px/1 var(--sign)}
.ch .new{display:inline-block;vertical-align:middle;margin-left:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--gd);color:var(--gd);font:700 11px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;text-shadow:none;box-shadow:0 0 10px rgba(255,194,58,.35);position:relative;top:-5px}
.ch p{margin-top:7px;color:var(--soft);font-size:15px}
.desc{margin-top:20px;color:var(--text);font-size:16px;max-width:42ch}
.how{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--soft);font-size:15px}
.how svg.i{color:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.acts{display:flex;gap:10px;margin-top:24px}
.play{flex:1;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:12px;font:700 18px var(--f);letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;text-decoration:none;color:#fff;
  border:3px solid transparent;background:radial-gradient(120% 140% at 50% 0%,color-mix(in srgb,var(--c) 55%,#000),color-mix(in srgb,var(--c) 14%,#000)) padding-box,linear-gradient(180deg,#9aa1ab,#3a3f47 30%,#1b1d22 55%,#5b616b 80%,#22252b) border-box;
  box-shadow:0 0 6px var(--c),0 0 22px color-mix(in srgb,var(--c) 70%,transparent),0 0 60px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,#fff),inset 0 0 20px color-mix(in srgb,var(--c) 60%,transparent);text-shadow:0 0 6px #fff,0 0 14px var(--c)}
.play svg{width:16px;height:16px;fill:currentColor;filter:drop-shadow(0 0 4px var(--c))}
.play:active,.shr:active{transform:scale(.97)}
.shr{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.2),rgba(255,255,255,0) 55%),conic-gradient(from 20deg,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35,#5f656f,#22252b,#4b515a,#2a2e35);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.7);color:#dfe6f0}
.meta{display:flex;gap:20px;margin-top:16px;font-size:14px;color:var(--mute);justify-content:center}
.meta:empty{display:none}
.meta b{color:var(--text);font-weight:600}
.blk{margin-top:28px}
.blk h3{font:600 13px var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
ol.lb{list-style:none}
ol.lb li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--edge);font-size:15px}
ol.lb li:first-child{border-top:0}
ol.lb .p{color:var(--mute);font-variant-numeric:tabular-nums}
ol.lb li:first-child .p,ol.lb li:first-child .s{color:var(--gd);text-shadow:0 0 10px rgba(255,194,58,.5)}
ol.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb .s{font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:14px}
.stars{display:flex;gap:2px;margin-left:-4px}
.stars button{font-size:32px;line-height:1;color:rgba(255,255,255,.1);padding:2px 4px;transition:transform .15s,color .15s,text-shadow .15s}
.stars button.on{color:#ffe7a8;text-shadow:0 0 6px var(--gd),0 0 16px var(--gd)}
.stars button:active{transform:scale(1.25)}
.note{display:none;margin-top:12px}
.note.on{display:block}
.note textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:15px;color:var(--text);background:#050607;box-shadow:inset 0 2px 8px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:12px 14px;outline:none;-webkit-user-select:text;user-select:text}
.note textarea:focus{border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 15%,transparent)}
.note .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.btn{height:42px;padding:0 18px;border-radius:12px;font:700 14px var(--f);letter-spacing:.08em;color:#fff;border:2.5px solid transparent;background:color-mix(in srgb,var(--c) 18%,#000) padding-box,linear-gradient(180deg,#9aa1ab,#3a3f47 30%,#1b1d22 55%,#5b616b 80%,#22252b) border-box;box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent);white-space:nowrap}
.btn[disabled]{opacity:.5}
#rateMsg{margin-top:6px;min-height:1.4em}
details.old{margin-top:30px;border-top:1px solid var(--edge);padding-top:14px}
details.old summary{list-style:none;cursor:pointer;color:var(--mute);font-size:14px;display:flex;align-items:center;gap:6px}
details.old summary::-webkit-details-marker{display:none}
details.old summary:after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.old[open] summary:after{transform:rotate(-135deg) translateY(-1px)}
details.old p{margin:10px 0 8px}
.vers a{display:flex;gap:10px;padding:8px 0;color:var(--soft);text-decoration:none;font-size:14px}
.vers a span{color:var(--mute);width:26px;font-variant-numeric:tabular-nums}

/* list of games */
#list h2{--n:var(--cy);font:400 32px var(--sign);margin-bottom:12px}
.gc{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--edge);cursor:pointer}
.gc:first-of-type{border-top:0}
.gc .orb{width:44px;height:44px}
.gc .t{flex:1;min-width:0}
.gc b{font-weight:600;font-size:17px;display:block}
.gc small{color:var(--mute);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .go{height:40px;padding:0 16px;border-radius:999px;font:700 13px var(--f);letter-spacing:.18em;text-transform:uppercase;color:#fff;border:2.5px solid transparent;background:color-mix(in srgb,var(--c) 22%,#000) padding-box,linear-gradient(180deg,#9aa1ab,#3a3f47 30%,#1b1d22 55%,#5b616b 80%,#22252b) border-box;box-shadow:0 0 6px var(--c),0 0 16px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,#fff);text-shadow:0 0 8px var(--c)}

#toast{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 110px);transform:translate(-50%,40px);opacity:0;padding:11px 18px;border-radius:999px;background:rgba(16,17,22,.96);color:var(--text);font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,1.2,.4,1),opacity .25s;z-index:20;max-width:calc(100vw - 24px);pointer-events:none;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;clip-path:circle(0px at 50% 50%);transition:clip-path .55s cubic-bezier(.6,0,.4,1)}
@media (prefers-reduced-motion:reduce){#wipe,.sheet{transition:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Bounce Lab: the game balls hop along together. Tap a ball to open its game, or use All games for a list."></canvas>

<header id="hdr">
  <div>
    <div id="logo" class="neon">Bounce Lab</div>
    <div id="sub">Test chamber 01</div>
    <div id="hint">Tap a ball to play it.</div>
  </div>
  <div class="knobs">
    <button class="round" id="bShare" aria-label="Share Bounce Lab"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg></button>
    <button class="round" id="bSound" aria-label="Sound on or off"><svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="sw" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
  </div>

<script>
(() => {
'use strict';
const S = window.BounceLabStore;
const GAMES = (window.BOUNCE_LAB_GAMES || []).filter(g => g && g.id);
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!S.online) $('#demo').textContent = 'Demo mode';

// ---------- world state ----------
let W = 0, H = 0, DPR = 1, R = 50, BR = 38, GY = 0, G = 2000, V = 100;   // R = course unit, BR = ball radius, GY = ground line, V = parade speed px/s
let camX = 0, timeScale = 1;
let balls = [], obs = [], cells = [], parts = [], texts = [], ripples = [], zaps = [];
let G0 = 2000, gMul = 1, surgeCharge = 1, stripBoost = 0, power = 0, powerT = -1e9;   // gravity is G0 × gMul
let nextObsX = 0, nextStarX = 0, nextLeap = 0;
let score = 0, best = +S.ls.get('bouncelab-lobby-energy', 0) || 0, comboN = 0, comboT = 0;
let modalOpen = false, played = false, t0 = performance.now();
$('#hb').textContent = best;

// ---------- colors ----------
function hexRgb(h) { h = String(h || '#5ef2ff').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, d, t) => c.map((v, i) => Math.round(v + (d[i] - v) * t));
// soft obstacle tints (the balls are the only loud colours on screen)
const NEON = [[120, 170, 255], [235, 140, 200], [255, 200, 110], [130, 220, 180], [170, 150, 255]];

// ---------- ball sprites: gunmetal spheres with neon energy seams ----------
// Three layers so the ball can roll: `base` (metal body + energy halo, never rotates),
// `detail` (the glowing seams, rotates as the ball rolls), `gloss` (reflections, never rotates).
// `sprite` is the three flattened together, used for floor reflections and the card orbs.
function layerCanvas(b) {
  const pad = b.r * 1.1, size = Math.ceil((b.r + pad) * 2 * DPR);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(b.r + pad, b.r + pad);
  return { c, g };
}
function seamPoints(r) {
  // the classic tennis-ball seam curve, on the side of the sphere facing us (z = depth toward viewer)
  const pts = [], a = 0.72, bb = 0.28, cc = 2 * Math.sqrt(a * bb);
  for (let i = 0; i <= 240; i++) { const t = i / 240 * TAU; let x = a * Math.cos(t) + bb * Math.cos(3 * t), y = a * Math.sin(t) - bb * Math.sin(3 * t), z = cc * Math.sin(2 * t); const n = Math.hypot(x, y, z); pts.push([x / n * r, y / n * r, z / n]); }
  return pts;
}
function makeSprite(b) {
  const r = b.r, col = b.rgb, hot = mix(col, [255, 255, 255], 0.75);
  const L = () => layerCanvas(b);
  const base = L(), det = L(), gl = L();
  if (b.ghost) {
    // a flickery hologram sphere: something still in the works
    let g = base.g; const hg = g.createRadialGradient(0, 0, 0, 0, 0, r); hg.addColorStop(0, 'rgba(62,246,255,.05)'); hg.addColorStop(1, 'rgba(62,246,255,.16)'); g.fillStyle = hg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g = det.g; g.strokeStyle = 'rgba(140,250,255,.55)'; g.lineWidth = 1; g.shadowColor = '#3ef6ff'; g.shadowBlur = 6;
    for (const k of [-0.66, -0.33, 0, 0.33, 0.66]) { const yy = k * r, rx = Math.sqrt(r * r - yy * yy); g.beginPath(); g.ellipse(0, yy, rx, rx * 0.22, 0, 0, TAU); g.stroke(); }
    for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(0, 0, r * Math.abs(Math.cos(k * Math.PI / 4)) + 0.5, r, 0, 0, TAU); g.stroke(); }
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
    b.base = base.c; b.detail = det.c; b.gloss = null;
  } else {
    // energy halo + steel body
    let g = base.g;
    const halo = g.createRadialGradient(0, 0, r * 0.9, 0, 0, r * 2.05); halo.addColorStop(0, rgba(col, 0.38)); halo.addColorStop(1, rgba(col, 0)); g.fillStyle = halo; g.beginPath(); g.arc(0, 0, r * 2.05, 0, TAU); g.fill();
    const body = g.createRadialGradient(-r * 0.38, -r * 0.45, r * 0.05, 0, 0, r * 1.02);
    body.addColorStop(0, '#9aa1ab'); body.addColorStop(0.22, '#5a616b'); body.addColorStop(0.55, '#262a31'); body.addColorStop(0.85, '#121418'); body.addColorStop(1, '#0a0b0d');
    g.fillStyle = body; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.save(); g.beginPath(); g.arc(0, 0, r, 0, TAU); g.clip();
    // the dark wall reflected in the upper half, the floor in the lower half
    const env = g.createLinearGradient(0, -r, 0, r); env.addColorStop(0, 'rgba(0,0,0,0)'); env.addColorStop(0.5, 'rgba(0,0,0,.25)'); env.addColorStop(0.56, 'rgba(255,255,255,.05)'); env.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = env; g.fillRect(-r, -r, r * 2, r * 2);
    // fine machining rings
    g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 0.7; for (let k = 0.3; k < 1; k += 0.14) { g.beginPath(); g.arc(-r * 0.15, -r * 0.2, r * k, 0, TAU); g.stroke(); }
    g.restore();
    // coloured rim light: the ball's own energy wrapping round the edge
    const rim = g.createRadialGradient(0, 0, r * 0.72, 0, 0, r); rim.addColorStop(0, rgba(col, 0)); rim.addColorStop(1, rgba(col, 0.55)); g.fillStyle = rim; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();

    // seams: a cut groove with neon energy inside, fading where it wraps away from us
    g = det.g; g.save(); g.beginPath(); g.arc(0, 0, r - 0.5, 0, TAU); g.clip(); g.lineCap = 'round';
    const pts = seamPoints(r * 0.98);
    const pass = (w, style, blur, alphaK) => {
      g.lineWidth = w; g.shadowBlur = blur; g.shadowColor = rgba(col, 1);
      for (let i = 1; i < pts.length; i++) { const [x0, y0, z0] = pts[i - 1], [x1, y1, z1] = pts[i]; const z = (z0 + z1) / 2; if (z < -0.05) continue; g.strokeStyle = style(clamp(0.25 + z * 1.1, 0, 1) * alphaK); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
    };
    pass(Math.max(2.6, r * 0.11), a => `rgba(0,0,0,${0.85 * a})`, 0, 1);
    pass(Math.max(1.8, r * 0.07), a => rgba(col, a), r * 0.35, 1);
    pass(Math.max(0.8, r * 0.028), a => rgba(hot, a), 2, 1);
    // two tiny bolts
    for (const [bx, by] of [[0, -r * 0.55], [0, r * 0.55]]) { g.shadowBlur = 0; g.fillStyle = '#0b0c0e'; g.beginPath(); g.arc(bx, by, r * 0.06, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.arc(bx - r * 0.015, by - r * 0.02, r * 0.025, 0, TAU); g.fill(); }
    g.restore();

    // reflections (drawn additively so they brighten whatever is under them)
    g = gl.g; g.save(); g.beginPath(); g.arc(0, 0, r, 0, TAU); g.clip();
    g.save(); g.translate(-r * 0.36, -r * 0.48); g.rotate(-0.55); g.scale(1, 0.5); const sp = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.42); sp.addColorStop(0, 'rgba(255,255,255,.55)'); sp.addColorStop(0.4, 'rgba(255,255,255,.18)'); sp.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sp; g.beginPath(); g.arc(0, 0, r * 0.42, 0, TAU); g.fill(); g.restore();
    g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.ellipse(-r * 0.4, -r * 0.5, r * 0.09, r * 0.05, -0.55, 0, TAU); g.fill();
    // the cyan floor strip mirrored in the lower half of the ball
    g.strokeStyle = 'rgba(62,246,255,.45)'; g.lineWidth = Math.max(1, r * 0.045); g.beginPath(); g.ellipse(0, r * 0.18, r * 0.96, r * 0.42, 0, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();
    g.strokeStyle = 'rgba(62,246,255,.12)'; g.lineWidth = r * 0.16; g.beginPath(); g.ellipse(0, r * 0.18, r * 0.96, r * 0.42, 0, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.restore();
    b.base = base.c; b.detail = det.c; b.gloss = gl.c;
  }
  // flattened copy
  const flat = document.createElement('canvas'); flat.width = flat.height = b.base.width; const fg = flat.getContext('2d');
  fg.drawImage(b.base, 0, 0); fg.save(); fg.translate(flat.width / 2, flat.height / 2); fg.rotate(b.ang || 0); fg.drawImage(b.detail, -flat.width / 2, -flat.height / 2); fg.restore();
  if (b.gloss) { fg.globalCompositeOperation = 'lighter'; fg.drawImage(b.gloss, 0, 0); }
  return flat;
}
// Draw a ball (all three layers) centred at 0,0 of the current transform.
function drawBall(g, b, sz) {
  g.drawImage(b.base, -sz / 2, -sz / 2, sz, sz);
  g.save(); g.rotate(b.ang || 0); g.drawImage(b.detail, -sz / 2, -sz / 2, sz, sz); g.restore();
  if (b.gloss) { const op = g.globalCompositeOperation; g.globalCompositeOperation = 'lighter'; g.drawImage(b.gloss, -sz / 2, -sz / 2, sz, sz); g.globalCompositeOperation = op; }
}

// Each game ball has its own hop personality.
const PERSONALITY = {
  bouncer: { hop: 1.45, var: 0.1,  air: 1.0 },  // springy, steady rhythm
  rebound: { hop: 0.95, var: 0.12, air: 1.15 }, // lower, quicker little hops
  ascent:  { hop: 2.15, var: 0.08, air: 0.85 }, // tall, floaty
  summit:  { hop: 0.8,  var: 0.06, air: 1.25 }, // heavy boulder: low, slow, thuddy
};
function makeBall(game, slot, n) {
  const ghost = !!game.ghost, r = ghost ? BR * 0.72 : BR;
  const p = PERSONALITY[game.id] || { hop: rnd(1.1, 1.8), var: 0.1, air: 1 };
  const b = { game, ghost, r, m: r * r, rgb: hexRgb(ghost ? '#a9c3da' : game.color), slot, p: ghost ? { hop: 1.1, var: 0.15, air: 0.85 } : p,
    x: camX - R * 2 - (n - slot) * R * 2.4, y: GY - r - rnd(R, R * 3), vx: V * 1.6, vy: 0,

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const targetScale = modalOpen ? 0.2 : 1; timeScale += (targetScale - timeScale) * Math.min(1, real * 5);
  const dt = real * timeScale;
  if (ptr && ptr.ball) {
    const b = ptr.ball, tx = clamp(screenToWorld(ptr.x) + ptr.ox, camX + b.r, camX + W - b.r), ty = clamp(ptr.y + ptr.oy, b.r, GY - b.r);
    b.vx = (tx - b.x) / Math.max(real, 0.008); b.vy = (ty - b.y) / Math.max(real, 0.008); b.x += (tx - b.x) * 0.6; b.y += (ty - b.y) * 0.6;
  }
  spawnCourse();
  acc += dt; const h = 1 / 120; let n = 0; while (acc >= h && n < 10) { step(h); acc -= h; n++; }
  for (const b of balls) { b.sqv += (-170 * b.sq - 10 * b.sqv) * real; b.sq += b.sqv * real; b.glow = Math.max(0, b.glow - real * 1.2); }
  maybeLeapfrog(now);
  render(now);
  requestAnimationFrame(frame);
}

// ---------- sharing ----------
async function shareIt(data, label) {
  const r = await S.share(data);
  if (r === 'copied') toast('Link copied · paste it anywhere');
  else if (r === 'failed') toast(data.url);
  if (r !== 'cancelled') S.track(label, 'Shared ' + label);
}
$('#bShare').addEventListener('click', () => shareIt({ title: 'Bounce Lab', text: 'Bounce Lab: a little arcade of physics ball games. Come play.', url: S.siteUrl() }, 'lobby/share'));

// ---------- game card ----------
// Kept deliberately short: what it is, how to play, Play. Scores, rating and old versions sit quietly below.
let cur = null;
// Paint the real 3D ball into a card's little canvas.
function paintOrb(el, b) {
  const css = el.clientWidth || 58; el.width = el.height = Math.round(css * DPR);
  const g = el.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, css, css);
  const k = (css / 2) / b.r, sz = (b.base.width / DPR) * k; g.translate(css / 2, css / 2); drawBall(g, b, sz);
}
function openSheet(el) { modalOpen = true; document.body.classList.add('modal'); el.classList.add('on'); el.querySelector('.scroll').scrollTop = 0; }

  // older versions only (the current one is what Play opens)

  $('#cVers').innerHTML = old.map(v => `<a href="games/${encodeURIComponent(g.id)}/${esc(v.file)}"><span>${esc(v.v)}</span>${esc(v.name || '')}</a>`).join('');
  $('#cText').value = ''; $('#cFbMsg').textContent = ''; $('#rateMsg').textContent = '';
  const mine = +S.ls.get('bouncelab-rating:' + g.id + ':' + g.version, 0) || 0;

  $('#list').classList.remove('on'); openSheet(card); paintOrb($('#cOrb'), b);

    $('#cLb').innerHTML = rows.map((r, i) => `<li><span class="p">${i + 1}</span><span class="nm">${esc(r.name || 'anon')}</span><span class="s">${fmt(r.score)}</span></li>`).join('');
    $('#cLbMsg').textContent = rows.length ? '' : 'No scores yet. Yours could be first.';
  }).catch(() => { if (cur === g) $('#cLbMsg').textContent = 'Scores are offline right now.'; });
}
function closeModals() {
  modalOpen = false; cur = null; document.body.classList.remove('modal'); $('#card').classList.remove('on'); $('#list').classList.remove('on');
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
$('#scrim').addEventListener('click', closeModals);
document.querySelectorAll('.sheet .x').forEach(x => x.addEventListener('click', closeModals));
addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

// Rating: one tap saves it. A note box appears for anyone who wants to say more.
$('#cStars').innerHTML = [1, 2, 3, 4, 5].map(i => `<button data-s="${i}" aria-label="${i} star${i > 1 ? 's' : ''}">&#9733;</button>`).join('');
function paintCardStars(n) { $('#cStars').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.s <= n)); $('#cStars').dataset.v = n; }
$('#cStars').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn || !cur) return;
  const g = cur, stars = +btn.dataset.s, key = 'bouncelab-rating:' + g.id + ':' + g.version, prev = +S.ls.get(key, 0) || 0;
  paintCardStars(stars); $('#cNote').classList.add('on');
  if (stars === prev) return;
  S.ls.set(key, stars);
  try { await S.rate(g.id, stars, prev); S.track(g.id + '/rate-' + stars, 'Rated ' + stars); if (cur === g) $('#rateMsg').textContent = 'Rating saved. Thanks!'; }
  catch (err) { S.ls.set(key, prev); if (cur === g) $('#rateMsg').textContent = 'Couldn’t save your rating. Tap a star to try again.'; }
});
$('#cSend').addEventListener('click', async () => {
  if (!cur) return; const g = cur, stars = +$('#cStars').dataset.v || 0, text = $('#cText').value.trim();
  if (!text) { $('#cFbMsg').textContent = 'Write a note first.'; return; }
  const btn = $('#cSend'); btn.disabled = true; $('#cFbMsg').textContent = 'Sending…';
  try {
    await S.sendFeedback(g.id, { stars: stars || null, text, name: S.ls.get('bouncelab-name', ''), v: g.version, score: null });
    S.track(g.id + '/feedback', 'Sent feedback');
    $('#cText').value = ''; $('#cFbMsg').textContent = 'Note sent. Thank you!';
  } catch (e) { $('#cFbMsg').textContent = 'Couldn’t send. Check your connection and try again.'; }
  btn.disabled = false;
});

function launch(g, href, b) {
  S.track('lobby/play-' + g.id, 'Lobby: play ' + g.title);
  const w = $('#wipe'), cx = b ? b.x - camX : W / 2, cy = b ? b.y : H / 2;
  w.style.background = `radial-gradient(circle at ${cx}px ${cy}px, ${g.color} 0%, #050507 65%)`;
  w.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
  tone(330, 0.08, 0.3, 'sine', 0, 1); tone(660, 0.06, 0.4, 'sine', 0.08, 1);
  requestAnimationFrame(() => { w.style.clipPath = `circle(${Math.hypot(W, H)}px at ${cx}px ${cy}px)`; });
  setTimeout(() => { location.href = href; }, REDUCED ? 50 : 520);
}
addEventListener('pageshow', e => { if (e.persisted) { $('#wipe').style.clipPath = 'circle(0px at 50% 50%)'; closeModals(); } });

// ---------- list view ----------
$('#bList').addEventListener('click', () => {
  $('#lItems').innerHTML = GAMES.map(g => `<div class="gc" style="--c:${esc(g.color)}" data-id="${esc(g.id)}" role="button" tabindex="0"><canvas class="orb"></canvas><span class="t"><b>${esc(g.title)}</b><small>${esc(g.tagline || '')}</small></span><button class="go">Play</button></div>`).join('') || '<p class="muted">No games yet.</p>';
  openSheet($('#list'));
  $('#lItems').querySelectorAll('.gc').forEach(el => { const b = balls.find(x => x.game && x.game.id === el.dataset.id); if (b) paintOrb(el.querySelector('canvas.orb'), b); });
});
$('#lItems').addEventListener('click', e => {
  const el = e.target.closest('.gc'); if (!el) return;
  const b = balls.find(x => x.game && x.game.id === el.dataset.id);
  if (e.target.closest('.go')) launch(b.game, 'games/' + encodeURIComponent(b.game.id) + '/index.html', null); else openCard(b);
});
$('#lItems').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('gc')) e.target.click(); });
$('#bSound').addEventListener('click', () => { muted = !muted; S.ls.set('bouncelab-lobby-muted', muted); if (!muted) { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); tone(660, 0.06, 0.15, 'sine', 0, 1); } syncSound(); });

// ---------- install as an app ----------
// Android/desktop Chrome offer an install prompt; we show an install button only when it's available.
// (On iPhone: Share, then "Add to Home Screen".)
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.body.classList.add('can-install'); });
addEventListener('appinstalled', () => { installEvt = null; document.body.classList.remove('can-install'); toast('Installed. Find Bounce Lab on your home screen.'); S.track('lobby/installed', 'Installed app'); });
$('#bInstall').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); if (r && r.outcome === 'accepted') document.body.classList.remove('can-install'); installEvt = null; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- boot ----------
const DAY = 864e5;
// only the most recently added game gets a "New" tag, and only for its first week
const newest = GAMES.slice().sort((a, b) => String(b.added || '').localeCompare(String(a.added || '')))[0];
if (newest) { const u = Date.parse((newest.added || '') + 'T12:00'); newest.isNew = !!u && Date.now() - u < 7 * DAY; }
addEventListener('resize', layout);
init();
requestAnimationFrame(() => setGravity(1, true)); paintPower();
addEventListener('resize', () => setGravity(gMul, true));
if (document.fonts && document.fonts.load) document.fonts.load('600 20px "Chakra Petch"').then(() => { for (const b of balls) b.sprite = makeSprite(b); }).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
if (/[?&]debug/.test(location.search)) window.__lobby = { get balls() { return balls; }, get camX() { return camX; }, get cells() { return cells; }, get score() { return score; }, surge, setGravity, collectCell, markPlayed };
// deep link: index.html#ascent opens that game's card
if (location.hash.length > 1) { const b = balls.find(x => x.game && x.game.id === decodeURIComponent(location.hash.slice(1))); if (b) setTimeout(() => openCard(b), 900); }
})();
</script>
</body>
</html>
