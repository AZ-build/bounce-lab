<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bounce Lab">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smashball · Bounce Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
  :root { --you: #3ef6ff; --bot: #ff3fb4; --gold: #ffc23a; --hot: #ff8a3a; --text: #e8f1ff; --soft: #a9b4c6; --mute: #677285;
    --sign: "Tilt Neon", system-ui, sans-serif; --f: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
    --bezel: linear-gradient(180deg, #9aa1ab, #3a3f47 30%, #1b1d22 60%, #4b515a); }
  /* a realistic neon tube (same as the lobby) */
  .neon { --n: var(--you); color: color-mix(in srgb, var(--n) 25%, #fff); text-shadow: 0 0 1px #fff, 0 0 4px var(--n), 0 0 10px var(--n), 0 0 22px color-mix(in srgb, var(--n) 70%, transparent); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020308; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: var(--f); color: var(--text); -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .hide { display: none !important; }

  /* scoreboard */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
  #hudL { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; }
  #pts { --n: var(--gold); font: 700 17px/1 var(--f); font-variant-numeric: tabular-nums; }
  #ptsL { font: 600 9px var(--f); letter-spacing: .28em; color: var(--mute); }
  #board { padding: 3px; border-radius: 12px; background: var(--bezel); box-shadow: 0 8px 22px rgba(0,0,0,.7); }
  #board .scr { display: flex; align-items: stretch; border-radius: 9px; background: #050607; overflow: hidden;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); box-shadow: inset 0 2px 10px rgba(0,0,0,.9); }
  .side { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px 12px 6px; min-width: 56px; }
  .side small { font: 600 9px var(--f); letter-spacing: .28em; color: var(--mute); padding-left: .28em; }
  .side b { font: 700 26px/1 var(--f); font-variant-numeric: tabular-nums; }
  #sYou b { --n: var(--you); } #sBot b { --n: var(--bot); }
  #gYou.bump { animation: bump 1s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 15% { transform: scale(1.7); --n: var(--gold); } 60% { transform: scale(1.15); --n: var(--gold); } 100% { transform: scale(1); } }
  #clock { display: grid; place-items: center; padding: 0 8px; font: 700 16px var(--f); letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--text);
    border-left: 1px solid rgba(255,255,255,.06); border-right: 1px solid rgba(255,255,255,.06); min-width: 60px; }
  #clock.gold { color: #fff3d6; text-shadow: 0 0 4px var(--gold), 0 0 10px var(--gold); font-size: 11px; letter-spacing: .14em; }
  #clock.low { color: #ff9a7a; }
  #hudR { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  #mute { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #dfe7f2; border: 0; padding: 0;
    background: radial-gradient(circle at 50% 28%, rgba(255,255,255,.2), rgba(255,255,255,0) 55%), conic-gradient(from 20deg, #2a2e35, #5f656f, #22252b, #4b515a, #2a2e35, #5f656f, #22252b, #4b515a, #2a2e35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.6); }
  #mute svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #mute.off { color: var(--mute); }

  #banner { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -10px); text-align: center; pointer-events: none; opacity: 0; width: 92vw; }
  #banner.show { animation: ban 2.4s ease forwards; }
  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.9); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 6px); } }
  #bTitle { --n: var(--bc, var(--you)); font: 400 48px/1 var(--sign); }
  #bSub { margin-top: 8px; font: 600 14px var(--f); color: var(--soft); letter-spacing: .04em; text-shadow: 0 1px 6px #000; }

  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 0; top: 0; font: 700 17px var(--f); color: #fff3d6; text-shadow: 0 0 3px var(--gold), 0 0 8px rgba(255,194,58,.7), 0 1px 4px #000; white-space: nowrap; letter-spacing: .08em; will-change: transform, opacity; }
  .pop.dim { font-size: 13px; color: rgba(255,255,255,.7); text-shadow: none; }
  .pop.bot { color: var(--bot); text-shadow: 0 0 12px var(--bot); }

  /* floating joystick: appears wherever your thumb lands */
  #joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .12s;
    border: 1.5px solid rgba(255,255,255,.22); background: radial-gradient(circle, rgba(62,246,255,.08), rgba(62,246,255,0) 70%); }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8f6ff, #7a8696 45%, #2a2f37 80%); box-shadow: 0 0 18px rgba(62,246,255,.55), inset 0 -3px 6px rgba(0,0,0,.5); }
  #tapFx { position: fixed; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; pointer-events: none; opacity: 0; border: 3px solid var(--gold); }
  #tapFx.go { animation: tapgo .35s ease-out; }
  @keyframes tapgo { from { opacity: 1; transform: scale(.5); } to { opacity: 0; transform: scale(1.4); } }

  #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 22px); text-align: center; font: 600 13px var(--f); letter-spacing: .06em; color: var(--soft); opacity: 0;
    pointer-events: none; transition: opacity .5s; text-shadow: 0 1px 6px #000; }
  #hint b { color: var(--gold); }
  #hint.on { opacity: .9; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 24px calc(env(safe-area-inset-bottom) + 84px); text-align: center;
    background: linear-gradient(to top, rgba(2,3,8,.95) 0%, rgba(2,3,8,.62) 45%, rgba(2,3,8,0) 72%); }
  .logo { --n: #ff9a3c; font: 400 clamp(52px, 15vw, 76px)/1 var(--sign); animation: power 1.4s steps(1) both .2s; }
  @keyframes power { 0% { opacity: .08 } 8% { opacity: .9 } 10% { opacity: .15 } 18% { opacity: 1 } 21% { opacity: .4 } 26%, 100% { opacity: 1 } }
  .tag { margin-top: 12px; font: 600 12px var(--f); letter-spacing: .32em; text-transform: uppercase; color: var(--mute); padding-left: .32em; }
  .how { margin: 20px 0 24px; display: grid; gap: 8px; font-size: 15px; color: var(--soft); }
  .how b { color: var(--text); }
  .how i { font-style: normal; color: var(--bot); font-weight: 700; }
  .btn { pointer-events: auto; height: 54px; padding: 0 34px; border-radius: 999px; font: 700 15px var(--f); letter-spacing: .16em; text-transform: uppercase; color: #f4ffff;
    border: 3px solid transparent; background: radial-gradient(120% 140% at 50% 0%, rgba(20,90,100,.9), rgba(4,22,26,.95)) padding-box, linear-gradient(180deg, #9aa1ab, #3a3f47 30%, #1b1d22 55%, #5b616b 80%, #22252b) border-box;
    box-shadow: 0 0 6px var(--you), 0 0 20px rgba(62,246,255,.5), 0 8px 24px rgba(0,0,0,.7), inset 0 0 0 1.5px #b9fbff, inset 0 0 14px rgba(62,246,255,.5); text-shadow: 0 0 1px #fff, 0 0 10px var(--you); }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .btn:active { transform: scale(.97); }
  .small { margin-top: 14px; font: 600 12px var(--f); color: var(--mute); letter-spacing: .1em; min-height: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 26px; margin: 14px 0 22px; font-size: 14px; text-align: left; }
  .stats span { color: var(--mute); }
  .stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats b { text-align: right; }
  #oResult { font: 400 44px/1 var(--sign); }
  #oLine { margin-top: 8px; font: 700 22px var(--f); letter-spacing: .1em; color: var(--mute); }
  #oLine .y { --n: var(--you); } #oLine .b { --n: var(--bot); }
  #oScore { font: 700 58px/1 var(--f); color: var(--text); margin-top: 14px; font-variant-numeric: tabular-nums; }
  #oBest { margin-top: 4px; font: 600 12px var(--f); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(255,255,255,0) 40%, var(--fc, rgba(62,246,255,.5))); transition: opacity .45s; }
  #flash.on { opacity: 1; transition: none; }
</style>

<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="pops"></div>

<div id="hud" class="hide">
  <div id="hudL"><div id="pts" class="neon">0</div><div id="ptsL">POINTS</div></div>
  <div id="board"><div class="scr">
    <div class="side" id="sYou"><small>YOU</small><b id="gYou" class="neon">0</b></div>
    <div id="clock">2:00</div>
    <div class="side" id="sBot"><small>BOT</small><b id="gBot" class="neon">0</b></div>
  </div></div>
  <div id="hudR"><button id="mute" class="ui" aria-label="Sound"></button></div>
</div>
<div id="banner"><div id="bTitle" class="neon"></div><div id="bSub"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="tapFx"></div>
<div id="hint"></div>

<div id="title" class="screen ui">
  <div class="logo neon" id="logo">Smashball</div>
  <div class="tag">1v1 · lab arena</div>
  <div class="how">
    <div><b>Drag</b> anywhere to run. Up is always toward the ball.</div>
    <div><b>Tap</b> to jump and smash it hard.</div>
    <div>Score on the <i>bot</i>. Guard your goal. 2 minutes.</div>
  </div>
  <button id="playBtn" class="btn">KICK OFF</button>
  <div id="bestT" class="small"></div>
</div>

<div id="over" class="screen ui hide">
  <div id="oResult" class="neon">Full time</div>
  <div id="oLine"><span class="y neon">0</span> – <span class="b neon">0</span></div>
  <div id="oScore">0</div>
  <div id="oBest"></div>
  <div class="stats">
    <span>Goals</span><b id="oGoals">0</b>
    <span>Smash hits</span><b id="oSmash">0</b>
    <span>Touches</span><b id="oTouch">0</b>
    <span>Saves</span><b id="oSaves">0</b>
    <span>Hardest shot</span><b id="oFast">0 km/h</b>
  </div>
  <button id="againBtn" class="btn">REMATCH</button>
</div>
<script>/*GAME*/</script>
</body>
</html>
