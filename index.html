<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cy:#5ef2ff;--mg:#ff4fd8;--gd:#ffd84a;--bg:#05070f;--panel:rgba(10,14,28,.95);--line:rgba(140,220,255,.18);--txt:#e8f6ff;--dim:#8aa4b8}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden;font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas#c.hot{cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#hdr{position:fixed;left:0;right:0;top:0;padding:max(18px,env(safe-area-inset-top)) 20px 0;text-align:center;pointer-events:none}
#logo{font:900 clamp(30px,8.4vw,64px)/1 Orbitron,system-ui,sans-serif;letter-spacing:.14em;padding-left:.14em;background:linear-gradient(100deg,#9ff8ff 0%,var(--cy) 35%,#b49bff 65%,var(--mg) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(94,242,255,.35))}
#sub{margin-top:10px;font:700 11px Orbitron,system-ui,sans-serif;letter-spacing:.32em;color:var(--dim);padding-left:.32em}
#hint{margin:16px auto 0;max-width:420px;font-size:14px;color:#cfe8f5;transition:opacity .8s}
#hint b{color:var(--cy)}
body.played #hint{opacity:0}

#hud{position:fixed;top:calc(max(18px,env(safe-area-inset-top)) + clamp(64px,13vw,104px));left:50%;transform:translateX(-50%);display:flex;align-items:baseline;gap:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#hud .n{font:900 22px Orbitron,system-ui,sans-serif;color:var(--gd);text-shadow:0 0 14px rgba(255,216,74,.6)}
#hud .b{font:700 9px Orbitron,system-ui,sans-serif;letter-spacing:.25em;color:var(--dim)}
#combo{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);font:900 26px Orbitron,system-ui,sans-serif;color:var(--gd);text-shadow:0 0 20px rgba(255,216,74,.7);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#combo.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#dock{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:5px;background:rgba(10,14,28,.6);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
#dock button{white-space:nowrap;height:40px;min-width:44px;padding:0 12px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 11px Orbitron,system-ui,sans-serif;letter-spacing:.14em;color:#cfe8f5}
#dock button:active{background:rgba(255,255,255,.1)}
#dock button.on{color:var(--cy);background:rgba(94,242,255,.1)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 56px);font:700 9px Orbitron,system-ui,sans-serif;letter-spacing:.2em;color:#7d93a6;opacity:.7;pointer-events:none}

#scrim{position:fixed;inset:0;background:rgba(2,4,10,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
body.modal #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100vw);max-height:min(90vh,820px);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,1.1,.3,1);z-index:11;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translate(-50%,0)}
@media (min-width:760px) and (min-height:640px){.sheet{bottom:50%;border-radius:24px;border-bottom:1px solid var(--line);transform:translate(-50%,60%) scale(.96);opacity:0;transition:transform .4s cubic-bezier(.2,1.1,.3,1),opacity .3s;pointer-events:none}.sheet.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.sheet .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);font-size:22px;line-height:1;z-index:2}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.hero{position:relative;padding:26px 22px 18px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,var(--c) 0%,transparent 60%);opacity:.35}
.hero > *{position:relative}
.hero h2{font:900 32px/1 Orbitron,system-ui,sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 0 22px var(--c)}
.hero .tl{margin-top:8px;color:#cfe8f5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font:700 10px Orbitron,system-ui,sans-serif;letter-spacing:.14em;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:#cfe8f5;text-transform:uppercase}
.chip.c{border-color:var(--c);color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0 16px;background:var(--line);border-radius:14px;overflow:hidden}
.stats div{background:rgba(10,14,28,.95);padding:10px 6px;text-align:center;min-width:0}
.stats b{display:block;font:800 17px Orbitron,system-ui,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:10px;margin:16px}
.play{flex:1;display:block;padding:16px;border-radius:16px;font:900 18px Orbitron,system-ui,sans-serif;letter-spacing:.24em;color:#05070f;background:var(--c);box-shadow:0 0 30px var(--c),inset 0 -3px 0 rgba(0,0,0,.2);text-align:center;text-decoration:none}
.play:active,.shr:active{transform:scale(.97)}
.shr{width:62px;border-radius:16px;border:1px solid var(--c) !important;color:var(--c);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font:800 8px Orbitron,system-ui,sans-serif;letter-spacing:.14em}
.shr svg.i{width:22px;height:22px}
.sec{padding:6px 20px 14px}
.sec h3{font:800 11px Orbitron,system-ui,sans-serif;letter-spacing:.24em;color:var(--dim);margin:10px 0 8px}
.sec p{color:#d5e7f2}
.ctl{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:14px}
.ctl:before{content:"\261D  "}
ol.lb{list-style:none}
ol.lb li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 10px;border-radius:10px}
ol.lb li:nth-child(odd){background:rgba(255,255,255,.03)}
ol.lb .p{font-weight:900;color:var(--dim);text-align:center}
ol.lb li:first-child .p{color:var(--gd)}
ol.lb .s{font-weight:800;font-variant-numeric:tabular-nums}
.muted{color:var(--dim);font-size:13px}
.vers{display:flex;flex-wrap:wrap;gap:6px}
.vers a{padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#d5e7f2;text-decoration:none;font-size:13px}
.vers a b{font-family:Orbitron,system-ui,sans-serif;font-size:11px;color:var(--c);margin-right:5px}
.vers a.cur{border-color:var(--c)}
.stars{display:flex;gap:4px}
.stars button{font-size:30px;line-height:1;color:rgba(255,255,255,.22);padding:2px}
.stars button.on{color:var(--gd);text-shadow:0 0 10px rgba(255,216,74,.6)}
.fb select,.fb textarea{width:100%;font:inherit;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.fb select{margin:10px 0 8px}
.fb select option{background:#0b1020}
.fb textarea{min-height:90px;resize:vertical}
.fb .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.btn{padding:11px 18px;border-radius:12px;font:800 12px Orbitron,system-ui,sans-serif;letter-spacing:.14em;color:#05070f;background:var(--cy);white-space:nowrap}
.btn[disabled]{opacity:.5}
#list .scroll{padding:56px 14px 18px}
#list h2{font:900 20px Orbitron,system-ui,sans-serif;letter-spacing:.14em;padding:0 6px 12px}
.gc{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;text-align:left;width:100%}
.gc .dot{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--c) 30%,#000 110%);box-shadow:0 0 18px var(--c)}
.gc b{font:800 15px Orbitron,system-ui,sans-serif;letter-spacing:.06em;display:block}
.gc small{color:var(--dim);display:block}
.gc .go{font:800 11px Orbitron,system-ui,sans-serif;letter-spacing:.14em;color:var(--c);padding:10px 4px}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-160%);padding:10px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;transition:transform .35s;z-index:20;max-width:calc(100vw - 24px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;clip-path:circle(0px at 50% 50%);transition:clip-path .55s cubic-bezier(.6,0,.4,1)}
@media (prefers-reduced-motion:reduce){#wipe{transition:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Bounce Lab: a parade of game balls hopping along. Tap a ball to open its game, or use the Games button for a list."></canvas>

<header id="hdr">
  <div id="logo">BOUNCE LAB</div>
  <div id="sub">AN EXPERIMENTAL ARCADE</div>
  <div id="hint"><b>Tap a ball</b> to play it &middot; <b>tap anywhere</b> to make them jump &middot; <b>fling</b> them around</div>
</header>
<div id="hud"><div class="n">&#10022; <span id="hs">0</span></div><div class="b">BEST <span id="hb">0</span></div></div>
<div id="combo"></div>
<div id="demo"></div>

<nav id="dock" aria-label="Lobby controls">
  <button id="bList" aria-label="Show all games as a list"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>GAMES</button>
  <button id="bShare" aria-label="Share Bounce Lab"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>SHARE</button>
  <button id="bSound" aria-label="Sound on or off"><svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="sw" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
</nav>

<div id="scrim"></div>

<section id="card" class="sheet" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <button class="x" aria-label="Close">&times;</button>
  <div class="scroll">
    <div class="hero"><h2 id="cTitle"></h2><div class="tl" id="cTag"></div><div class="chips" id="cChips"></div></div>
    <div class="stats"><div><b id="cRate">&ndash;</b><span id="cRateN">rating</span></div><div><b id="cPlays">&ndash;</b><span>plays</span></div><div><b id="cTop">&ndash;</b><span id="cTopN">top score</span></div></div>
    <div class="acts">
      <a class="play" id="cPlay" href="#">PLAY</a>
      <button class="shr" id="cShare" aria-label="Share a link to this game"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>SHARE</button>
    </div>
    <div class="sec"><p id="cDesc"></p><div class="ctl" id="cCtl"></div></div>
    <div class="sec"><h3>LEADERBOARD</h3><ol class="lb" id="cLb"></ol><div class="muted" id="cLbMsg"></div></div>
    <div class="sec"><h3>EVERY VERSION</h3><div class="vers" id="cVers"></div></div>
    <div class="sec fb"><h3>LEAVE FEEDBACK</h3>
      <div class="stars" id="cStars"></div>
      <select id="cVer" aria-label="Which version"></select>
      <textarea id="cText" maxlength="1000" placeholder="What felt good? What didn't? What should change next?"></textarea>
      <div class="row"><span class="muted" id="cFbMsg"></span><button class="btn" id="cSend">SEND</button></div>
    </div>
  </div>
</section>

<section id="list" class="sheet" role="dialog" aria-modal="true" aria-label="All games">
  <button class="x" aria-label="Close">&times;</button>
  <div class="scroll"><h2>ALL GAMES</h2><div id="lItems"></div></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="wipe"></div>

<script src="lab/config.js"></script>
<script src="lab/store.js"></script>
<script src="games.js"></script>
<script>
(() => {
'use strict';
const S = window.BounceLabStore;
const GAMES = (window.BOUNCE_LAB_GAMES || []).filter(g => g && g.id);
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!S.online) $('#demo').textContent = 'DEMO MODE';

// ---------- world state ----------
let W = 0, H = 0, DPR = 1, R = 50, GY = 0, G = 2000, V = 100;   // GY = ground line (screen y), V = parade speed px/s
let camX = 0, timeScale = 1;
let balls = [], obs = [], stars = [], parts = [], texts = [], ripples = [];
let nextObsX = 0, nextStarX = 0, nextLeap = 0;
let score = 0, best = +S.ls.get('bouncelab-lobby-best', 0) || 0, comboN = 0, comboT = 0;
let modalOpen = false, played = false, t0 = performance.now();
$('#hb').textContent = best;

// ---------- colors ----------
function hexRgb(h) { h = String(h || '#5ef2ff').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, d, t) => c.map((v, i) => Math.round(v + (d[i] - v) * t));
const NEON = [[94, 242, 255], [255, 79, 216], [255, 216, 74], [124, 255, 178], [180, 155, 255]];

// ---------- ball sprites ----------
function drawIcon(g, kind, s) {
  g.save(); g.strokeStyle = 'rgba(255,255,255,.95)'; g.fillStyle = 'rgba(255,255,255,.95)'; g.lineWidth = Math.max(2, s * 0.12); g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'side') {
    g.beginPath(); g.moveTo(-s, -s * 0.75); g.lineTo(s * 0.2, -s * 0.75); g.moveTo(-s * 0.2, s * 0.75); g.lineTo(s, s * 0.75); g.stroke();
    g.beginPath(); g.arc(-s * 0.15, 0, s * 0.26, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(s * 0.35, 0); g.lineTo(s, 0); g.moveTo(s * 0.72, -s * 0.25); g.lineTo(s, 0); g.lineTo(s * 0.72, s * 0.25); g.stroke();
  } else if (kind === 'goal') {
    g.beginPath(); g.moveTo(-s, s * 0.7); g.lineTo(-s, -s * 0.55); g.lineTo(s, -s * 0.55); g.lineTo(s, s * 0.7); g.stroke();
    g.globalAlpha = .45; g.lineWidth *= .5; g.beginPath();
    for (let i = -0.5; i <= 0.5; i += 0.5) { g.moveTo(i * s * 1.6, -s * 0.55); g.lineTo(i * s * 1.6, s * 0.25); }
    g.moveTo(-s, -s * 0.15); g.lineTo(s, -s * 0.15); g.stroke(); g.globalAlpha = 1;
    g.beginPath(); g.arc(s * 0.15, s * 0.55, s * 0.26, 0, TAU); g.fill();
  } else if (kind === 'up') {
    g.beginPath(); g.moveTo(-s * 0.6, -s * 0.05); g.lineTo(0, -s * 0.6); g.lineTo(s * 0.6, -s * 0.05);
    g.moveTo(-s * 0.6, s * 0.4); g.lineTo(0, -s * 0.15); g.lineTo(s * 0.6, s * 0.4); g.stroke();
    g.beginPath(); g.moveTo(-s * 0.8, s * 0.85); g.quadraticCurveTo(0, s * 0.65, s * 0.8, s * 0.85); g.stroke();
  } else {
    g.font = `900 ${s * 1.6}px Orbitron, system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(kind || '•').slice(0, 1).toUpperCase(), 0, s * 0.1);
  }
  g.restore();
}
function makeSprite(b) {
  const pad = b.r * 0.9, size = Math.ceil((b.r + pad) * 2 * DPR);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(b.r + pad, b.r + pad);
  const r = b.r, col = b.rgb, light = mix(col, [255, 255, 255], 0.65), dark = mix(col, [0, 0, 10], 0.75);
  if (b.ghost) {
    g.setLineDash([r * 0.2, r * 0.16]); g.lineWidth = 2; g.strokeStyle = 'rgba(170,200,230,.55)'; g.beginPath(); g.arc(0, 0, r - 1, 0, TAU); g.stroke(); g.setLineDash([]);
    const gg = g.createRadialGradient(-r * .3, -r * .35, 0, 0, 0, r); gg.addColorStop(0, 'rgba(170,200,230,.2)'); gg.addColorStop(1, 'rgba(170,200,230,.03)');
    g.fillStyle = gg; g.beginPath(); g.arc(0, 0, r - 2, 0, TAU); g.fill();
    g.globalAlpha = .6; drawIcon(g, '?', r * 0.42); g.globalAlpha = 1;
    return c;
  }
  g.save(); g.shadowColor = rgba(col, 0.9); g.shadowBlur = r * 0.75; g.fillStyle = rgba(dark, 1); g.beginPath(); g.arc(0, 0, r * 0.98, 0, TAU); g.fill(); g.restore();
  const body = g.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.05, 0, 0, r);
  body.addColorStop(0, rgba(light, 1)); body.addColorStop(0.32, rgba(col, 1)); body.addColorStop(0.78, rgba(mix(col, [0, 0, 20], 0.55), 1)); body.addColorStop(1, rgba(mix(col, [0, 0, 10], 0.85), 1));
  g.fillStyle = body; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  const bl = g.createRadialGradient(r * 0.25, r * 0.7, 0, r * 0.25, r * 0.7, r * 0.8);
  bl.addColorStop(0, rgba(light, 0.45)); bl.addColorStop(1, rgba(light, 0));
  g.fillStyle = bl; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  g.lineWidth = Math.max(1.5, r * 0.035); g.strokeStyle = rgba(light, 0.7); g.beginPath(); g.arc(0, 0, r - g.lineWidth / 2, 0, TAU); g.stroke();
  g.save(); g.translate(-r * 0.38, -r * 0.5); g.rotate(-0.5); const sp = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.38);
  sp.addColorStop(0, 'rgba(255,255,255,.85)'); sp.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = sp; g.scale(1, 0.55); g.beginPath(); g.arc(0, 0, r * 0.38, 0, TAU); g.fill(); g.restore();
  g.save(); g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = r * 0.12; drawIcon(g, b.game.icon || b.game.title, r * 0.42); g.restore();
  return c;
}

// Each game ball has its own hop personality.
const PERSONALITY = {
  bouncer: { hop: 1.05, var: 0.25, air: 1.0 },  // springy, steady rhythm
  rebound: { hop: 0.55, var: 0.35, air: 1.4 },  // low, skimming, heavy
  ascent:  { hop: 1.75, var: 0.2,  air: 0.9 },  // tall, floaty
};
function makeBall(game, slot, n) {

    const dist = GY - (b.y + b.r); if (dist > R * 4) continue;
    const sz = b.sprite.width / DPR; ctx.globalAlpha = 0.2 * (1 - dist / (R * 4));
    ctx.save(); ctx.translate(b.x - camX, GY + (GY - b.y)); ctx.scale(1, -0.55); ctx.drawImage(b.sprite, -sz / 2, -sz / 2, sz, sz); ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.restore();
  ctx.shadowColor = 'rgba(94,242,255,.9)'; ctx.shadowBlur = 16; ctx.strokeStyle = 'rgba(140,245,255,.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GY); ctx.lineTo(W, GY); ctx.stroke(); ctx.shadowBlur = 0;

  // obstacles
  for (const o of obs) {
    const q = obsRect(o), x = q.l - camX; if (x > W + 20 || x + q.w < -20) continue;
    if (o.kind === 'spring') {
      const comp = o.k * q.h * 0.5, top = q.t + comp;
      ctx.strokeStyle = rgba(o.c, 0.9); ctx.lineWidth = 2; ctx.beginPath();
      const coils = 4; for (let k = 0; k <= coils * 2; k++) { const yy = GY - (GY - top - 4) * k / (coils * 2); ctx.lineTo(x + q.w * (k % 2 ? 0.75 : 0.25), yy); } ctx.stroke();
      ctx.shadowColor = rgba(o.c, 1); ctx.shadowBlur = 14; ctx.fillStyle = rgba(o.c, 0.95); ctx.fillRect(x - 2, top - 4, q.w + 4, 5); ctx.shadowBlur = 0;
      ctx.fillStyle = rgba(o.c, 0.15 + 0.3 * o.k); ctx.beginPath(); ctx.ellipse(x + q.w / 2, top - 8, q.w * 0.7, 6, 0, 0, TAU); ctx.fill();
      continue;
    }
    const gr = ctx.createLinearGradient(0, q.t, 0, GY); gr.addColorStop(0, rgba(mix(o.c, [10, 12, 40], 0.75), 0.95)); gr.addColorStop(1, 'rgba(8,10,28,.95)');
    ctx.fillStyle = gr; ctx.fillRect(x, q.t, q.w, q.h);
    ctx.strokeStyle = rgba(o.c, 0.35); ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, q.t + 0.5, q.w - 1, q.h - 1);
    ctx.shadowColor = rgba(o.c, 1); ctx.shadowBlur = 12; ctx.fillStyle = rgba(o.c, 0.95); ctx.fillRect(x, q.t, q.w, 3); ctx.shadowBlur = 0;
    ctx.fillStyle = rgba(o.c, 0.12); for (let yy = q.t + 10; yy < GY - 4; yy += 10) ctx.fillRect(x + 4, yy, q.w - 8, 1);
  }
  // stars
  for (const s of stars) {
    const x = s.x - camX; if (x < -40 || x > W + 40) continue;
    if (s.got) { const k = (now - s.gotT) / 400; if (k > 1) { s.gone = true; continue; } ctx.globalAlpha = 1 - k; }
    const tr = s.r * (1 + 0.12 * Math.sin(t * 5 + s.t)) * (s.got ? 1 + (now - s.gotT) / 200 : 1), y = s.y + Math.sin(t * 2 + s.t) * 4;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.8 + s.t);
    const tg = ctx.createRadialGradient(0, 0, 0, 0, 0, tr * 3); tg.addColorStop(0, 'rgba(255,216,74,.3)'); tg.addColorStop(1, 'rgba(255,216,74,0)'); ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(0, 0, tr * 3, 0, TAU); ctx.fill();
    ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 12; ctx.fillStyle = '#ffe58a'; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const ang = i * TAU / 8, rr = i % 2 ? tr * 0.4 : tr; ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); } ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // ripples
  for (const r of ripples) { r.t += 1 / 60; const k = r.t / r.life; ctx.strokeStyle = rgba(r.rgb, 0.45 * (1 - k)); ctx.lineWidth = 2 + 3 * (1 - k); ctx.beginPath(); ctx.arc(r.x - camX, r.y, r.r1 * (0.15 + 0.85 * Math.sqrt(k)), 0, TAU); ctx.stroke(); }
  ripples = ripples.filter(r => r.t < r.life);

  // ball shadows, trails, bodies
  for (const b of balls) {
    const x = b.x - camX, ht = GY - (b.y + b.r), a = clamp(1 - ht / (R * 5), 0.15, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.45 * a})`; ctx.beginPath(); ctx.ellipse(x, GY + 2, b.r * (0.5 + 0.5 * a), b.r * 0.12, 0, 0, TAU); ctx.fill();
    if (!b.ghost) { ctx.save(); ctx.translate(x, GY); ctx.scale(1, 0.22); const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r * 1.7); pg.addColorStop(0, rgba(b.rgb, 0.4 * a)); pg.addColorStop(1, rgba(b.rgb, 0)); ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill(); ctx.restore(); }
  }
  for (const b of balls) {
    b.trail.push(b.x, b.y); if (b.trail.length > 20) b.trail.splice(0, 2);
    if (b.ghost) continue;
    for (let i = 0; i < b.trail.length - 2; i += 2) { const k = i / b.trail.length; ctx.fillStyle = rgba(b.rgb, 0.08 * k); ctx.beginPath(); ctx.arc(b.trail[i] - camX - V * (b.trail.length - i) / 120, b.trail[i + 1], b.r * (0.35 + 0.6 * k), 0, TAU); ctx.fill(); }
  }
  for (const b of balls) {
    const x = b.x - camX, sz = b.sprite.width / DPR, s = clamp(b.sq, -0.3, 0.3);
    ctx.save(); ctx.translate(x, b.y);
    if (b.glow > 0.02 && !b.ghost) { const gg = ctx.createRadialGradient(0, 0, b.r * 0.8, 0, 0, b.r * 1.9); gg.addColorStop(0, rgba(b.rgb, 0.35 * b.glow)); gg.addColorStop(1, rgba(b.rgb, 0)); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.9, 0, TAU); ctx.fill(); }
    if (b.held) { ctx.strokeStyle = rgba(b.rgb, 0.7); ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 30; ctx.beginPath(); ctx.arc(0, 0, b.r + 9, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
    ctx.rotate(b.sqa); ctx.scale(1 + s, 1 - s * 0.85); ctx.rotate(-b.sqa);
    ctx.drawImage(b.sprite, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  }
  // name tags on the floor under each ball
  const fs = clamp(R * 0.24, 10, 15);
  ctx.font = `800 ${fs}px Orbitron, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const b of balls) {
    const x = clamp(b.x - camX, 40, W - 40), label = b.ghost ? 'SOON' : String(b.game.title || '').toUpperCase();
    ctx.fillStyle = b.ghost ? 'rgba(170,200,230,.5)' : rgba(b.rgb, 0.95); ctx.shadowColor = rgba(b.rgb, 0.8); ctx.shadowBlur = b.ghost ? 0 : 10;
    ctx.fillText(label.split('').join(String.fromCharCode(8202)), x, GY + 12);
    if (b.game.isNew && !b.ghost) { ctx.shadowBlur = 0; ctx.fillStyle = '#ffd84a'; ctx.font = `900 ${fs * 0.62}px Orbitron, system-ui, sans-serif`; ctx.fillText('NEW', x, GY + 14 + fs * 1.15); ctx.font = `800 ${fs}px Orbitron, system-ui, sans-serif`; }
  }
  ctx.shadowBlur = 0; ctx.textBaseline = 'alphabetic';
  // particles + texts
  for (const p of parts) { p.life -= 1 / 60; p.x += p.vx / 60 - V / 60; p.y += p.vy / 60; p.vy += G * 0.35 / 60; p.vx *= 0.98; const a = clamp(p.life / p.max, 0, 1); ctx.fillStyle = rgba(p.rgb, a); ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  parts = parts.filter(p => p.life > 0);
  for (const x of texts) { x.t += 1 / 60; const a = clamp(1 - x.t / 0.9, 0, 1); ctx.fillStyle = rgba(x.rgb, a); ctx.font = '900 20px Orbitron, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(x.s, x.x - camX, x.y - x.t * 50); }
  texts = texts.filter(x => x.t < 0.9);
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const targetScale = modalOpen ? 0.2 : 1; timeScale += (targetScale - timeScale) * Math.min(1, real * 5);
  const dt = real * timeScale;
  if (ptr && ptr.ball) {
    const b = ptr.ball, tx = clamp(screenToWorld(ptr.x) + ptr.ox, camX + b.r, camX + W - b.r), ty = clamp(ptr.y + ptr.oy, b.r, GY - b.r);
    b.vx = (tx - b.x) / Math.max(real, 0.008); b.vy = (ty - b.y) / Math.max(real, 0.008); b.x += (tx - b.x) * 0.6; b.y += (ty - b.y) * 0.6;
  }
  spawnCourse();
  acc += dt; const h = 1 / 120; let n = 0; while (acc >= h && n < 10) { step(h); acc -= h; n++; }
  for (const b of balls) { b.sqv += (-260 * b.sq - 14 * b.sqv) * real; b.sq += b.sqv * real; b.glow = Math.max(0, b.glow - real * 1.4); }
  maybeLeapfrog(now);
  render(now);
  requestAnimationFrame(frame);
}

// ---------- sharing ----------
async function shareIt(data, label) {
  const r = await S.share(data);
  if (r === 'copied') toast('Link copied · paste it anywhere');
  else if (r === 'failed') toast(data.url);
  if (r !== 'cancelled') S.track(label, 'Shared ' + label);
}
$('#bShare').addEventListener('click', () => shareIt({ title: 'Bounce Lab', text: 'Bounce Lab: a little arcade of physics ball games. Come play.', url: S.siteUrl() }, 'lobby/share'));

// ---------- game card ----------
let cur = null;
function openCard(b) {
  const g = b.game;
  if (b.ghost) { toast('More experiments brewing in the lab...'); return; }
  cur = g; modalOpen = true; document.body.classList.add('modal');
  const card = $('#card'); card.style.setProperty('--c', g.color || '#5ef2ff');
  $('#cTitle').textContent = g.title; $('#cTag').textContent = g.tagline || '';
  const chips = [`<span class="chip c">${esc(g.version || '')}${g.versionName ? ' &middot; ' + esc(g.versionName) : ''}</span>`, `<span class="chip">${esc(g.status || 'prototype')}</span>`];
  if (g.updated) chips.push(`<span class="chip">Updated ${esc(new Date(g.updated + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }))}</span>`);
  $('#cChips').innerHTML = chips.join('');
  $('#cDesc').textContent = g.description || ''; $('#cCtl').textContent = g.controls || ''; $('#cCtl').style.display = g.controls ? '' : 'none';
  const href = 'games/' + encodeURIComponent(g.id) + '/index.html';
  $('#cPlay').href = href; $('#cPlay').onclick = ev => { ev.preventDefault(); launch(g, href, b); };
  $('#cShare').onclick = () => shareIt({ title: g.title + ' · Bounce Lab', text: g.title + ': ' + (g.tagline || 'a Bounce Lab game') + '. Play it here:', url: S.siteUrl('games/' + g.id + '/') }, g.id + '/share');
  const vs = (g.versions || []).slice().reverse();
  $('#cVers').innerHTML = vs.length ? vs.map(v => `<a href="games/${encodeURIComponent(g.id)}/${esc(v.file)}" class="${v.v === g.version ? 'cur' : ''}"><b>${esc(v.v)}</b>${esc(v.name || '')}${v.v === g.version ? ' &middot; current' : ''}</a>`).join('') : '<span class="muted">Just the one so far.</span>';
  $('#cVer').innerHTML = (vs.length ? vs : [{ v: g.version }]).map(v => `<option value="${esc(v.v)}">${esc(v.v)}${v.name ? ' · ' + esc(v.name) : ''}${v.v === g.version ? ' (current)' : ''}</option>`).join('');
  $('#cText').value = ''; $('#cFbMsg').textContent = '';
  paintCardStars(S.ls.get('bouncelab-rating:' + g.id + ':' + g.version, 0));
  $('#cRate').innerHTML = '&ndash;'; $('#cPlays').innerHTML = '&ndash;'; $('#cTop').innerHTML = '&ndash;'; $('#cTopN').textContent = 'top score'; $('#cRateN').textContent = 'rating';
  $('#cLb').innerHTML = ''; $('#cLbMsg').textContent = 'Loading...';
  card.classList.add('on'); card.querySelector('.scroll').scrollTop = 0;
  try { history.replaceState(null, '', '#' + g.id); } catch (e) {}
  S.track('lobby/card-' + g.id, 'Lobby: opened ' + g.title);
  S.summary(g.id).then(s => {
    if (cur !== g) return;
    $('#cRate').innerHTML = s.ratingCount ? '&#9733; ' + (s.ratingSum / s.ratingCount).toFixed(1) : '&ndash;';
    $('#cRateN').textContent = s.ratingCount ? s.ratingCount + ' rating' + (s.ratingCount === 1 ? '' : 's') : 'no ratings yet';
    $('#cPlays').textContent = fmt(s.plays || 0);
  }).catch(() => {});
  S.topScores(g.id, 5).then(rows => {
    if (cur !== g) return;
    $('#cLb').innerHTML = rows.map((r, i) => `<li><span class="p">${i + 1}</span><span>${esc(r.name || 'anon')}</span><span class="s">${fmt(r.score)}</span></li>`).join('');
    $('#cLbMsg').textContent = rows.length ? '' : 'No scores yet. Be the first!';
    if (rows[0]) { $('#cTop').textContent = fmt(rows[0].score); $('#cTopN').textContent = rows[0].name || 'top score'; }
  }).catch(() => { if (cur === g) $('#cLbMsg').textContent = 'Leaderboard offline.'; });
}
function closeModals() {
  modalOpen = false; cur = null; document.body.classList.remove('modal'); $('#card').classList.remove('on'); $('#list').classList.remove('on');
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
$('#scrim').addEventListener('click', closeModals);
document.querySelectorAll('.sheet .x').forEach(x => x.addEventListener('click', closeModals));
addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

$('#cStars').innerHTML = [1, 2, 3, 4, 5].map(i => `<button data-s="${i}" aria-label="${i} stars">&#9733;</button>`).join('');
function paintCardStars(n) { $('#cStars').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.s <= n)); $('#cStars').dataset.v = n; }
$('#cStars').addEventListener('click', e => { const b = e.target.closest('button'); if (b) paintCardStars(+b.dataset.s); });
$('#cSend').addEventListener('click', async () => {
  if (!cur) return; const g = cur, v = $('#cVer').value, stars = +$('#cStars').dataset.v || 0, text = $('#cText').value.trim();
  if (!stars && !text) { $('#cFbMsg').textContent = 'Pick some stars or write a note.'; return; }
  const btn = $('#cSend'); btn.disabled = true; $('#cFbMsg').textContent = 'Sending...';
  try {
    const key = 'bouncelab-rating:' + g.id + ':' + v, prev = S.ls.get(key, 0);
    if (stars && stars !== prev) { S.ls.set(key, stars); await S.rate(g.id, stars, prev || 0); S.track(g.id + '/rate-' + stars, 'Rated ' + stars); }
    await S.sendFeedback(g.id, { stars: stars || null, text: text || '(rating only)', name: S.ls.get('bouncelab-name', ''), v, score: null });
    S.track(g.id + '/feedback', 'Sent feedback');
    $('#cText').value = ''; $('#cFbMsg').textContent = 'Thanks! Logged in the lab notebook.';
  } catch (e) { $('#cFbMsg').textContent = 'Could not send. Try again.'; }
  btn.disabled = false;
});

function launch(g, href, b) {
  S.track('lobby/play-' + g.id, 'Lobby: play ' + g.title);
  const w = $('#wipe'), cx = b ? b.x - camX : W / 2, cy = b ? b.y : H / 2;
  w.style.background = `radial-gradient(circle at ${cx}px ${cy}px, ${g.color} 0%, #05070f 70%)`;
  w.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
  tone(330, 0.1, 0.3, 'triangle', 0, 1); tone(660, 0.08, 0.4, 'triangle', 0.08, 1);
  requestAnimationFrame(() => { w.style.clipPath = `circle(${Math.hypot(W, H)}px at ${cx}px ${cy}px)`; });
  setTimeout(() => { location.href = href; }, REDUCED ? 50 : 520);
}
addEventListener('pageshow', e => { if (e.persisted) { $('#wipe').style.clipPath = 'circle(0px at 50% 50%)'; closeModals(); } });

// ---------- list view ----------
$('#bList').addEventListener('click', () => {
  $('#lItems').innerHTML = GAMES.map(g => `<div class="gc" style="--c:${esc(g.color)}" data-id="${esc(g.id)}" role="button" tabindex="0"><span class="dot"></span><span><b>${esc(g.title)}</b><small>${esc(g.tagline || '')}</small><small>${esc(g.version || '')}${g.versionName ? ' · ' + esc(g.versionName) : ''}</small></span><button class="go">PLAY &#9654;</button></div>`).join('') || '<p class="muted">No games yet.</p>';
  modalOpen = true; document.body.classList.add('modal'); $('#list').classList.add('on');
});
$('#lItems').addEventListener('click', e => {
  const el = e.target.closest('.gc'); if (!el) return;
  const b = balls.find(x => x.game && x.game.id === el.dataset.id); $('#list').classList.remove('on');
  if (e.target.closest('.go')) { launch(b.game, 'games/' + encodeURIComponent(b.game.id) + '/index.html', null); } else openCard(b);
});
$('#bSound').addEventListener('click', () => { muted = !muted; S.ls.set('bouncelab-lobby-muted', muted); if (!muted) { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); tone(660, 0.08, 0.15, 'triangle', 0, 1); } syncSound(); });

// ---------- boot ----------
const DAY = 864e5;
for (const g of GAMES) { const u = Date.parse((g.updated || g.added || '') + 'T12:00'); g.isNew = u && Date.now() - u < 5 * DAY; }
addEventListener('resize', layout);
init();
if (document.fonts && document.fonts.load) document.fonts.load('800 20px Orbitron').then(() => { for (const b of balls) b.sprite = makeSprite(b); }).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
if (/[?&]debug/.test(location.search)) window.__lobby = { get balls() { return balls; }, get camX() { return camX; }, get stars() { return stars; }, get score() { return score; }, jumpAll };
// deep link: index.html#ascent opens that game's card
if (location.hash.length > 1) { const b = balls.find(x => x.game && x.game.id === decodeURIComponent(location.hash.slice(1))); if (b) setTimeout(() => openCard(b), 900); }
})();
</script>
</body>
