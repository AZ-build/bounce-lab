<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bounce Lab">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Template · Bounce Lab</title>
<!-- ▼ THE ONE LINE that connects a game to the lab. Change data-game to this folder's name.
     data-menus="own" = this game has its own menus (it must: see below), so the lab hides its corner chips. -->
<script src="../../lab/lab.js?v=1.11" data-game="_template" data-version="v1" data-menus="own"></script>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;color:#e8f6ff;font:600 16px system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #score{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:40px;font-weight:900;pointer-events:none}
  #pauseBtn{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:1px solid #5ef2ff55;background:#05070fcc;color:#e8f6ff;font-weight:900;display:none}
  body.playing #pauseBtn{display:block}
  /* every menu screen: scrolls on short phones, first child pushed down with margin-top:auto */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:10px;overflow-y:auto;text-align:center;touch-action:pan-y;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:#05070fdd}
  .screen.on{display:flex}
  .screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
  #over{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}   /* room for the lab's game-over bar */
  h1,h2{margin:0 0 8px;letter-spacing:.2em;color:#5ef2ff;text-shadow:0 0 20px #5ef2ff}
  button.m{min-width:220px;padding:13px 20px;border-radius:999px;border:1px solid #5ef2ff66;background:#0b1424;color:#e8f6ff;font:700 14px system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase}
  button.m.go{background:#5ef2ff;color:#05070f}
  #lbList{width:min(340px,100%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score"></div>
<button id="pauseBtn" aria-label="Pause">II</button>
<!-- MAIN MENU: play, how to play, leaderboard, settings, back to the lab -->
<div id="title" class="screen on"><h1>KEEPY UPPY</h1>
  <button class="m go" id="playBtn">Play</button><button class="m" data-open="how">How to play</button><button class="m" data-open="lb">Leaderboard</button>
  <button class="m" data-open="set">Settings</button><button class="m" data-lab>&#9664; Back to the lab</button></div>
<!-- PAUSE MENU: resume, restart, how to play, leaderboard, settings, main menu, back to the lab -->
<div id="pause" class="screen"><h2>PAUSED</h2>
  <button class="m go" id="resumeBtn">Resume</button><button class="m" id="restartBtn">Restart</button><button class="m" data-open="how">How to play</button>
  <button class="m" data-open="lb">Leaderboard</button><button class="m" data-open="set">Settings</button><button class="m" id="quitBtn">Main menu</button><button class="m" data-lab>&#9664; Back to the lab</button></div>
<div id="over" class="screen"><h2 id="overMsg">GAME OVER</h2><button class="m go" id="againBtn">Again</button><button class="m" data-open="lb">Leaderboard</button><button class="m" id="overMenuBtn">Main menu</button></div>
<!-- SUB-SCREENS: each goes back to whichever menu opened it -->
<div id="how" class="screen"><h2>HOW TO PLAY</h2><div>Tap the ball to kick it up.<br>Don't let it touch the floor.</div><button class="m go" data-back>Got it</button></div>
<div id="lb" class="screen"><h2>LEADERBOARD</h2><div id="lbList"></div><button class="m go" data-back>Back</button></div>
<div id="set" class="screen"><h2>SETTINGS</h2><button class="m" id="soundBtn">Sound: on</button><button class="m go" data-back>Done</button></div>
<script>
// A tiny example game showing the lab hooks and the menus every game needs.
//   BounceLab.start()                  a run started
//   BounceLab.gameOver(score, stats)   a run ended (the lab shows its bar: scores, share, rating)
//   BounceLab.menu()                   back on the main menu
//   BounceLab.leaderboard(el, {n})     fill your own leaderboard screen with the top scores
//   BounceLab.exit()                   back to the lab
// Your game owns its pause button, pause menu and main menu (see the screens above), and styles them its own way.
const $ = id => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d');
let W, H, ball, score = 0, state = 'title', paused = false, muted = false, back = 'title';
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function openSub(id) { back = paused ? 'pause' : state === 'over' ? 'over' : 'title'; show(id); if (id === 'lb') window.BounceLab && BounceLab.leaderboard($('lbList'), { n: 10 }); }
function start() {
  ball = { x: W / 2, y: H * 0.4, vx: 0, vy: -600, r: Math.min(W, H) * 0.07 };
  score = 0; state = 'play'; paused = false; show(null); document.body.classList.add('playing');
  window.BounceLab && BounceLab.start();                 // ◀ hook: a run started
}
function over() {
  state = 'over'; document.body.classList.remove('playing');
  $('overMsg').textContent = 'SCORE ' + score; show('over');
  window.BounceLab && BounceLab.gameOver(score, { kicks: score });   // ◀ hook: a run ended
}
function pauseGame() { if (state !== 'play' || paused) return; paused = true; show('pause'); }
function resumeGame() { paused = false; last = performance.now(); show(null); }
function toMenu() { paused = false; state = 'title'; ball = null; document.body.classList.remove('playing'); show('title'); window.BounceLab && BounceLab.menu(); }
document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSub(b.dataset.open));
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show(back));
document.querySelectorAll('[data-lab]').forEach(b => b.onclick = () => window.BounceLab ? BounceLab.exit() : (location.href = '../../index.html'));
$('playBtn').onclick = $('againBtn').onclick = start; $('restartBtn').onclick = start;
$('pauseBtn').onclick = pauseGame; $('resumeBtn').onclick = resumeGame; $('quitBtn').onclick = $('overMenuBtn').onclick = toMenu;
$('soundBtn').onclick = () => { muted = !muted; $('soundBtn').textContent = 'Sound: ' + (muted ? 'off' : 'on'); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'p') paused ? resumeGame() : pauseGame(); });
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || paused) return;
  const dx = e.clientX - ball.x, dy = e.clientY - ball.y;
  if (Math.hypot(dx, dy) < ball.r * 1.8) { ball.vy = -H * 1.3; ball.vx = -dx * 6; score++; }
});
let last = performance.now();
(function loop(now) {
  if (paused) { last = now; return requestAnimationFrame(loop); }
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
  if (state === 'play') {
    ball.vy += H * 2 * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x < ball.r || ball.x > W - ball.r) { ball.vx *= -0.9; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); }
    if (ball.y > H - ball.r) over();
  }
  if (ball) { ctx.shadowColor = '#5ef2ff'; ctx.shadowBlur = 30; ctx.fillStyle = '#5ef2ff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
  $('score').textContent = state === 'play' ? score : '';
  requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
