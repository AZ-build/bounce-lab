<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --night:#0e1230; --dusk:#2b2660; --sheet:#151937; --raise:#1d2246;
  --text:#eef0ff; --soft:#b7bbe0; --mute:#7f84b0; --line:rgba(190,195,255,.12);
  --sun:#ffc94d; --f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%;background:var(--night);color:var(--text);overflow:hidden;font:400 16px/1.45 var(--f);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas#c.hot{cursor:pointer}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
#hdr{position:fixed;left:0;right:0;top:0;padding:max(22px,env(safe-area-inset-top)) 22px 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#logo{font:800 clamp(30px,8.5vw,48px)/.95 var(--f);font-variation-settings:"opsz" 96;letter-spacing:-.035em}
#sub{margin-top:8px;font-size:15px;color:var(--soft);max-width:30ch}
#hint{margin-top:4px;font-size:15px;color:var(--mute);transition:opacity .8s}
body.played #hint{opacity:0}
.round{pointer-events:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--soft);background:rgba(255,255,255,.06)}
.round:active{background:rgba(255,255,255,.14)}
.round.off{color:var(--mute)}

#hud{position:fixed;left:22px;top:calc(max(22px,env(safe-area-inset-top)) + clamp(96px,22vw,118px));display:flex;align-items:baseline;gap:14px;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#hud .n{font:700 24px var(--f);color:var(--sun);font-variant-numeric:tabular-nums}
#hud .b{font-size:14px;color:var(--mute)}
#combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.85);font:800 28px var(--f);color:var(--sun);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#combo.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* bottom dock */
#dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:5}
#bList{height:50px;padding:0 24px;border-radius:999px;background:var(--text);color:var(--night);font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#bList:active{transform:scale(.97)}
#dock .round{width:50px;height:50px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#bInstall{display:none}
body.can-install #bInstall{display:grid}
#demo{position:fixed;right:22px;bottom:max(18px,env(safe-area-inset-bottom));font-size:12px;color:var(--mute);pointer-events:none;line-height:50px}

/* sheets */
#scrim{position:fixed;inset:0;background:rgba(5,7,20,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
body.modal #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(460px,100vw);max-height:min(88vh,780px);transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,1,.3,1);z-index:11;background:var(--sheet);border-radius:28px 28px 0 0;box-shadow:0 -20px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:translate(-50%,0)}
.sheet:before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(255,255,255,.18)}
@media (min-width:760px) and (min-height:640px){.sheet{bottom:50%;border-radius:28px;transform:translate(-50%,58%) scale(.97);opacity:0;transition:transform .4s cubic-bezier(.2,1,.3,1),opacity .3s;pointer-events:none}.sheet:before{display:none}.sheet.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.sheet .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--raise);box-shadow:0 2px 12px rgba(0,0,0,.3);color:var(--soft);display:grid;place-items:center;z-index:2}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:30px 24px max(24px,env(safe-area-inset-bottom))}

/* game card */
.ch{display:flex;align-items:center;gap:16px;padding-right:40px}
.orb{width:56px;height:56px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff 0%,var(--c) 32%,color-mix(in srgb,var(--c) 45%,#000) 100%);box-shadow:0 6px 24px color-mix(in srgb,var(--c) 45%,transparent)}
.ch h2{font:800 30px/1 var(--f);font-variation-settings:"opsz" 96;letter-spacing:-.03em}
.ch .new{display:inline-block;vertical-align:middle;margin-left:8px;padding:3px 8px;border-radius:999px;background:var(--sun);color:var(--night);font:700 12px/1.2 var(--f);letter-spacing:0;position:relative;top:-3px}
.ch p{margin-top:5px;color:var(--soft);font-size:15px}
.desc{margin-top:18px;color:var(--text);font-size:16px;max-width:42ch}
.how{margin-top:12px;display:flex;gap:10px;align-items:center;color:var(--soft);font-size:15px}
.how svg.i{color:var(--c)}
.acts{display:flex;gap:10px;margin-top:22px}
.play{flex:1;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 19px var(--f);color:var(--night);background:var(--c);text-decoration:none;box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.play svg{width:18px;height:18px;fill:currentColor}
.play:active,.shr:active{transform:scale(.97)}
.shr{width:58px;height:58px;border-radius:18px;background:var(--raise);color:var(--soft);display:grid;place-items:center}
.meta{display:flex;gap:18px;margin-top:14px;font-size:14px;color:var(--mute);justify-content:center}
.meta b{color:var(--soft);font-weight:600}
.meta:empty{display:none}
.blk{margin-top:28px}
.blk h3{font:700 17px var(--f);margin-bottom:10px}
ol.lb{list-style:none}
ol.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ol.lb li:first-child{border-top:0}
ol.lb .p{color:var(--mute);font-variant-numeric:tabular-nums}
ol.lb li:first-child .p{color:var(--sun)}
ol.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb .s{font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:14px}
.stars{display:flex;gap:2px;margin-left:-4px}
.stars button{font-size:32px;line-height:1;color:rgba(255,255,255,.16);padding:2px 4px;transition:transform .15s,color .15s}
.stars button.on{color:var(--sun)}
.stars button:active{transform:scale(1.25)}
.note{display:none;margin-top:12px}
.note.on{display:block}
.note textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:15px;color:var(--text);background:var(--raise);border:1px solid transparent;border-radius:14px;padding:12px 14px;outline:none;-webkit-user-select:text;user-select:text}
.note textarea:focus{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.note .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.btn{height:42px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;color:var(--night);background:var(--text);white-space:nowrap}
.btn[disabled]{opacity:.5}
#rateMsg{margin-top:6px;min-height:1.4em}
details.old{margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
details.old summary{list-style:none;cursor:pointer;color:var(--mute);font-size:14px;display:flex;align-items:center;gap:6px}
details.old summary::-webkit-details-marker{display:none}
details.old summary:after{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.old[open] summary:after{transform:rotate(-135deg) translateY(-1px)}
details.old p{margin:10px 0 8px}
.vers a{display:flex;gap:10px;padding:8px 0;color:var(--soft);text-decoration:none;font-size:14px}
.vers a span{color:var(--mute);width:26px;font-variant-numeric:tabular-nums}

/* list of games */
#list h2{font:800 26px var(--f);letter-spacing:-.03em;margin-bottom:14px}
.gc{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.gc:first-of-type{border-top:0}
.gc .orb{width:44px;height:44px}
.gc .t{flex:1;min-width:0}
.gc b{font-weight:700;font-size:17px;display:block}
.gc small{color:var(--mute);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .go{height:38px;padding:0 16px;border-radius:999px;background:var(--c);color:var(--night);font-weight:700;font-size:15px}

#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-160%);padding:11px 18px;border-radius:999px;background:var(--raise);color:var(--text);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,1.2,.4,1);z-index:20;max-width:calc(100vw - 24px);text-align:center}
#toast.on{transform:translate(-50%,0)}
#wipe{position:fixed;inset:0;z-index:30;pointer-events:none;clip-path:circle(0px at 50% 50%);transition:clip-path .55s cubic-bezier(.6,0,.4,1)}
@media (prefers-reduced-motion:reduce){#wipe,.sheet{transition:none}}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Bounce Lab: the game balls hop along together. Tap a ball to open its game, or use All games for a list."></canvas>

<header id="hdr">
  <div>
    <div id="logo">Bounce Lab</div>
    <div id="sub">A tiny arcade of bouncy games.</div>
    <div id="hint">Tap a ball to play it.</div>
  </div>
  <button class="round" id="bSound" aria-label="Sound on or off"><svg class="i" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="sw" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
</header>
<div id="hud"><div class="n">&#9733; <span id="hs">0</span></div><div class="b">Best <span id="hb">0</span></div></div>
<div id="combo"></div>
<div id="demo"></div>

<nav id="dock" aria-label="Lobby">
  <button id="bList">All games</button>
  <button class="round" id="bShare" aria-label="Share Bounce Lab"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg></button>
  <button class="round" id="bInstall" aria-label="Install Bounce Lab as an app"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
</nav>

<div id="scrim"></div>

<section id="card" class="sheet" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <button class="x" aria-label="Close"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="scroll">
    <div class="ch"><span class="orb"></span><div><h2 id="cTitle"></h2><p id="cTag"></p></div></div>
    <p class="desc" id="cDesc"></p>
    <p class="how" id="cCtl"><svg class="i" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a6.5 6.5 0 0 1-6.5 6.5h-.6a6 6 0 0 1-4.8-2.4L4.4 15a1.5 1.5 0 0 1 2.3-1.9L9 15.5"/></svg><span></span></p>
    <div class="acts">
      <a class="play" id="cPlay" href="#"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Play</a>
      <button class="shr" id="cShare" aria-label="Share a link to this game"><svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg></button>
    </div>
    <div class="meta" id="cMeta"></div>
    <div class="blk"><h3>Top scores</h3><ol class="lb" id="cLb"></ol><div class="muted" id="cLbMsg"></div></div>
    <div class="blk"><h3>Rate it</h3>
      <div class="stars" id="cStars"></div>
      <div class="muted" id="rateMsg"></div>
      <div class="note" id="cNote">
        <textarea id="cText" maxlength="1000" placeholder="What felt good? What should change?"></textarea>
        <div class="row"><span class="muted" id="cFbMsg"></span><button class="btn" id="cSend">Send note</button></div>
      </div>
    </div>
    <details class="old" id="cOld"><summary>Earlier versions</summary><p class="muted">Rough early drafts, kept for the curious.</p><div class="vers" id="cVers"></div></details>
  </div>
</section>

<section id="list" class="sheet" role="dialog" aria-modal="true" aria-label="All games">
  <button class="x" aria-label="Close"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="scroll"><h2>All games</h2><div id="lItems"></div></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<div id="wipe"></div>

<script src="lab/config.js?v=1.4"></script>
<script src="lab/store.js?v=1.4"></script>
<script src="games.js?v=1.4"></script>
<script>
(() => {
'use strict';
const S = window.BounceLabStore;
const GAMES = (window.BOUNCE_LAB_GAMES || []).filter(g => g && g.id);
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!S.online) $('#demo').textContent = 'Demo mode';

// ---------- world state ----------
let W = 0, H = 0, DPR = 1, R = 50, BR = 38, GY = 0, G = 2000, V = 100;   // R = course unit, BR = ball radius, GY = ground line, V = parade speed px/s
let camX = 0, timeScale = 1;
let balls = [], obs = [], stars = [], parts = [], texts = [], ripples = [];
let nextObsX = 0, nextStarX = 0, nextLeap = 0;
let score = 0, best = +S.ls.get('bouncelab-lobby-best', 0) || 0, comboN = 0, comboT = 0;
let modalOpen = false, played = false, t0 = performance.now();
$('#hb').textContent = best;

// ---------- colors ----------
function hexRgb(h) { h = String(h || '#5ef2ff').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, d, t) => c.map((v, i) => Math.round(v + (d[i] - v) * t));
// soft obstacle tints (the balls are the only loud colours on screen)
const NEON = [[120, 170, 255], [235, 140, 200], [255, 200, 110], [130, 220, 180], [170, 150, 255]];

// ---------- ball sprites ----------
function drawIcon(g, kind, s) {
  g.save(); g.strokeStyle = 'rgba(255,255,255,.95)'; g.fillStyle = 'rgba(255,255,255,.95)'; g.lineWidth = Math.max(2, s * 0.12); g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'side') {
    g.beginPath(); g.moveTo(-s, -s * 0.75); g.lineTo(s * 0.2, -s * 0.75); g.moveTo(-s * 0.2, s * 0.75); g.lineTo(s, s * 0.75); g.stroke();
    g.beginPath(); g.arc(-s * 0.15, 0, s * 0.26, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(s * 0.35, 0); g.lineTo(s, 0); g.moveTo(s * 0.72, -s * 0.25); g.lineTo(s, 0); g.lineTo(s * 0.72, s * 0.25); g.stroke();
  } else if (kind === 'goal') {
    g.beginPath(); g.moveTo(-s, s * 0.7); g.lineTo(-s, -s * 0.55); g.lineTo(s, -s * 0.55); g.lineTo(s, s * 0.7); g.stroke();
    g.globalAlpha = .45; g.lineWidth *= .5; g.beginPath();
    for (let i = -0.5; i <= 0.5; i += 0.5) { g.moveTo(i * s * 1.6, -s * 0.55); g.lineTo(i * s * 1.6, s * 0.25); }
    g.moveTo(-s, -s * 0.15); g.lineTo(s, -s * 0.15); g.stroke(); g.globalAlpha = 1;
    g.beginPath(); g.arc(s * 0.15, s * 0.55, s * 0.26, 0, TAU); g.fill();
  } else if (kind === 'up') {
    g.beginPath(); g.moveTo(-s * 0.6, -s * 0.05); g.lineTo(0, -s * 0.6); g.lineTo(s * 0.6, -s * 0.05);
    g.moveTo(-s * 0.6, s * 0.4); g.lineTo(0, -s * 0.15); g.lineTo(s * 0.6, s * 0.4); g.stroke();
    g.beginPath(); g.moveTo(-s * 0.8, s * 0.85); g.quadraticCurveTo(0, s * 0.65, s * 0.8, s * 0.85); g.stroke();
  } else {
    g.font = `800 ${s * 1.6}px "Bricolage Grotesque", system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(kind || '•').slice(0, 1).toUpperCase(), 0, s * 0.1);
  }
  g.restore();
}
function makeSprite(b) {
  const pad = b.r * 0.9, size = Math.ceil((b.r + pad) * 2 * DPR);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.scale(DPR, DPR); g.translate(b.r + pad, b.r + pad);
  const r = b.r, col = b.rgb, light = mix(col, [255, 255, 255], 0.65), dark = mix(col, [0, 0, 10], 0.75);
  if (b.ghost) {
    g.setLineDash([r * 0.2, r * 0.16]); g.lineWidth = 2; g.strokeStyle = 'rgba(170,200,230,.55)'; g.beginPath(); g.arc(0, 0, r - 1, 0, TAU); g.stroke(); g.setLineDash([]);
    const gg = g.createRadialGradient(-r * .3, -r * .35, 0, 0, 0, r); gg.addColorStop(0, 'rgba(170,200,230,.2)'); gg.addColorStop(1, 'rgba(170,200,230,.03)');
    g.fillStyle = gg; g.beginPath(); g.arc(0, 0, r - 2, 0, TAU); g.fill();
    g.globalAlpha = .6; drawIcon(g, '?', r * 0.42); g.globalAlpha = 1;
    return c;
  }
  g.save(); g.shadowColor = rgba(col, 0.55); g.shadowBlur = r * 0.45; g.fillStyle = rgba(dark, 1); g.beginPath(); g.arc(0, 0, r * 0.98, 0, TAU); g.fill(); g.restore();
  const body = g.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.05, 0, 0, r);
  body.addColorStop(0, rgba(light, 1)); body.addColorStop(0.32, rgba(col, 1)); body.addColorStop(0.78, rgba(mix(col, [0, 0, 20], 0.55), 1)); body.addColorStop(1, rgba(mix(col, [0, 0, 10], 0.85), 1));
  g.fillStyle = body; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  const bl = g.createRadialGradient(r * 0.25, r * 0.7, 0, r * 0.25, r * 0.7, r * 0.8);
  bl.addColorStop(0, rgba(light, 0.45)); bl.addColorStop(1, rgba(light, 0));
  g.fillStyle = bl; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();

      const comp = o.k * q.h * 0.5, top = q.t + comp;
      ctx.strokeStyle = rgba(o.c, 0.6); ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
      const coils = 3; for (let k = 0; k <= coils * 2; k++) { const yy = GY - (GY - top - 4) * k / (coils * 2); ctx.lineTo(x + q.w * (k % 2 ? 0.72 : 0.28), yy); } ctx.stroke();
      ctx.fillStyle = rgba(o.c, 0.95); rrect(x - 2, top - 6, q.w + 4, 7, 3.5); ctx.fill();
      continue;
    }
    ctx.fillStyle = rgba(body, 1); rrect(x, q.t, q.w, q.h + 6, Math.min(10, q.w * 0.25)); ctx.fill();
    ctx.fillStyle = rgba(o.c, 0.75); rrect(x, q.t, q.w, 4, 2); ctx.fill();
  }
  // gold stars
  for (const s of stars) {
    const x = s.x - camX; if (x < -40 || x > W + 40) continue;
    if (s.got) { const k = (now - s.gotT) / 350; if (k > 1) { s.gone = true; continue; } ctx.globalAlpha = 1 - k; }
    const tr = s.r * 0.85 * (s.got ? 1 + (now - s.gotT) / 250 : 1), y = s.y + Math.sin(t * 1.6 + s.t) * 5;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 1.2 + s.t) * 0.25);
    const tg = ctx.createRadialGradient(0, 0, 0, 0, 0, tr * 2.6); tg.addColorStop(0, 'rgba(255,201,77,.25)'); tg.addColorStop(1, 'rgba(255,201,77,0)'); ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(0, 0, tr * 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd36a'; star5(tr); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // ripples
  for (const r of ripples) { r.t += 1 / 60; const k = r.t / r.life; ctx.strokeStyle = rgba(r.rgb, 0.3 * (1 - k)); ctx.lineWidth = 1.5 + 2 * (1 - k); ctx.beginPath(); ctx.arc(r.x - camX, r.y, r.r1 * (0.15 + 0.85 * Math.sqrt(k)), 0, TAU); ctx.stroke(); }
  ripples = ripples.filter(r => r.t < r.life);

  // soft contact shadows (they shrink and fade as a ball rises)
  for (const b of balls) {
    const x = b.x - camX, ht = GY - (b.y + b.r), a = clamp(1 - ht / (R * 5), 0.12, 1);
    ctx.fillStyle = `rgba(4,5,20,${0.5 * a})`; ctx.beginPath(); ctx.ellipse(x, GY + 1, b.r * (0.45 + 0.5 * a), b.r * 0.13, 0, 0, TAU); ctx.fill();
  }
  for (const b of balls) {
    const x = b.x - camX, sz = b.sprite.width / DPR, s = clamp(b.sq, -0.24, 0.24);
    ctx.save(); ctx.translate(x, b.y);
    if (b.glow > 0.02 && !b.ghost) { const gg = ctx.createRadialGradient(0, 0, b.r * 0.8, 0, 0, b.r * 1.7); gg.addColorStop(0, rgba(b.rgb, 0.25 * b.glow)); gg.addColorStop(1, rgba(b.rgb, 0)); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill(); }
    if (b.held) { ctx.strokeStyle = rgba(b.rgb, 0.6); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, b.r + 8, 0, TAU); ctx.stroke(); }
    ctx.rotate(b.sqa); ctx.scale(1 + s, 1 - s * 0.85); ctx.rotate(-b.sqa);
    ctx.drawImage(b.sprite, -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
  }
  // names on the ground under each ball
  const fs = clamp(R * 0.3, 13, 17);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  // lay labels out left to right and nudge apart so they never overlap
  ctx.font = `600 ${fs}px ${FONT}`;
  const tags = balls.map(b => ({ b, label: b.ghost ? 'Soon' : String(b.game.title || ''), x: b.x - camX })).sort((a, c) => a.x - c.x);
  for (const g of tags) g.w = ctx.measureText(g.label).width + 14;
  for (let i = 1; i < tags.length; i++) { const p = tags[i - 1], q = tags[i], need = (p.w + q.w) / 2; if (q.x - p.x < need) q.x = p.x + need; }
  for (let i = tags.length - 1; i >= 0; i--) { const lim = i === tags.length - 1 ? W - tags[i].w / 2 - 6 : tags[i + 1].x - (tags[i].w + tags[i + 1].w) / 2; if (tags[i].x > lim) tags[i].x = lim; }
  for (const { b, label, x: tx } of tags) {
    const x = tx;
    ctx.font = `600 ${fs}px ${FONT}`;
    ctx.fillStyle = b.ghost ? 'rgba(200,205,240,.4)' : rgba(mix(b.rgb, [255, 255, 255], 0.35), 0.95);
    ctx.fillText(label, x, GY + 24);
    if (b.game.isNew && !b.ghost) { ctx.font = `700 ${fs * 0.72}px ${FONT}`; ctx.fillStyle = '#ffc94d'; ctx.fillText('New', x, GY + 26 + fs * 1.2); }
  }
  ctx.textBaseline = 'alphabetic';
  // particles + floating numbers
  for (const p of parts) { p.life -= 1 / 60; p.x += p.vx / 60 - V / 60; p.y += p.vy / 60; p.vy += G * 0.35 / 60; p.vx *= 0.98; const a = clamp(p.life / p.max, 0, 1); ctx.fillStyle = rgba(p.rgb, a); ctx.beginPath(); ctx.arc(p.x, p.y, p.s * 0.7, 0, TAU); ctx.fill(); }
  parts = parts.filter(p => p.life > 0);
  for (const x of texts) { x.t += 1 / 60; const a = clamp(1 - x.t / 0.9, 0, 1); ctx.fillStyle = rgba(x.rgb, a); ctx.font = `700 20px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(x.s, x.x - camX, x.y - x.t * 40); }
  texts = texts.filter(x => x.t < 0.9);
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  const targetScale = modalOpen ? 0.2 : 1; timeScale += (targetScale - timeScale) * Math.min(1, real * 5);
  const dt = real * timeScale;
  if (ptr && ptr.ball) {
    const b = ptr.ball, tx = clamp(screenToWorld(ptr.x) + ptr.ox, camX + b.r, camX + W - b.r), ty = clamp(ptr.y + ptr.oy, b.r, GY - b.r);
    b.vx = (tx - b.x) / Math.max(real, 0.008); b.vy = (ty - b.y) / Math.max(real, 0.008); b.x += (tx - b.x) * 0.6; b.y += (ty - b.y) * 0.6;
  }
  spawnCourse();
  acc += dt; const h = 1 / 120; let n = 0; while (acc >= h && n < 10) { step(h); acc -= h; n++; }
  for (const b of balls) { b.sqv += (-170 * b.sq - 10 * b.sqv) * real; b.sq += b.sqv * real; b.glow = Math.max(0, b.glow - real * 1.2); }
  maybeLeapfrog(now);
  render(now);
  requestAnimationFrame(frame);
}

// ---------- sharing ----------
async function shareIt(data, label) {
  const r = await S.share(data);
  if (r === 'copied') toast('Link copied · paste it anywhere');
  else if (r === 'failed') toast(data.url);
  if (r !== 'cancelled') S.track(label, 'Shared ' + label);
}
$('#bShare').addEventListener('click', () => shareIt({ title: 'Bounce Lab', text: 'Bounce Lab: a little arcade of physics ball games. Come play.', url: S.siteUrl() }, 'lobby/share'));

// ---------- game card ----------
// Kept deliberately short: what it is, how to play, Play. Scores, rating and old versions sit quietly below.
let cur = null;
function openSheet(el) { modalOpen = true; document.body.classList.add('modal'); el.classList.add('on'); el.querySelector('.scroll').scrollTop = 0; }
function openCard(b) {
  const g = b.game;
  if (b.ghost) { toast('More games are on the way.'); return; }
  cur = g;
  const card = $('#card'); card.style.setProperty('--c', g.color || '#5ef2ff');
  $('#cTitle').innerHTML = esc(g.title) + (g.isNew ? '<span class="new">New</span>' : '');
  $('#cTag').textContent = g.tagline || '';
  $('#cDesc').textContent = g.description || '';
  $('#cCtl span').textContent = g.controls || ''; $('#cCtl').style.display = g.controls ? '' : 'none';
  const href = 'games/' + encodeURIComponent(g.id) + '/index.html';
  $('#cPlay').href = href; $('#cPlay').onclick = ev => { ev.preventDefault(); launch(g, href, b); };
  $('#cShare').onclick = () => shareIt({ title: g.title + ' · Bounce Lab', text: g.title + ': ' + (g.tagline || 'a Bounce Lab game') + '. Play it here:', url: S.siteUrl('games/' + g.id + '/') }, g.id + '/share');
  // older versions only (the current one is what Play opens)
  const old = (g.versions || []).filter(v => v.v !== g.version).reverse();
  $('#cOld').open = false; $('#cOld').style.display = old.length ? '' : 'none';
  $('#cVers').innerHTML = old.map(v => `<a href="games/${encodeURIComponent(g.id)}/${esc(v.file)}"><span>${esc(v.v)}</span>${esc(v.name || '')}</a>`).join('');
  $('#cText').value = ''; $('#cFbMsg').textContent = ''; $('#rateMsg').textContent = '';
  const mine = +S.ls.get('bouncelab-rating:' + g.id + ':' + g.version, 0) || 0;
  paintCardStars(mine); $('#cNote').classList.toggle('on', !!mine);
  $('#cMeta').innerHTML = '';
  $('#cLb').innerHTML = ''; $('#cLbMsg').textContent = 'Loading…';
  $('#list').classList.remove('on'); openSheet(card);
  try { history.replaceState(null, '', '#' + g.id); } catch (e) {}
  S.track('lobby/card-' + g.id, 'Lobby: opened ' + g.title);
  S.summary(g.id).then(s => {
    if (cur !== g) return;
    const bits = [];
    if (s.ratingCount) bits.push(`<span><b>&#9733; ${(s.ratingSum / s.ratingCount).toFixed(1)}</b> from ${s.ratingCount}</span>`);
    if (s.plays) bits.push(`<span><b>${fmt(s.plays)}</b> play${s.plays === 1 ? '' : 's'}</span>`);
    $('#cMeta').innerHTML = bits.join('');
  }).catch(() => {});
  S.topScores(g.id, 3).then(rows => {
    if (cur !== g) return;
    $('#cLb').innerHTML = rows.map((r, i) => `<li><span class="p">${i + 1}</span><span class="nm">${esc(r.name || 'anon')}</span><span class="s">${fmt(r.score)}</span></li>`).join('');
    $('#cLbMsg').textContent = rows.length ? '' : 'No scores yet. Yours could be first.';
  }).catch(() => { if (cur === g) $('#cLbMsg').textContent = 'Scores are offline right now.'; });
}
function closeModals() {
  modalOpen = false; cur = null; document.body.classList.remove('modal'); $('#card').classList.remove('on'); $('#list').classList.remove('on');
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
$('#scrim').addEventListener('click', closeModals);
document.querySelectorAll('.sheet .x').forEach(x => x.addEventListener('click', closeModals));
addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

// Rating: one tap saves it. A note box appears for anyone who wants to say more.
$('#cStars').innerHTML = [1, 2, 3, 4, 5].map(i => `<button data-s="${i}" aria-label="${i} star${i > 1 ? 's' : ''}">&#9733;</button>`).join('');
function paintCardStars(n) { $('#cStars').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.s <= n)); $('#cStars').dataset.v = n; }
$('#cStars').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn || !cur) return;
  const g = cur, stars = +btn.dataset.s, key = 'bouncelab-rating:' + g.id + ':' + g.version, prev = +S.ls.get(key, 0) || 0;
  paintCardStars(stars); $('#cNote').classList.add('on');
  if (stars === prev) return;
  S.ls.set(key, stars);
  try { await S.rate(g.id, stars, prev); S.track(g.id + '/rate-' + stars, 'Rated ' + stars); if (cur === g) $('#rateMsg').textContent = 'Rating saved. Thanks!'; }
  catch (err) { S.ls.set(key, prev); if (cur === g) $('#rateMsg').textContent = 'Couldn’t save your rating. Tap a star to try again.'; }
});
$('#cSend').addEventListener('click', async () => {
  if (!cur) return; const g = cur, stars = +$('#cStars').dataset.v || 0, text = $('#cText').value.trim();
  if (!text) { $('#cFbMsg').textContent = 'Write a note first.'; return; }
  const btn = $('#cSend'); btn.disabled = true; $('#cFbMsg').textContent = 'Sending…';
  try {
    await S.sendFeedback(g.id, { stars: stars || null, text, name: S.ls.get('bouncelab-name', ''), v: g.version, score: null });
    S.track(g.id + '/feedback', 'Sent feedback');
    $('#cText').value = ''; $('#cFbMsg').textContent = 'Note sent. Thank you!';
  } catch (e) { $('#cFbMsg').textContent = 'Couldn’t send. Check your connection and try again.'; }
  btn.disabled = false;
});

function launch(g, href, b) {
  S.track('lobby/play-' + g.id, 'Lobby: play ' + g.title);
  const w = $('#wipe'), cx = b ? b.x - camX : W / 2, cy = b ? b.y : H / 2;
  w.style.background = `radial-gradient(circle at ${cx}px ${cy}px, ${g.color} 0%, #0e1230 65%)`;
  w.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
  tone(330, 0.08, 0.3, 'sine', 0, 1); tone(660, 0.06, 0.4, 'sine', 0.08, 1);
  requestAnimationFrame(() => { w.style.clipPath = `circle(${Math.hypot(W, H)}px at ${cx}px ${cy}px)`; });
  setTimeout(() => { location.href = href; }, REDUCED ? 50 : 520);
}
addEventListener('pageshow', e => { if (e.persisted) { $('#wipe').style.clipPath = 'circle(0px at 50% 50%)'; closeModals(); } });

// ---------- list view ----------
$('#bList').addEventListener('click', () => {
  $('#lItems').innerHTML = GAMES.map(g => `<div class="gc" style="--c:${esc(g.color)}" data-id="${esc(g.id)}" role="button" tabindex="0"><span class="orb"></span><span class="t"><b>${esc(g.title)}</b><small>${esc(g.tagline || '')}</small></span><button class="go">Play</button></div>`).join('') || '<p class="muted">No games yet.</p>';
  openSheet($('#list'));
});
$('#lItems').addEventListener('click', e => {
  const el = e.target.closest('.gc'); if (!el) return;
  const b = balls.find(x => x.game && x.game.id === el.dataset.id);
  if (e.target.closest('.go')) launch(b.game, 'games/' + encodeURIComponent(b.game.id) + '/index.html', null); else openCard(b);
});
$('#lItems').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('gc')) e.target.click(); });
$('#bSound').addEventListener('click', () => { muted = !muted; S.ls.set('bouncelab-lobby-muted', muted); if (!muted) { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); tone(660, 0.06, 0.15, 'sine', 0, 1); } syncSound(); });

// ---------- install as an app ----------
// Android/desktop Chrome offer an install prompt; we show an install button only when it's available.
// (On iPhone: Share, then "Add to Home Screen".)
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.body.classList.add('can-install'); });
addEventListener('appinstalled', () => { installEvt = null; document.body.classList.remove('can-install'); toast('Installed. Find Bounce Lab on your home screen.'); S.track('lobby/installed', 'Installed app'); });
$('#bInstall').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); if (r && r.outcome === 'accepted') document.body.classList.remove('can-install'); installEvt = null; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- boot ----------
const DAY = 864e5;
// only the most recently added game gets a "New" tag, and only for its first week
const newest = GAMES.slice().sort((a, b) => String(b.added || '').localeCompare(String(a.added || '')))[0];
if (newest) { const u = Date.parse((newest.added || '') + 'T12:00'); newest.isNew = !!u && Date.now() - u < 7 * DAY; }
addEventListener('resize', layout);
init();
if (document.fonts && document.fonts.load) document.fonts.load('800 20px "Bricolage Grotesque"').then(() => { for (const b of balls) b.sprite = makeSprite(b); }).catch(() => {});
requestAnimationFrame(t => { last = t; frame(t); });
if (/[?&]debug/.test(location.search)) window.__lobby = { get balls() { return balls; }, get camX() { return camX; }, get stars() { return stars; }, get score() { return score; }, jumpAll };
// deep link: index.html#ascent opens that game's card
if (location.hash.length > 1) { const b = balls.find(x => x.game && x.game.id === decodeURIComponent(location.hash.slice(1))); if (b) setTimeout(() => openCard(b), 900); }
})();
</script>
</body>
</html>
