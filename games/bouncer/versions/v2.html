<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bouncer v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#03040a;overflow:hidden}
  body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
       font-family:'Inter Tight',system-ui,-apple-system,sans-serif;color:#e9edf7}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  #score{position:absolute;top:3.2vh;left:0;right:0;text-align:center;font-weight:200;font-size:clamp(38px,min(10vw,9vh),80px);
         letter-spacing:-.02em;line-height:1;opacity:0;transition:opacity .5s;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(120,200,255,.25)}
  #combo{position:absolute;top:calc(3.2vh + clamp(42px,min(11vw,10vh),86px));left:0;right:0;text-align:center;font-weight:400;font-size:12px;
         letter-spacing:.35em;text-transform:uppercase;opacity:0;transition:opacity .3s}
  .screen{position:absolute;left:0;right:0;text-align:center;transition:opacity .6s ease}
  .hidden{opacity:0 !important}
  #title{top:4vh}
  #title h1{margin:0;font-weight:200;font-size:clamp(28px,min(9vw,8vh),60px);letter-spacing:.42em;padding-left:.42em}
  #title .tag{margin-top:8px;font-weight:300;font-size:11px;letter-spacing:.5em;text-transform:uppercase;opacity:.45;padding-left:.5em}
  #hint{bottom:5vh;font-weight:300;font-size:12px;letter-spacing:.26em;text-transform:uppercase;line-height:2.2;opacity:.85;padding:0 12px}
  #hint b{font-weight:500;color:#fff}
  #hint .tap{display:inline-block;margin-top:6px;opacity:.55;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.15}}
  #coach{bottom:5vh;font-weight:300;font-size:12px;letter-spacing:.24em;text-transform:uppercase;line-height:2.1;opacity:.75;padding:0 12px}
  #over{top:4vh}
  #over .lbl{font-size:11px;letter-spacing:.5em;text-transform:uppercase;opacity:.5;padding-left:.5em}
  #over .big{font-weight:200;font-size:clamp(56px,min(18vw,16vh),130px);line-height:1;margin:6px 0 10px;font-variant-numeric:tabular-nums}
  #over .best{font-size:12px;letter-spacing:.35em;text-transform:uppercase;opacity:.6;padding-left:.35em}
  #over .again{position:fixed;left:0;right:0;bottom:5vh;font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;animation:breathe 2.4s ease-in-out infinite}
  #mute{pointer-events:auto;position:absolute;top:12px;right:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
        color:#cfd6e6;font:500 10px 'Inter Tight',system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;padding:8px 10px 8px 12px;border-radius:999px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="combo"></div>
  <div id="title" class="screen">
    <h1>BOUNCER</h1>
    <div class="tag">v2 · the platform</div>
  </div>
  <div id="hint" class="screen">
    <b>Drag</b> up &amp; down to move the platform<br>
    move <b>with</b> the ball to catch it soft<br>
    <b>ram</b> it upward to launch it<br>
    <span class="tap">tap anywhere to begin</span>
  </div>
  <div id="coach" class="screen hidden">drag to move the platform<br>flick up to launch<br>catch the light in each gate</div>
  <div id="over" class="screen hidden">
    <div class="lbl">score</div>
    <div class="big" id="final">0</div>
    <div class="best" id="best">best 0</div>
    <div class="again">tap to go again</div>
  </div>
  <button id="mute" type="button">sound on</button>
</div>

<script>
'use strict';
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const hsla = (h, s, l, a) => `hsla(${h},${s}%,${l}%,${a})`;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- tuning ----------
const E = 0.78;          // bounciness of the platform (0 = dead, 1 = perfect)
const STICK = 0.07;      // below this impact speed the ball settles onto the platform
const CEIL_E = 0.72;     // bounciness of the ceiling
const MAXV = 1.9;        // cap on launch speed (x VMAX)

// ---------- layout ----------
let W, H, DPR, floorY, ceilY, yH, D, P, R, ballX, G, VMAX, speed0, BW, PW, PT, ZMIN, ZMAX, SENS;
let bg, vig, grainCv, grainPat;
let dust = [], pillars = [];

function resize() {
  const oldP = P;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const portrait = H > W * 1.1;
  floorY = H * (portrait ? 0.74 : 0.8);
  ceilY = H * (portrait ? 0.17 : 0.19);
  P = floorY - ceilY;
  yH = floorY - H * 0.045;
  D = floorY - yH;
  R = Math.max(12, Math.min(P * 0.058, W * 0.062));
  BW = Math.max(3, R * 0.26);
  PW = R * 1.85; PT = Math.max(5, R * 0.42);
  ZMIN = R * 0.3; ZMAX = P * 0.42;
  ballX = W * (portrait ? 0.28 : 0.3);
  G = 3.0 * P;
  VMAX = Math.sqrt(2 * G * P);
  SENS = clamp(ZMAX / (H * 0.24), 0.9, 2.2);
  speed0 = Math.min(0.42 * H, (W - ballX) / 1.45);
  if (oldP && ball) { const k = P / oldP; ball.h *= k; paddle.h *= k; paddle.th *= k; ball.vy *= Math.sqrt(k); }
  buildStatic();
}

function buildStatic() {
  bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext('2d'); b.scale(DPR, DPR);
  let g = b.createLinearGradient(0, 0, 0, yH);
  g.addColorStop(0, '#020309'); g.addColorStop(0.6, '#060914'); g.addColorStop(1, '#0f1428');
  b.fillStyle = g; b.fillRect(0, 0, W, yH + 1);
  g = b.createLinearGradient(0, yH, 0, H);
  g.addColorStop(0, '#0b0f1e'); g.addColorStop(0.18, '#06080f'); g.addColorStop(1, '#020306');
  b.fillStyle = g; b.fillRect(0, yH, W, H - yH);
  // ceiling slab
  g = b.createLinearGradient(0, 0, 0, ceilY + D);
  g.addColorStop(0, '#020308'); g.addColorStop(ceilY / (ceilY + D) * 0.98, '#0a0e1c'); g.addColorStop(1, 'rgba(10,14,28,0)');
  b.fillStyle = g; b.fillRect(0, 0, W, ceilY + D);

  vig = document.createElement('canvas'); vig.width = cv.width; vig.height = cv.height;
  const v = vig.getContext('2d'); v.scale(DPR, DPR);
  g = v.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.25, W / 2, H * 0.5, Math.hypot(W, H) * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);

  if (!grainCv) {
    grainCv = document.createElement('canvas'); grainCv.width = grainCv.height = 160;
    const gc = grainCv.getContext('2d'); const id = gc.createImageData(160, 160);
    for (let i = 0; i < id.data.length; i += 4) { const n = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = n; id.data[i + 3] = 255; }
    gc.putImageData(id, 0, 0);
    grainPat = ctx.createPattern(grainCv, 'repeat');
  }
  dust = [];
  for (let i = 0; i < 60; i++) dust.push({ x: Math.random() * W, y: rand(ceilY + D + 4, yH - 4), z: rand(1.6, 7), s: rand(0.6, 1.8), tw: Math.random() * TAU });
  pillars = [];
  for (let i = 0; i < 26; i++) pillars.push({ u: Math.random(), h: rand(0.03, 0.26) * H, w: rand(0.6, 2.2), dh: rand(-25, 25), ph: Math.random() * TAU });
}

// ---------- state ----------
let state = 'title';
let t = 0, camX = 0, speed = 0, hue = 196, hueT = 196, glowI = 0.6;
const ball = { h: 0, vy: 0, sq: 0, sqv: 0, alive: true, rest: false, anchor: 'bottom', charge: 0 };
const paddle = { h: 0, th: 0, v: 0, flash: 0 };
let gates = [], parts = [], rings = [], shards = [], trail = [];
let score = 0, combo = 0, best = 0, shake = 0, flash = 0, ceilFlash = 0, timeScale = 1, deadT = 0, lastGateWX = 0, gateCount = 0;
let RA = 1, SIM = false;
try { best = parseInt(localStorage.getItem('bouncer-v2-best') || '0', 10) || 0; } catch (e) {}

resize();
window.addEventListener('resize', resize);
paddle.h = paddle.th = P * 0.08; ball.h = P * 0.45;

// ---------- audio ----------
let AC = null, master, revIn, noiseBuf, windGain, windFilter, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.9;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master.connect(comp); comp.connect(AC.destination);
  const conv = AC.createConvolver(); conv.buffer = makeIR(2.8);
  revIn = AC.createGain(); revIn.gain.value = 0.55; revIn.connect(conv); conv.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ws = AC.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
  windFilter = AC.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 600; windFilter.Q.value = 0.7;
  windGain = AC.createGain(); windGain.gain.value = 0;
  ws.connect(windFilter); windFilter.connect(windGain); windGain.connect(master); ws.start();
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340; lp.Q.value = 0.6;
  const pg = AC.createGain(); pg.gain.value = 0.0001; pg.gain.setTargetAtTime(0.03, AC.currentTime, 2);
  [55, 82.41, 110.6, 164.8].forEach((f, i) => { const o = AC.createOscillator(); o.type = i % 2 ? 'triangle' : 'sawtooth'; o.frequency.value = f; o.detune.value = rand(-6, 6); o.connect(lp); o.start(); });
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.06; const lg = AC.createGain(); lg.gain.value = 140; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  lp.connect(pg); pg.connect(master); pg.connect(revIn);
}
function makeIR(sec) {
  const len = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.4); }
  return b;
}
function ping(freq, gain, dur, when = 0, wet = 0.6) {
  if (!AC) return;
  const t0 = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master);
  const w = AC.createGain(); w.gain.value = wet; g.connect(w); w.connect(revIn);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function thump(v, pitch = 1) {
  if (!AC) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime((110 + v * 90) * pitch, t0); o.frequency.exponentialRampToValueAtTime(40 * pitch, t0 + 0.17);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2 + 0.6 * Math.min(1, v), t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.32);
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = (2200 + v * 3000) * pitch; f.Q.value = 1.1;
  const ng = AC.createGain(); ng.gain.setValueAtTime(0.05 + 0.2 * Math.min(1, v), t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
  n.connect(f); f.connect(ng); ng.connect(master); n.start(t0, Math.random()); n.stop(t0 + 0.06);
  ping((1500 + v * 1500 + rand(-80, 80)) * pitch, 0.01 + 0.05 * Math.min(1, v), 0.5, 0, 0.9);
}
function zap() {
  if (!AC) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t0); o.frequency.exponentialRampToValueAtTime(1400, t0 + 0.22);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(800, t0); f.frequency.exponentialRampToValueAtTime(5000, t0 + 0.2); f.Q.value = 6;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
  o.connect(f); f.connect(g); g.connect(master); g.connect(revIn); o.start(t0); o.stop(t0 + 0.4);
  ping(1046.5, 0.05, 1.2, 0.02); ping(1568, 0.04, 1.2, 0.05);
}
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
function chime(step, soft) {
  const f = 523.25 * Math.pow(2, SCALE[Math.min(step, SCALE.length - 1)] / 12) * (soft ? 0.5 : 1);
  ping(f, soft ? 0.05 : 0.09, 1.6); ping(f * 2.003, soft ? 0.015 : 0.03, 0.9);
}
function sparkleSnd(step) {
  const f = 1046.5 * Math.pow(2, SCALE[Math.min(step, SCALE.length - 1)] / 12);
  ping(f, 0.05, 0.6, 0); ping(f * 1.5, 0.04, 0.6, 0.05); ping(f * 2, 0.035, 0.9, 0.1);
}
function deathSnd() {
  if (!AC) return;
  const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(95, t0); o.frequency.exponentialRampToValueAtTime(28, t0 + 1.1);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.9, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.3);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.4);
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(6000, t0); f.frequency.exponentialRampToValueAtTime(200, t0 + 0.9);
  const ng = AC.createGain(); ng.gain.setValueAtTime(0.35, t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 1);
  n.connect(f); f.connect(ng); ng.connect(master); ng.connect(revIn); n.start(t0); n.stop(t0 + 1.1);
  for (let i = 0; i < 16; i++) ping(rand(2200, 7000), rand(0.01, 0.035), rand(0.15, 0.5), Math.pow(Math.random(), 2) * 0.7, 0.8);
}
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

// ---------- game flow ----------
function startGame() {
  state = 'play';
  $('title').classList.add('hidden'); $('hint').classList.add('hidden');
  $('score').style.opacity = 1; $('coach').classList.remove('hidden');
  gates = []; score = 0; combo = 0; gateCount = 0;
  lastGateWX = camX + W + speed0 * 1.1;
  updateHUD();
}
function restart() {
  $('over').classList.add('hidden');
  ball.alive = true; ball.h = Math.max(paddle.h + R, P * 0.4); ball.vy = 0; ball.sq = 0; ball.sqv = 0; ball.rest = false;
  shards = []; trail = []; parts = []; rings = [];
  timeScale = 1;
  startGame();
}
function updateHUD(popScore, popCombo) {
  $('score').textContent = score;
  const c = $('combo');
  c.textContent = combo >= 2 ? `chain ×${combo}` : '';
  c.style.opacity = combo >= 2 ? 1 : 0;
  c.style.color = hsla(hue, 90, 75, 1);
  if (popScore && $('score').animate) $('score').animate([{ transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
  if (popCombo && c.animate) c.animate([{ transform: 'scale(1.3)', letterSpacing: '.6em' }, { transform: 'scale(1)', letterSpacing: '.35em' }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

function makeGate(wx) {
  const d = Math.min(1, gateCount / 35);
  const r2 = 2 * R / P;
  let type, lo, hi, my;
  if (gateCount === 0) { type = 'wall'; lo = 0.18; hi = 2; my = 0.45; }
  else if (gateCount === 1) { type = 'roof'; lo = -1; hi = 0.55; my = 0.55 - r2 * 0.85; }
  else if (gateCount === 2) { type = 'gap'; lo = 0.46; hi = 0.92; my = 0.69; }
  else {
    const r = Math.random(); type = r < 0.5 ? 'gap' : r < 0.75 ? 'wall' : 'roof';
    if (type === 'gap') {
      const s = Math.max(r2 + 0.17, 0.5 - 0.2 * d);
      const c = s / 2 + 0.04 + Math.random() * (1 - s - 0.06);
      lo = c - s / 2; hi = c + s / 2; my = c;
    } else if (type === 'wall') {
      lo = clamp(rand(0.15, 0.35 + 0.4 * d), 0, 0.8);
      hi = 2; my = lo + r2 * 0.8 + Math.random() * (1 - lo - r2 * 1.6) * 0.6;
    } else {
      lo = -1; hi = clamp(rand(0.32, 0.62), r2 + 0.18, 0.7); my = Math.max(r2 * 0.6, hi - r2 * 0.85);
    }
  }
  gates.push({ wx, type, lo, hi, my, passed: false, got: false, flash: 0, seed: Math.random() * TAU });
  gateCount++;
}

// ---------- impacts ----------
function hitPaddle(vr, pv) {
  ball.anchor = 'bottom';
  ball.sq = Math.min(0.4, 0.08 + (vr / VMAX) * 0.3); ball.sqv = 0;
  if (SIM) return;
  const v = clamp(vr / VMAX, 0, 1.5);
  const power = pv > 0.4 * VMAX && vr > 0.75 * VMAX;
  const wx = camX + ballX, y = floorY - paddle.h;
  rings.push({ wx, y, t: 0, s: 0.4 + v + (power ? 1.2 : 0) });
  const n = Math.floor(6 + v * 20 + (power ? 20 : 0));
  for (let i = 0; i < n; i++) {
    parts.push({ x: wx + rand(-PW, PW) * 0.6, y: y - 1, vx: rand(-1, 1) * R * 9 * (0.3 + v) + speed * rand(0.2, 0.9),
      vy: -rand(0.1, 1) * R * 14 * (0.25 + v), g: G * 0.7, life: rand(0.3, 0.9), max: 0.9, k: 'spark' });
  }
  shake = Math.max(shake, v * R * (power ? 0.5 : 0.25));
  paddle.flash = Math.max(paddle.flash, 0.3 + v * 0.7);
  thump(v);
  if (power) { zap(); flash = Math.max(flash, 0.28); ball.charge = 1; vib(28); } else vib(v > 0.5 ? 14 : 6);
}
function softLand(vr) {
  ball.anchor = 'bottom';
  ball.sq = 0.06; ball.sqv = 0;
  if (SIM) return;
  paddle.flash = Math.max(paddle.flash, 0.25);
  ping(392, 0.03, 0.5, 0, 0.5); ping(784, 0.012, 0.4);
  vib(4);
}
function hitCeiling(vin) {
  ball.anchor = 'top';
  ball.sq = Math.min(0.38, 0.08 + (vin / VMAX) * 0.28); ball.sqv = 0;
  if (SIM) return;
  const v = clamp(vin / VMAX, 0, 1.5), wx = camX + ballX;
  rings.push({ wx, y: ceilY, t: 0, s: 0.4 + v });
  for (let i = 0; i < 6 + v * 16; i++) parts.push({ x: wx + rand(-R, R) * 0.5, y: ceilY + 1, vx: rand(-1, 1) * R * 8 * (0.3 + v) + speed * rand(0.2, 0.9), vy: rand(0.1, 1) * R * 8 * (0.3 + v), g: G * 0.7, life: rand(0.3, 0.8), max: 0.8, k: 'spark' });
  ceilFlash = Math.max(ceilFlash, 0.4 + v * 0.6);
  shake = Math.max(shake, v * R * 0.25);
  thump(v * 0.8, 1.6); vib(8);
}

function die() {
  ball.alive = false; state = 'dead'; deadT = 0;
  timeScale = 0.18; shake = R * 0.7; flash = 1;
  const cx = camX + ballX, cy = floorY - ball.h - R;
  for (let i = 0; i < 52; i++) {
    const a = Math.random() * TAU, sp = Math.pow(Math.random(), 0.6) * R * 22, s = R * rand(0.12, 0.42);
    shards.push({ x: cx + Math.cos(a) * R * 0.5, y: cy + Math.sin(a) * R * 0.5, vx: Math.cos(a) * sp + speed * 0.3, vy: Math.sin(a) * sp - R * 6,
      rot: Math.random() * TAU, vr: rand(-14, 14), seed: Math.random() * 10, life: rand(2.2, 3.6),
      pts: [[rand(-1, -0.3) * s, rand(-1, 1) * s], [rand(0.3, 1) * s, rand(-1, 0) * s], [rand(-0.3, 0.6) * s, rand(0.4, 1) * s]] });
  }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * TAU, sp = rand(0.3, 1) * R * 26;
    parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: G * 0.25, life: rand(0.4, 1.1), max: 1.1, k: 'spark' });
  }
  rings.push({ wx: cx, y: cy, t: 0, s: 2.5, air: true });
  deathSnd(); vib([30, 40, 70]);
  if (score > best) { best = score; try { localStorage.setItem('bouncer-v2-best', String(best)); } catch (e) {} }
  $('coach').classList.add('hidden');
  $('score').style.opacity = 0; $('combo').style.opacity = 0;
}

// ---------- input ----------
let dragging = false, lastPY = null, keyDir = 0;
function down(e) {
  if (e && e.target && e.target.closest && e.target.closest('#mute')) return;
  if (e && e.cancelable) e.preventDefault();
  initAudio();
  dragging = true;
  lastPY = e ? e.clientY : null;
  if (state === 'title') startGame();
  else if (state === 'dead' && deadT > 0.9) restart();
}
function move(e) {
  if (!(dragging || e.pointerType === 'mouse')) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    if (lastPY !== null) paddle.th = clamp(paddle.th - (ev.clientY - lastPY) * SENS, ZMIN, ZMAX);
    lastPY = ev.clientY;
  }
}
function up(e) { dragging = false; if (!e || e.pointerType !== 'mouse') lastPY = null; }
window.addEventListener('pointerdown', down, { passive: false });
window.addEventListener('pointermove', move, { passive: true });
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);
window.addEventListener('blur', () => up());
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') { keyDir = 1; e.preventDefault(); }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { keyDir = -1; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); initAudio(); if (state === 'title') startGame(); else if (state === 'dead' && deadT > 0.9) restart(); }
  if (keyDir && state === 'title') { initAudio(); startGame(); }
});
window.addEventListener('keyup', e => { if (['ArrowUp', 'KeyW', 'ArrowDown', 'KeyS'].includes(e.code)) keyDir = 0; });
window.addEventListener('contextmenu', e => e.preventDefault());
$('mute').addEventListener('click', e => {
  e.stopPropagation(); muted = !muted;
  $('mute').textContent = muted ? 'sound off' : 'sound on';
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, AC.currentTime, 0.05);
  else initAudio();
});

// ---------- physics ----------
function stepBall(dt, ph, pv) {
  ball.vy -= G * dt; ball.h += ball.vy * dt;
  ball.sqv += (-650 * ball.sq - 14 * ball.sqv) * dt; ball.sq += ball.sqv * dt;
  if (ball.h <= ph) {
    ball.h = ph;
    const vr = pv - ball.vy;              // how fast ball and platform are closing
    if (vr > 0) {
      if (vr < STICK * VMAX) { if (!ball.rest && vr > 0.02 * VMAX) softLand(vr); ball.vy = pv; ball.rest = true; }
      else { ball.vy = Math.min(MAXV * VMAX, pv + E * vr); ball.rest = false; hitPaddle(vr, pv); }
    }
  } else if (ball.h > ph + 1.5) ball.rest = false;
  const top = P - 2 * R;
  if (ball.h > top) { ball.h = top; if (ball.vy > 0) { const v = ball.vy; ball.vy = -v * CEIL_E; hitCeiling(v); } }
}
function stepPhysics(dt) {
  if (dt <= 1e-6) return;
  const ph0 = paddle.h;
  paddle.h += (paddle.th - paddle.h) * (1 - Math.exp(-dt * 42));
  paddle.v = (paddle.h - ph0) / dt;
  if (!ball.alive) return;
  const n = Math.max(1, Math.ceil(dt / 0.004));
  for (let i = 0; i < n; i++) stepBall(dt / n, ph0 + (paddle.h - ph0) * (i + 1) / n, paddle.v);
}

function hitRect(cx, cy, r, x1, y1, x2, y2) {
  const nx = clamp(cx, x1, x2), ny = clamp(cy, y1, y2), dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function titleAI() {
  // keeps the ball bouncing on the title screen
  const gap = ball.h - paddle.h;
  if (ball.vy < 0 && gap < R * 1.4) paddle.th = P * 0.2; else if (ball.vy > 0) paddle.th = P * 0.06;
}

function update(dt, rdt) {
  t += dt;
  if (state === 'play') speed = speed0 * (1 + Math.min(gateCount, 60) * 0.009);
  else if (state === 'title') speed = speed0 * 0.45;
  else speed *= Math.pow(0.15, rdt);
  camX += speed * dt;

  if (state === 'title' && !dragging && !keyDir) titleAI();
  if (keyDir) paddle.th = clamp(paddle.th + keyDir * ZMAX * 2.2 * rdt, ZMIN, ZMAX);
  stepPhysics(dt);
  ball.charge = Math.max(0, ball.charge - rdt * 1.2);
  paddle.flash = Math.max(0, paddle.flash - rdt * 3);

  hueT = 196 + Math.min(combo, 9) * 18;
  hue += (hueT - hue) * Math.min(1, rdt * 2.5);
  glowI += ((0.6 + Math.min(combo, 9) * 0.07 + ball.charge * 0.8) - glowI) * Math.min(1, rdt * 6);

  if (state === 'play') {
    while (lastGateWX < camX + W * 1.25 + 100) {
      makeGate(lastGateWX);
      const d = Math.min(1, gateCount / 35);
      lastGateWX += Math.max(speed * (1.7 - 0.5 * d + Math.random() * 0.35), R * 9);
    }
  }

  const cyc = floorY - ball.h - R;
  for (let i = gates.length - 1; i >= 0; i--) {
    const g = gates[i], sx = g.wx - camX;
    g.flash = Math.max(0, g.flash - rdt * 2);
    if (sx < -W * 0.3) { gates.splice(i, 1); continue; }
    if (!ball.alive || state !== 'play') continue;
    if (!g.got) {
      const my = floorY - g.my * P;
      if (Math.hypot(sx - ballX, my - cyc) < R * 1.3) {
        g.got = true; combo++; score += combo; g.flash = 1;
        sparkleSnd(combo); vib(10);
        for (let k = 0; k < 18; k++) { const a = Math.random() * TAU, sp = rand(0.3, 1) * R * 12; parts.push({ x: g.wx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0, life: rand(0.3, 0.7), max: 0.7, k: 'glint' }); }
        rings.push({ wx: g.wx, y: my, t: 0, s: 1, air: true });
        updateHUD(true, true);
      }
    }
    const r = R * 0.74, x1 = sx - BW / 2, x2 = sx + BW / 2;
    if (g.lo > 0 && hitRect(ballX, cyc, r, x1, floorY - g.lo * P, x2, floorY)) { die(); break; }
    if (g.hi < 1 && hitRect(ballX, cyc, r, x1, ceilY - 50, x2, floorY - g.hi * P)) { die(); break; }
    if (!g.passed && sx + BW / 2 < ballX - R) {
      g.passed = true; score++;
      if (!g.got) { combo = 0; chime(0, true); } else chime(combo);
      updateHUD(true, false);
      if (gateCount > 5) $('coach').classList.add('hidden');
    }
  }

  if (ball.alive) trail.push({ wx: camX + ballX, y: floorY - ball.h - R });
  while (trail.length && (camX + ballX - trail[0].wx > ballX + 60 || trail.length > 600)) trail.shift();

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'spark' && p.y > floorY && p.vy > 0) { p.y = floorY; p.vy *= -0.3; p.vx *= 0.6; }
    if (p.k === 'glint') { p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt); }
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 0.9) rings.splice(i, 1); }
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.vy += G * 0.55 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; s.life -= dt;
    if (s.y > floorY - 2 && s.vy > 0) { s.y = floorY - 2; s.vy *= -0.32; s.vx *= 0.75; s.vr *= 0.7; }
    if (s.y < ceilY + 2 && s.vy < 0) { s.y = ceilY + 2; s.vy *= -0.4; }
    if (s.life <= 0) shards.splice(i, 1);
  }
  for (const d of dust) { d.x -= speed * dt / d.z * 0.7 + 4 * dt / d.z; if (d.x < -5) { d.x = W + 5; d.y = rand(ceilY + D + 4, yH - 4); } }

  shake = Math.max(0, shake - rdt * (shake * 9 + 0.5));
  flash = Math.max(0, flash - rdt * 2.2);
  ceilFlash = Math.max(0, ceilFlash - rdt * 3);

  if (state === 'dead') {
    deadT += rdt;
    if (deadT > 0.9 && $('over').classList.contains('hidden')) {
      $('final').textContent = score; $('best').textContent = score >= best && score > 0 ? 'new best' : `best ${best}`;
      $('over').classList.remove('hidden');
    }
  }

  if (AC && windGain) {
    const sp = Math.abs(ball.vy) / VMAX;
    const target = ball.alive ? 0.045 * Math.min(1, sp) + 0.008 * speed / speed0 : 0;
    windGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
    windFilter.frequency.setTargetAtTime(380 + sp * 1800, AC.currentTime, 0.08);
  }
}

// ---------- render ----------
function ga(a) { ctx.globalAlpha = a * RA; }

function drawSky() {
  ctx.globalCompositeOperation = 'lighter';
  ctx.save(); ctx.translate(W / 2, yH); ctx.scale(1, 0.32);
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.75);
  g.addColorStop(0, hsla(hue, 85, 55, 0.20)); g.addColorStop(0.45, hsla(hue + 20, 80, 40, 0.07)); g.addColorStop(1, hsla(hue, 80, 40, 0));
  ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, W * 0.75, 0, TAU); ctx.fill();
  ctx.restore();
  const z = 7, span = W * z * 1.3;
  for (const p of pillars) {
    const rel = ((p.u * span - camX) % span + span) % span - span / 2;
    const x = W / 2 + rel / z;
    if (x < -10 || x > W + 10) continue;
    const top = Math.max(ceilY + D, yH - p.h);
    g = ctx.createLinearGradient(0, yH, 0, top);
    g.addColorStop(0, hsla(hue + p.dh, 80, 70, 0.28)); g.addColorStop(1, hsla(hue + p.dh, 80, 70, 0));
    ga(1); ctx.fillStyle = g; ctx.fillRect(x - p.w / 2, top, p.w, yH - top);
    ga(0.5 + 0.5 * Math.sin(t * 1.5 + p.ph)); ctx.fillStyle = hsla(hue + p.dh, 90, 85, 0.5); ctx.fillRect(x - 1, top - 1, 2, 2);
    g = ctx.createLinearGradient(0, yH, 0, yH + p.h * 0.25);
    g.addColorStop(0, hsla(hue + p.dh, 80, 70, 0.12)); g.addColorStop(1, hsla(hue + p.dh, 80, 70, 0));
    ga(1); ctx.fillStyle = g; ctx.fillRect(x - p.w / 2, yH, p.w, p.h * 0.25);
  }
  g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, hsla(hue, 90, 75, 0)); g.addColorStop(0.5, hsla(hue, 90, 80, 0.55)); g.addColorStop(1, hsla(hue, 90, 75, 0));
  ga(1); ctx.fillStyle = g; ctx.fillRect(0, yH - 0.5, W, 1);
  ga(0.4); ctx.fillRect(0, ceilY + D - 0.5, W, 1);
  for (const d of dust) {
    ga((0.25 + 0.2 * Math.sin(t * 2 + d.tw)) / d.z * 2.2);
    ctx.fillStyle = '#bcd4ff'; ctx.fillRect(d.x, d.y, d.s, d.s);
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawGrid(alpha) {
  const sp = R * 4.6, Zc = Math.max(W, H) * 0.9, zN = D / (H + 20 - yH), zF = 9;
  const X = (wx, z) => W / 2 + (wx - camX - W / 2) / z;
  const g = ctx.createLinearGradient(0, H, 0, yH);
  g.addColorStop(0, hsla(hue, 60, 70, 0.16 * alpha)); g.addColorStop(0.55, hsla(hue, 60, 70, 0.10 * alpha)); g.addColorStop(1, hsla(hue, 60, 70, 0));
  ctx.strokeStyle = g; ctx.lineWidth = 1; ga(1);
  ctx.beginPath();
  const w0 = camX + W / 2 - (W / 2 + 40) * zF, w1 = camX + W / 2 + (W / 2 + 40) * zF;
  for (let wx = Math.floor(w0 / sp) * sp; wx <= w1; wx += sp) { ctx.moveTo(X(wx, zN), H + 20); ctx.lineTo(X(wx, zF), yH + D / zF); }
  const dz = sp / Zc;
  for (let k = -40; k < 60; k++) { const z = 1 + k * dz; if (z < zN || z > 4.5) continue; const y = yH + D / z; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawSurfaces() {
  // floor fade
  let g = ctx.createLinearGradient(0, floorY, 0, H);
  g.addColorStop(0, 'rgba(3,4,9,0.05)'); g.addColorStop(0.5, 'rgba(3,4,9,0.7)'); g.addColorStop(1, 'rgba(2,3,6,0.95)');
  ctx.fillStyle = g; ctx.fillRect(-20, floorY, W + 40, H - floorY + 20);
  // ceiling fade
  g = ctx.createLinearGradient(0, ceilY, 0, 0);
  g.addColorStop(0, 'rgba(3,4,9,0.1)'); g.addColorStop(0.6, 'rgba(3,4,9,0.75)'); g.addColorStop(1, 'rgba(2,3,6,0.95)');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, ceilY + 20);

  ctx.globalCompositeOperation = 'lighter';
  drawGrid(1);
  ctx.save(); ctx.beginPath(); ctx.rect(-20, -20, W + 40, ceilY + D + 20); ctx.clip();
  ctx.transform(1, 0, 0, -1, 0, floorY + ceilY); drawGrid(0.7); ctx.restore();

  // contact lines
  g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, hsla(hue, 80, 70, 0)); g.addColorStop(ballX / W, hsla(hue, 90, 80, 0.3)); g.addColorStop(1, hsla(hue, 80, 70, 0.05));
  ctx.fillStyle = g; ga(1); ctx.fillRect(0, floorY - 0.5, W, 1);
  g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, hsla(hue, 80, 70, 0.05)); g.addColorStop(ballX / W, hsla(hue, 90, 82, 0.35 + ceilFlash * 0.6)); g.addColorStop(1, hsla(hue, 80, 70, 0.05));
  ctx.fillStyle = g; ctx.fillRect(0, ceilY - 0.75, W, 1.5);

  // light pools where blades meet floor / ceiling
  for (const gt of gates) {
    const sx = gt.wx - camX; if (sx < -100 || sx > W + 100) continue;
    if (gt.lo > 0) pool(sx, floorY, R * 3.5, 0.35 * (1 + gt.flash));
    if (gt.hi < 1) pool(sx, ceilY, R * 3.5, 0.3 * (1 + gt.flash));
  }
  // platform light on floor + ball light on ceiling when near
  pool(ballX, floorY, PW * 2.2, 0.12 + 0.25 * paddle.flash * (1 - paddle.h / ZMAX * 0.5));
  if (ball.alive) { const k = clamp(1 - (P - 2 * R - ball.h) / (P * 0.5), 0, 1); pool(ballX, ceilY, R * 4, 0.25 * k * glowI + ceilFlash * 0.4); }
  // shockwave rings
  for (const r of rings) {
    if (r.air) continue;
    const p = r.t / 0.9, rx = R * (1 + p * 7 * r.s), a = Math.pow(1 - p, 2) * 0.7;
    ctx.save(); ctx.translate(r.wx - camX, r.y); ctx.scale(1, 0.17);
    ctx.strokeStyle = hsla(hue, 90, 75, a); ctx.lineWidth = 7 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.stroke(); ctx.restore();

}
function pool(x, y, rad, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.16);
  const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, rad);
  pg.addColorStop(0, hsla(hue, 90, 70, a)); pg.addColorStop(1, hsla(hue, 90, 60, 0));
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.fill(); ctx.restore();
}

function blade(sx, y1, y2, tipY, fl) {
  if (y2 - y1 < 1) return;
  const gw = BW * 6;
  let g = ctx.createLinearGradient(sx - gw, 0, sx + gw, 0);
  g.addColorStop(0, hsla(hue, 90, 60, 0)); g.addColorStop(0.5, hsla(hue, 90, 62, 0.32 + 0.3 * fl)); g.addColorStop(1, hsla(hue, 90, 60, 0));
  ga(1); ctx.fillStyle = g; ctx.fillRect(sx - gw, y1, gw * 2, y2 - y1);
  g = ctx.createLinearGradient(sx - BW / 2, 0, sx + BW / 2, 0);
  g.addColorStop(0, hsla(hue, 90, 65, 0.9)); g.addColorStop(0.5, 'rgba(255,255,255,1)'); g.addColorStop(1, hsla(hue, 90, 65, 0.9));
  ctx.fillStyle = g; ctx.fillRect(sx - BW / 2, y1, BW, y2 - y1);
  const tg = ctx.createRadialGradient(sx, tipY, 0, sx, tipY, BW * 5);
  tg.addColorStop(0, 'rgba(255,255,255,0.95)'); tg.addColorStop(0.25, hsla(hue, 95, 70, 0.6)); tg.addColorStop(1, hsla(hue, 90, 60, 0));
  ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(sx, tipY, BW * 5, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(sx, tipY); ctx.scale(1, 0.05);
  const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, BW * 16);
  fg.addColorStop(0, hsla(hue, 90, 85, 0.6)); fg.addColorStop(1, hsla(hue, 90, 70, 0));
  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, BW * 16, 0, TAU); ctx.fill(); ctx.restore();
}

function drawGates() {
  ctx.globalCompositeOperation = 'lighter';
  for (const g of gates) {
    const sx = g.wx - camX; if (sx < -BW * 20 || sx > W + BW * 20) continue;
    if (g.lo > 0) blade(sx, floorY - g.lo * P, floorY, floorY - g.lo * P, g.flash);
    if (g.hi < 1) blade(sx, ceilY, floorY - g.hi * P, floorY - g.hi * P, g.flash);
    if (!g.got) {
      const my = floorY - g.my * P, pr = R * 0.32 * (1 + 0.12 * Math.sin(t * 5 + g.seed));
      const mg = ctx.createRadialGradient(sx, my, 0, sx, my, pr * 4);
      mg.addColorStop(0, 'rgba(255,255,255,0.9)'); mg.addColorStop(0.2, hsla(hue + 40, 95, 70, 0.5)); mg.addColorStop(1, hsla(hue + 40, 90, 60, 0));
      ga(1); ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(sx, my, pr * 4, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(sx, my); ctx.rotate(t * 1.6 + g.seed);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, -pr); ctx.lineTo(pr * 0.7, 0); ctx.lineTo(0, pr); ctx.lineTo(-pr * 0.7, 0); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const x0 = trail[0].wx - camX;
  ctx.beginPath();
  for (let i = 0; i < trail.length; i++) { const p = trail[i]; const x = p.wx - camX; i ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y); }
  const boost = 1 + ball.charge * 1.5;
  const passes = [[R * 1.3, 0.07 * boost], [R * 0.45, 0.2 * boost], [1.6, 0.85]];
  for (const [lw, a] of passes) {
    const g = ctx.createLinearGradient(Math.min(x0, ballX - 1), 0, ballX, 0);
    g.addColorStop(0, hsla(hue, 95, 70, 0)); g.addColorStop(0.7, hsla(hue, 95, 72, Math.min(1, a * 0.5))); g.addColorStop(1, hsla(hue, 95, lw < 2 ? 92 : 70, Math.min(1, a)));
    ctx.strokeStyle = g; ctx.lineWidth = lw; ga(1); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// the hover platform, drawn in two passes so its front edge sits in front of the ball
function drawPaddle(part) {
  const x = ballX, y = floorY - paddle.h, fl = paddle.flash;
  const k = 0.1; // fixed tilt so the plate always reads clearly
  if (part === 'back') {
    ctx.globalCompositeOperation = 'lighter';
    // hover beam to the floor
    if (floorY - y > 3) {
      const bgd = ctx.createLinearGradient(0, y + PT, 0, floorY);
      bgd.addColorStop(0, hsla(hue, 90, 70, 0.16 + fl * 0.2)); bgd.addColorStop(1, hsla(hue, 90, 60, 0.02));
      ctx.fillStyle = bgd; ga(1);
      ctx.beginPath(); ctx.moveTo(x - PW * 0.55, y + PT); ctx.lineTo(x + PW * 0.55, y + PT); ctx.lineTo(x + PW * 0.85, floorY); ctx.lineTo(x - PW * 0.85, floorY); ctx.closePath(); ctx.fill();
    }
    // glow
    const gg = ctx.createRadialGradient(x, y + PT * 0.5, 0, x, y + PT * 0.5, PW * 1.8);
    gg.addColorStop(0, hsla(hue, 90, 65, 0.22 + fl * 0.35)); gg.addColorStop(1, hsla(hue, 90, 60, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(x, y + PT * 0.5, PW * 1.8, PW * 0.6, 0, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (k > 0.005) {
      // top face (seen from above)
      const tf = ctx.createLinearGradient(0, y - PW * k, 0, y + PW * k);
      tf.addColorStop(0, '#1a2238'); tf.addColorStop(1, '#0b0f1c');
      ctx.fillStyle = tf; ctx.beginPath(); ctx.ellipse(x, y, PW, PW * k, 0, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hsla(hue, 95, 80, 0.55 + fl * 0.45); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x, y, PW, PW * k, 0, Math.PI, TAU); ctx.stroke();
      // ball shadow / light on the plate
      if (ball.alive) {
        const dist = clamp((ball.h - paddle.h) / (P * 0.5), 0, 1);
        ctx.globalCompositeOperation = 'source-over';
        const rx = R * (1.05 - 0.5 * dist);
        ctx.fillStyle = `rgba(0,0,0,${0.6 * (1 - dist)})`;
        ctx.beginPath(); ctx.ellipse(x, y, rx, Math.max(1, rx * k * 1.2), 0, 0, TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over'; ga(1);
  } else {
    // side band (front edge)
    const sb = ctx.createLinearGradient(0, y, 0, y + PT);
    sb.addColorStop(0, hsla(hue, 95, 85, 0.95)); sb.addColorStop(0.25, '#1b2440'); sb.addColorStop(0.8, '#080b15'); sb.addColorStop(1, hsla(hue, 90, 60, 0.8));
    ctx.fillStyle = sb; ga(1);
    ctx.beginPath();
    if (k > 0.005) {
      ctx.ellipse(x, y, PW, PW * k, 0, 0, Math.PI, false);
      ctx.ellipse(x, y + PT, PW, PW * k, 0, Math.PI, 0, true);
    } else {
      const kk = Math.max(0.005, -k);
      ctx.ellipse(x, y, PW, PW * kk, 0, Math.PI, TAU, false);
      ctx.ellipse(x, y + PT, PW, PW * kk, 0, 0, Math.PI, false);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    // front rim + specular streak
    ctx.strokeStyle = hsla(hue, 95, 82, 0.75 + fl * 0.25); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(x, y, PW, PW * Math.max(0.005, Math.abs(k)), 0, 0, Math.PI); ctx.stroke();
    const sp = ctx.createLinearGradient(x - PW, 0, x + PW, 0);
    sp.addColorStop(0, 'rgba(255,255,255,0)'); sp.addColorStop(0.3, 'rgba(255,255,255,0.75)'); sp.addColorStop(0.45, 'rgba(255,255,255,0)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp; ctx.fillRect(x - PW, y + PW * Math.max(0, k) + PT * 0.2, PW * 2, Math.max(1, PT * 0.18));
    if (k < -0.005) { // energy underside when above eye level
      ctx.fillStyle = hsla(hue, 90, 65, 0.35 + fl * 0.4);
      ctx.beginPath(); ctx.ellipse(x, y + PT, PW * 0.95, PW * -k * 0.95, 0, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over'; ga(1);
  }
}

function drawRail() {
  // shows how far the platform can travel
  const x = ballX - PW - R * 0.6, y0 = floorY - ZMIN, y1 = floorY - ZMAX - PT;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = hsla(hue, 70, 75, 0.12); ga(1);
  ctx.fillRect(x, y1, 1, y0 - y1);
  ctx.fillRect(x - 3, y1, 7, 1); ctx.fillRect(x - 3, y0, 7, 1);
  const py = floorY - paddle.h;
  ctx.fillStyle = hsla(hue, 90, 85, 0.6 + paddle.flash * 0.4); ctx.fillRect(x - 2, py - 1, 5, 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawBall(x, y, r, sx, sy) {
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(x, y, r * 0.7, x, y, r * 2.8);
  g.addColorStop(0, hsla(hue, 90, 60, 0.24 * glowI)); g.addColorStop(1, hsla(hue, 90, 60, 0));
  ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.8, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
  g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#6a7799'); g.addColorStop(0.16, '#2c3454'); g.addColorStop(0.44, '#0a0d19'); g.addColorStop(0.535, '#030409');
  g.addColorStop(0.56, hsla(hue, 90, 82, 1)); g.addColorStop(0.59, hsla(hue, 80, 45, 1)); g.addColorStop(0.66, '#121828'); g.addColorStop(1, '#262e46');
  ga(1); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = hsla(hue, 70, 70, 0.22); ctx.lineWidth = Math.max(0.7, r * 0.03);
  ctx.beginPath();
  for (let k = 0; k < 7; k++) {
    const u = ((k / 7 - camX * 0.0035) % 1 + 1) % 1 * 2 - 1;
    const xx = u * r * 0.9;
    ctx.moveTo(xx * 0.85, r * 0.22); ctx.lineTo(xx * 1.15, r);
  }
  ctx.stroke();
  for (const gt of gates) {
    const dx = gt.wx - camX - x;
    if (Math.abs(dx) > W * 0.7) continue;
    const u = dx / (Math.abs(dx) + r * 3.2);
    const px = u * r * 0.92, prox = 1 - Math.min(1, Math.abs(dx) / (W * 0.7));
    const wv = r * (0.035 + 0.09 * prox * prox);
    const sg = ctx.createLinearGradient(px - wv, 0, px + wv, 0);
    sg.addColorStop(0, hsla(hue, 90, 70, 0)); sg.addColorStop(0.5, hsla(hue, 90, 90, 0.75 * prox)); sg.addColorStop(1, hsla(hue, 90, 70, 0));
    ctx.fillStyle = sg;
    const half = Math.sqrt(Math.max(0, 1 - u * u * 0.85)) * r;
    if (gt.lo > 0) { const top = r * 0.58 - gt.lo * r * 0.9; ctx.fillRect(px - wv, Math.max(-half, top), wv * 2, half - Math.max(-half, top)); }
    if (gt.hi < 1) { const bot = r * 0.58 - gt.hi * r * 1.2; ctx.fillRect(px - wv, -half, wv * 2, Math.min(half, bot) + half); }
  }
  ctx.globalCompositeOperation = 'source-over';
  g = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,0.08)'); g.addColorStop(0.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  if (ctx.createConicGradient) {
    ctx.globalCompositeOperation = 'screen'; ga(0.16 + ball.charge * 0.3);
    const cg = ctx.createConicGradient(t * 0.5, 0, 0);
    for (let i = 0; i <= 6; i++) cg.addColorStop(i / 6, `hsl(${(hue + i * 60) % 360},90%,55%)`);
    ctx.fillStyle = cg; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  }
  ctx.globalCompositeOperation = 'lighter'; ga(1);
  g = ctx.createRadialGradient(0, 0, r * 0.74, 0, 0, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, hsla(hue, 90, 65, 0.22 + ball.charge * 0.3)); g.addColorStop(1, hsla(hue, 100, 88, 0.75));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  g = ctx.createRadialGradient(r * 0.15, r * 0.85, 0, r * 0.15, r * 0.85, r * 0.7);
  g.addColorStop(0, hsla(hue, 90, 65, 0.35 + paddle.flash * 0.4)); g.addColorStop(1, hsla(hue, 90, 60, 0));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  ctx.save(); ctx.translate(-r * 0.36, -r * 0.43); ctx.rotate(-0.7); ctx.scale(1, 0.58);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.4);
  g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.35, 'rgba(255,255,255,0.3)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.46, r * 0.065, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function ballPose() {
  const st = ball.rest ? 0 : Math.min(0.17, Math.abs(ball.vy) / VMAX * 0.15);
  const sq = ball.sq;
  const sy = (1 - sq) * (1 + st), sx = (1 + sq * 0.9) * (1 - st * 0.5);
  const y = ball.anchor === 'top' ? floorY - ball.h - 2 * R + R * sy : floorY - ball.h - R * sy;
  return { x: ballX, y, sx, sy };
}

function drawShards() {
  for (const s of shards) {
    const x = s.x - camX;
    ctx.save(); ctx.translate(x, s.y); ctx.rotate(s.rot);
    const L = 18 + 62 * Math.abs(Math.sin(s.rot * 1.3 + s.seed));
    ga(Math.min(1, s.life / 0.8));
    ctx.fillStyle = `hsl(${hue + 30},18%,${L}%)`;
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]); ctx.lineTo(s.pts[1][0], s.pts[1][1]); ctx.lineTo(s.pts[2][0], s.pts[2][1]); ctx.closePath(); ctx.fill();
    if (L > 62) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = hsla(hue, 90, 80, (L - 62) / 18); ctx.lineWidth = 1; ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.restore();
  }
  ga(1);
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const x = p.x - camX, a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'spark') {
      ctx.strokeStyle = hsla(hue + 10, 95, 80, a); ctx.lineWidth = 1.4; ga(1);
      ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x - p.vx * 0.022, p.y - p.vy * 0.022); ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, R * 0.3);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, hsla(hue + 40, 90, 70, 0));
      ctx.fillStyle = g; ga(1); ctx.beginPath(); ctx.arc(x, p.y, R * 0.3, 0, TAU); ctx.fill();
    }
  }
  for (const r of rings) {
    if (!r.air) continue;
    const p = r.t / 0.9, a = Math.pow(1 - p, 2) * 0.8;
    ctx.strokeStyle = hsla(hue + 30, 95, 80, a); ctx.lineWidth = 2 * (1 - p) + 0.5;
    ctx.beginPath(); ctx.arc(r.wx - camX, r.y, R * (0.4 + p * 3 * r.s), 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawScene() {
  drawGates(); drawTrail();
  drawPaddle('back');
  if (ball.alive) { const b = ballPose(); drawBall(b.x, b.y, R, b.sx, b.sy); }
  drawPaddle('front');
  drawShards();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ga(1);
  ctx.drawImage(bg, 0, 0, W, H);
  const ox = shake ? rand(-1, 1) * shake : 0, oy = shake ? rand(-1, 1) * shake : 0;
  ctx.translate(ox, oy);
  drawSky();

  // reflections in the glossy floor and ceiling
  ctx.save(); ctx.beginPath(); ctx.rect(-50, floorY, W + 100, H - floorY + 50); ctx.clip();
  ctx.translate(0, 2 * floorY); ctx.scale(1, -1); RA = 0.3; drawScene(); RA = 1; ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(-50, -50, W + 100, ceilY + 50); ctx.clip();
  ctx.translate(0, 2 * ceilY); ctx.scale(1, -1); RA = 0.16; drawScene(); RA = 1; ctx.restore();

  drawSurfaces();
  drawRail();
  drawScene();
  drawParticles();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flash > 0) { ctx.globalCompositeOperation = 'lighter'; ga(flash * 0.35); ctx.fillStyle = hsla(hue, 80, 75, 1); ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ga(1); }
  ctx.drawImage(vig, 0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const gx = Math.floor(Math.random() * 160), gy = Math.floor(Math.random() * 160);
  ctx.translate(-gx, -gy); ga(0.045); ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width + 160, cv.height + 160);
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  timeScale += (1 - timeScale) * Math.min(1, rdt * 1.1);
  update(rdt * timeScale, rdt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
