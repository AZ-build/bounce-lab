<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02040a">
<title>Rebound v1</title>
<style>
  :root { --accent: #3ee6ff; --gold: #ffc24a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .hide { display: none !important; }

  /* HUD */
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
  #hudL { display: flex; flex-direction: column; gap: 6px; }
  #score { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; text-shadow: 0 0 18px var(--accent); font-variant-numeric: tabular-nums; }
  #dist { font-size: 12px; opacity: .65; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
  #hudC { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 4px; }
  #mult { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.55); transition: color .2s, transform .2s; }
  #mult.hot { color: var(--gold); text-shadow: 0 0 12px var(--gold); transform: scale(1.15); }
  #flow { width: 84px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  #flowFill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transform-origin: left; transform: scaleX(0); }
  #hudR { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  #lives { display: flex; gap: 5px; padding-top: 6px; }
  #lives i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--accent) 55%, transparent 72%); box-shadow: 0 0 10px var(--accent); }
  #mute { pointer-events: auto; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #fff; border-radius: 50%;
    width: 36px; height: 36px; font-size: 15px; display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* banner */
  #banner { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); text-align: center; pointer-events: none; opacity: 0; width: 92vw; }
  #banner.show { animation: ban 3.2s ease forwards; }
  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.96); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 6px); } }
  #bTitle { font-size: 22px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 22px var(--accent); }
  #bSub { margin-top: 6px; font-size: 13px; opacity: .8; letter-spacing: .3px; }

  /* score popups */
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 15px; color: var(--gold); text-shadow: 0 0 10px rgba(255,190,60,.8); white-space: nowrap; will-change: transform, opacity; }
  .pop.big { font-size: 20px; color: #fff; text-shadow: 0 0 14px var(--accent); }
  .pop.flow { font-size: 18px; color: var(--gold); letter-spacing: 2px; }

  /* joystick */
  #joy { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .15s;
    border: 1.5px solid rgba(255,255,255,.22); background: radial-gradient(circle, rgba(255,255,255,.06), rgba(255,255,255,0) 70%); }
  #joy.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.9), var(--accent) 60%, transparent 75%); box-shadow: 0 0 22px var(--accent); opacity: .85; }

  /* jump button */
  #jumpBtn { position: fixed; right: calc(env(safe-area-inset-right) + 22px); bottom: calc(env(safe-area-inset-bottom) + 30px); width: 86px; height: 86px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: rgba(255,255,255,.85);
    border: 1.5px solid rgba(255,255,255,.28); background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.02)); box-shadow: 0 0 24px rgba(0,0,0,.4) inset;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .08s, box-shadow .08s; }
  #jumpBtn.down { transform: scale(.92); box-shadow: 0 0 30px var(--accent); border-color: var(--accent); }

  /* screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 24px calc(env(safe-area-inset-bottom) + 56px); text-align: center;
    background: linear-gradient(to top, rgba(2,4,10,.92) 0%, rgba(2,4,10,.55) 45%, rgba(2,4,10,0) 70%); }
  .logo { font-size: 54px; font-weight: 900; letter-spacing: 10px; margin-right: -10px; line-height: 1;
    background: linear-gradient(180deg, #fff 20%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px var(--accent)); }
  .tag { margin-top: 8px; font-size: 13px; letter-spacing: 3px; opacity: .7; text-transform: uppercase; }
  .how { margin: 26px 0 22px; display: grid; gap: 10px; font-size: 15px; opacity: .9; }
  .how b { color: var(--accent); }
  .btn { pointer-events: auto; border: 0; border-radius: 999px; padding: 17px 46px; font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #02040a;
    background: linear-gradient(180deg, #fff, var(--accent)); box-shadow: 0 0 34px var(--accent); }
  .btn:active { transform: scale(.97); }
  .small { margin-top: 14px; font-size: 12px; opacity: .55; letter-spacing: 1px; min-height: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 26px; margin: 18px 0 24px; font-size: 14px; text-align: left; }
  .stats span { opacity: .6; }
  .stats b { text-align: right; }
  #oScore { font-size: 64px; font-weight: 900; text-shadow: 0 0 30px var(--accent); line-height: 1; margin-top: 6px; }
  #oBest { margin-top: 6px; font-size: 13px; letter-spacing: 2px; color: var(--gold); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pops"></div>

<div id="hud" class="hide">
  <div id="hudL"><div id="score">0</div><div id="dist">0 m</div></div>
  <div id="hudC"><div id="mult">×1</div><div id="flow"><div id="flowFill"></div></div></div>
  <div id="hudR"><div id="lives"></div><button id="mute" class="ui" aria-label="Sound">🔊</button></div>
</div>
<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>
<div id="joy"><div id="knob"></div></div>
<div id="jumpBtn" class="hide">JUMP</div>

<div id="title" class="screen ui">
  <div class="logo">REBOUND</div>
  <div class="tag">a Bouncer experiment</div>
  <div class="how">
    <div><b>Drag</b> anywhere to roll</div>
    <div><b>Tap</b> to jump · tap again in the air to <b>dash</b></div>
    <div>Collect gold · fly through rings · don't fall</div>
  </div>
  <button id="playBtn" class="btn">PLAY</button>
  <div id="bestT" class="small"></div>
</div>

<div id="over" class="screen ui hide">
  <div class="tag">run complete</div>
  <div id="oScore">0</div>
  <div id="oBest"></div>
  <div class="stats">
    <span>Distance</span><b id="oDist">0 m</b>
    <span>Sector reached</span><b id="oSector">1</b>
    <span>Gold</span><b id="oOrbs">0</b>
    <span>Rings</span><b id="oHoops">0</b>
  </div>
  <button id="againBtn" class="btn">PLAY AGAIN</button>
</div>
