// ---------- physics ----------
function stepBall(dt, ph, pv) {
  ball.vy -= G * gdir * dt; ball.h += ball.vy * dt;
  ball.sqv += (-650 * ball.sq - 14 * ball.sqv) * dt; ball.sq += ball.sqv * dt;
  // bottom platform
  if (ball.h <= ph) {
    ball.h = ph;
    const vr = pv - ball.vy;              // how fast ball and platform are closing
    if (vr > 0) { ball.vy = Math.min(MAXV * VMAX, pv + Math.max(E * vr, gdir > 0 ? VHOP : 0)); if (vr > 0.05 * VMAX) hitPaddle(vr, pv); }
  }
  // top platform (locked GAPH above the bottom one)
  const top = ph + GAPH - 2 * R;
  if (ball.h >= top) {
    ball.h = top;
    const vr = ball.vy - pv;
    if (vr > 0) { ball.vy = Math.max(-MAXV * VMAX, pv - Math.max(E * vr, gdir < 0 ? VHOP : 0)); if (vr > 0.05 * VMAX) hitTop(vr, pv); }
  }
}

function stepPhysics(dt) {
  if (dt <= 1e-6) return;
  const ph0 = paddle.h;
  paddle.h += (paddle.th - paddle.h) * (1 - Math.exp(-dt * FOLLOW));
  paddle.v = (paddle.h - ph0) / dt;
  if (!ball.alive) return;
  const n = Math.max(1, Math.ceil(dt / 0.004));
  for (let i = 0; i < n; i++) stepBall(dt / n, ph0 + (paddle.h - ph0) * (i + 1) / n, paddle.v);
}

function hitRect(cx, cy, r, x1, y1, x2, y2) {
  const nx = clamp(cx, x1, x2), ny = clamp(cy, y1, y2), dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}

function titleAI() {
  // gently bobs the platforms on the title screen
  paddle.th = ZMAX * (0.35 + 0.25 * Math.sin(t * 0.7));
}

function update(dt, rdt) {
  t += dt;
  ball.spinV *= Math.pow(0.35, rdt); ball.spin += (ball.spinV + 0.7) * rdt;
  magT = Math.max(0, magT - rdt);
  if (odT > 0) {
    odT -= rdt; od = Math.max(0, odT / OD_TIME); updateOD();
    odBeat -= rdt;
    if (odBeat <= 0) { odBeat = 0.12; odStep++; const n = [0, 4, 7, 12, 7, 4, 9, 12][odStep % 8] + (odStep % 16 >= 8 ? 5 : 0); ping(523.25 * Math.pow(2, n / 12), 0.035, 0.3, 0, 0.5); }
    if (odT <= 0) { odT = 0; od = 0; updateOD(); $('od').classList.remove('on'); ping(392, 0.05, 1, 0); ping(261.6, 0.05, 1.4, 0.1); }
  }
  for (let i = flyers.length - 1; i >= 0; i--) { flyers[i].t += rdt * 1.5; if (flyers[i].t >= 1) { flyers.splice(i, 1); if ($('score').animate) $('score').animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 160 }); } }
  slowT = Math.max(0, slowT - rdt); coinT -= rdt; if (coinT <= 0) coinStreak = 0; invuln = Math.max(0, invuln - rdt); hitFlash = Math.max(0, hitFlash - rdt * 2);
  worldMul += ((slowT > 0 ? 0.5 : odT > 0 ? 1.2 : 1) - worldMul) * Math.min(1, rdt * 3);
  const baseSpeed = speed0 * (1 + Math.min(passed, 80) * 0.006);
  if (state === 'play') speed = baseSpeed * worldMul;
  else if (state === 'title') speed = speed0 * 0.45;
  else speed *= Math.pow(0.15, rdt);
  camX += speed * dt;

  if (state === 'title' && !dragging && !keyDir) titleAI();
  if (keyDir) paddle.th = clamp(paddle.th + keyDir * ZMAX * 2.2 * rdt, ZMIN, ZMAX);
  stepPhysics(dt);
  ball.charge = Math.max(0, ball.charge - rdt * 1.2);
  paddle.flash = Math.max(0, paddle.flash - rdt * 3);

  hueT = SECTOR_HUES[(sector - 1) % SECTOR_HUES.length] + Math.min(combo, 8) * 3;
  if (odT > 0) hue = (hue + rdt * 220) % 360;
  else { hue += (((hueT - hue + 540) % 360) - 180) * Math.min(1, rdt * 2.5); hue = (hue + 360) % 360; }
  glowI += ((0.6 + Math.min(combo, 9) * 0.07 + ball.charge * 0.8 + (odT > 0 ? 1 : 0)) - glowI) * Math.min(1, rdt * 6);

  if (state === 'play') {
    while (lastGateWX < camX + W * 1.25 + 100) {
      slot++;
      const d = Math.min(1, gateCount / 50);
      const spacing = Math.max(baseSpeed * (1.85 - 0.5 * d + Math.random() * 0.35), R * 12);
      const sf = featuresFor(1 + Math.floor(gateCount / SECTOR_LEN));
      if (slot <= WARMUP) warmSlot(lastGateWX);
      else if (sf.serpent && gateCount > 2 && Math.random() < 0.4) lastGateWX += spawnSerpent(lastGateWX);
      else { makeGate(lastGateWX); makeItems(lastGateWX + spacing / 2); }
      lastGateWX += spacing;
    }
    if (!bladesAnnounced && gates.some(g => g.wx - camX < W + speed0 * 1.2)) { bladesAnnounced = true; banner('Blades ahead', 'watch the right edge'); }
  }

  const cyc = floorY - ball.h - R;
  for (let i = gates.length - 1; i >= 0; i--) {
    const g = gates[i], sx = g.wx - camX;
    g.flash = Math.max(0, g.flash - rdt * 2);
    const off = g.osc ? g.osc.a * Math.sin(t * g.osc.f + g.osc.p) : 0;
    g.clo = g.lo + off; g.chi = g.hi + off; g.cmy = g.my + off;
    if (g.pulse) { const ph = ((t + g.pulse.ph) % g.pulse.per) / g.pulse.per; g.on = ph < 0.55; g.flick = !g.on && ph > 0.88; }
    if (sx < -W * 0.3) { gates.splice(i, 1); continue; }

    if (!g.got) {

        gainOD(0.06); addFly(sx, my); g.got = true; combo++; addScore(combo); g.flash = 1; addPopup(g.wx, my - R, `+${combo}`);
        if (combo % 5 === 0) { const bonus = combo * 2; addScore(bonus); banner(`Chain ×${combo}`, `+${bonus} bonus`); }
        sparkleSnd(combo); vib(10);
        burst(g.wx, my, 45, 18);
        rings.push({ wx: g.wx, y: my, t: 0, s: 1, air: true });

    }
    const r = R * 0.74, x1 = sx - BW / 2, x2 = sx + BW / 2;
    if (!g.broken && g.on && ((g.clo > 0 && hitRect(ballX, cyc, r * (odT > 0 ? 1.6 : 1), x1, floorY - g.clo * P, x2, floorY)) ||
        (g.chi < 1 && hitRect(ballX, cyc, r * (odT > 0 ? 1.6 : 1), x1, ceilY - 50, x2, floorY - g.chi * P)))) { if (odT > 0) smashBlade(g); else { takeHit(); g.flash = 1; } }
    if (!g.passed && sx + BW / 2 < ballX - R) {
      g.passed = true; addScore(1);
      if (g.mini) { ping(1046.5 * Math.pow(2, SCALE[Math.round(g.seed * 2) % 6] / 12), 0.02, 0.2); updateHUD(); continue; }
      passed++;
      const ns = 1 + Math.floor(passed / SECTOR_LEN);
      if (ns > sector) {
        sector = ns; const bonus = 10 * (sector - 1); addScore(bonus);
        feat = featuresFor(sector);
        const info = feat.remix ? 'remix · ' + feat.remix.map(k => TWIST_NAMES[k]).join(' + ') : SECTOR_INFO[sector];
        banner(`Sector ${sector}`, info + ` · +${bonus}`); sectorSnd(); flash = Math.max(flash, 0.35);
        if (feat.gravity) { flipT = 3.5; flipWarned = false; }
        else if (gdir < 0) { gdir = 1; flipSnd(); }
        if (feat.lasers) laserT = 3;
      }
      if (!g.got) { combo = 0; chime(0, true); } else chime(combo);
      updateHUD(true, false);
      if (gateCount > 5) $('coach').classList.add('hidden');
    }
  }

  // the squeeze: platforms close in on some sectors
  const gTarget = P * GAP_FRAC * (state === 'play' ? feat.squeeze : 1);
  if (Math.abs(gTarget - GAPH) > 0.5) {
    GAPH += (gTarget - GAPH) * Math.min(1, rdt * 0.8);
    ZMAX = P - GAPH - PT - R * 0.2; VHOP = Math.sqrt(2 * G * MIN_HOP * GAPH);
    paddle.th = Math.min(paddle.th, ZMAX);
  }
  // gravity flips
  if (state === 'play' && feat.gravity && ball.alive) {
    flipT -= dt;
    if (flipT < 1.2 && !flipWarned) { flipWarned = true; warnSnd(); }
    if (flipT <= 0) { gdir = -gdir; flipT = rand(5.5, 8); flipWarned = false; flipSnd(); flash = Math.max(flash, 0.22); shake = Math.max(shake, R * 0.25); vib(15); }
  }
  // lasers: a warning line, then a beam across the screen
  if (state === 'play' && feat.lasers && ball.alive) {
    laserT -= dt;
    if (laserT <= 0) { laserT = rand(3.2, 5.5) * (feat.remix ? 1.3 : 1); const bf = (ball.h + R) / P; lasers.push({ y: clamp(bf + rand(-0.22, 0.22), 0.08, 0.92), t: 0, hit: false, fired: false }); warnSnd(); }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const L = lasers[i]; L.t += dt;
    if (L.t > 1.2 && !L.fired) { L.fired = true; laserSnd(); shake = Math.max(shake, R * 0.2); }
    if (L.fired && L.t < 1.55 && !L.hit && ball.alive && state === 'play' && Math.abs(cyc - (floorY - L.y * P)) < R * 0.85) {
      L.hit = true; if (odT > 0) addPopup(camX + ballX, cyc - R * 2, 'immune'); else takeHit();
    }
    if (L.t > 1.9) lasers.splice(i, 1);
  }
  dk += ((feat.eclipse && state === 'play' ? 1 : 0) - dk) * Math.min(1, rdt * 0.8);
  if (AC && padLP) {
    const lv = state === 'play' ? sector : 1;
    padLP.frequency.setTargetAtTime(340 + Math.min(lv - 1, 7) * 110, AC.currentTime, 1.5);
    const bl = lv >= 3 && state === 'play' ? 0.03 : 0;
    bassAmp.gain.setTargetAtTime(bl, AC.currentTime, 0.8); bassPulse.gain.setTargetAtTime(bl, AC.currentTime, 0.8);
    if (lv >= 5 && odT <= 0 && state === 'play') { ambBeat -= rdt; if (ambBeat <= 0) { ambBeat = 0.24; if (Math.random() < 0.6) ping(1046.5 * Math.pow(2, SCALE[Math.floor(Math.random() * 8)] / 12), 0.012, 0.5, 0, 0.8); } }
  }

  // magnet pulls gold toward the ball
  if (magT > 0 && ball.alive) {
    const tw = camX + ballX, ty = (ball.h + R) / P;
    for (const it of items) {
      if (!it.alive || (it.type !== 'coin' && it.type !== 'pop')) continue;
      const dx = it.wx - tw; if (dx < -R || dx > W * 0.55) continue;
      const k = Math.min(1, rdt * (5 - 3 * dx / (W * 0.55)));

    }
  }
  // friendly objects
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], sx = it.wx - camX;
    if (sx < -W * 0.3) { items.splice(i, 1); continue; }
    if (!it.alive || !ball.alive || state !== 'play') continue;
    const iy = floorY - it.y * P, dy = cyc - iy, dist = Math.hypot(sx - ballX, dy);
    if (it.type === 'coin') {
      if (dist < R * 1.3) {
        gainOD(0.015); addFly(sx, iy); it.alive = false; addScore(1); coinStreak++; coinT = 0.9; coinSnd(coinStreak); burst(it.wx, iy, 45, 6);
        const tr = trails[it.trail];
        if (tr && ++tr.got === tr.n) { addScore(5); addPopup(it.wx, iy - R * 1.6, 'perfect +5'); ringSnd(); }
        updateHUD();
      }
      continue;
    }
    if (it.type === 'pop' && dist < R * 1.55) {
      gainOD(0.03); it.alive = false; addScore(2); addPopup(it.wx, iy - R, '+2');
      ball.vy = dy < 0 ? Math.max(ball.vy, 0.5 * VMAX) : Math.min(ball.vy, -0.35 * VMAX); ball.rest = false;
      burst(it.wx, iy, 45, 16); popSnd(); vib(8); updateHUD(true);
    } else if (it.type === 'ring' && !it.done && sx < ballX) {
      it.done = true;
      if (Math.abs(dy) < R * 1.1) { gainOD(0.08); addFly(sx, iy); it.alive = false; addScore(5); addPopup(it.wx, iy - R * 2, '+5'); ringSnd(); burst(it.wx, iy, 45, 24); rings.push({ wx: it.wx, y: iy, t: 0, s: 1.6, air: true }); updateHUD(true); vib(12); }
    } else if (it.type === 'magnet' && dist < R * 1.6) {
      it.alive = false; magT = MAGNET_TIME; banner('Magnet', 'gold comes to you'); burst(it.wx, iy, 195, 24); magnetSnd(); vib(14);
    } else if ((it.type === 'shield' || it.type === 'crystal') && dist < R * 1.5) {
      it.alive = false; vib(14);
      if (it.type === 'shield') { shields = Math.min(START_SHIELDS, shields + 1); updateShields(); banner('Shield repaired', `${shields} of ${START_SHIELDS}`); burst(it.wx, iy, 150, 22); repairSnd(); }
      else { slowT = 4.5; banner('Slow time', 'the world slows down'); burst(it.wx, iy, 280, 22); crystalSnd(); }
    }
  }

  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.t += rdt; p.y -= R * 1.4 * rdt; if (p.t > 1.1) popups.splice(i, 1); }

  if (ball.alive) trail.push({ wx: camX + ballX, y: floorY - ball.h - R });
  while (trail.length && (camX + ballX - trail[0].wx > ballX + 60 || trail.length > 600)) trail.shift();

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'spark' && p.y > floorY && p.vy > 0) { p.y = floorY; p.vy *= -0.3; p.vx *= 0.6; }
    if (p.k === 'glint') { p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt); }

  ceilFlash = Math.max(0, ceilFlash - rdt * 3);

    windGain.gain.setTargetAtTime(target, AC.currentTime, 0.06);
    windFilter.frequency.setTargetAtTime(380 + sp * 1800, AC.currentTime, 0.08);

}

    g = ctx.createLinearGradient(0, yH, 0, yH + p.h * 0.25);

  }

  g.addColorStop(0, hsla(hue, 90, 75, 0)); g.addColorStop(0.5, hsla(hue, 90, 80, 0.55)); g.addColorStop(1, hsla(hue, 90, 75, 0));
  ga(1); ctx.fillStyle = g; ctx.fillRect(0, yH - 0.5, W, 1);

function drawGrid(alpha) {
  const sp = R * 4.6, Zc = Math.max(W, H) * 0.9, zN = D / (H + 20 - yH), zF = 9;
  const X = (wx, z) => W / 2 + (wx - camX - W / 2) / z;

function blade(sx, y1, y2, tipY, fl) {
  if (y2 - y1 < 1) return;

  let g = ctx.createLinearGradient(sx - gw, 0, sx + gw, 0);
  g.addColorStop(0, hsla(hue, 90, 60, 0)); g.addColorStop(0.5, hsla(hue, 90, 62, 0.32 + 0.3 * fl)); g.addColorStop(1, hsla(hue, 90, 60, 0));
  ga(1); ctx.fillStyle = g; ctx.fillRect(sx - gw, y1, gw * 2, y2 - y1);

  g.addColorStop(0, hsla(hue, 90, 65, 0.9)); g.addColorStop(0.5, 'rgba(255,255,255,1)'); g.addColorStop(1, hsla(hue, 90, 65, 0.9));
  ctx.fillStyle = g; ctx.fillRect(sx - BW / 2, y1, BW, y2 - y1);
  const tg = ctx.createRadialGradient(sx, tipY, 0, sx, tipY, BW * 5);
  tg.addColorStop(0, 'rgba(255,255,255,0.95)'); tg.addColorStop(0.25, hsla(hue, 95, 70, 0.6)); tg.addColorStop(1, hsla(hue, 90, 60, 0));
  ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(sx, tipY, BW * 5, 0, TAU); ctx.fill();

  ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, BW * 16, 0, TAU); ctx.fill(); ctx.restore();
}

function drawMote(g, sx) {
      const my = floorY - g.cmy * P, pr = R * 0.32 * (1 + 0.12 * Math.sin(t * 5 + g.seed));
      const mg = ctx.createRadialGradient(sx, my, 0, sx, my, pr * 4);
      mg.addColorStop(0, 'rgba(255,255,255,0.9)'); mg.addColorStop(0.2, hsla(45, 95, 68, 0.55)); mg.addColorStop(1, hsla(45, 90, 60, 0));
      ga(1); ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(sx, my, pr * 4, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(sx, my); ctx.rotate(t * 1.6 + g.seed);

      ctx.beginPath(); ctx.moveTo(0, -pr); ctx.lineTo(pr * 0.7, 0); ctx.lineTo(0, pr); ctx.lineTo(-pr * 0.7, 0); ctx.closePath(); ctx.stroke();
      ctx.restore();
}

function drawGates() {
  ctx.globalCompositeOperation = 'lighter';
  for (const g of gates) {
    const sx = g.wx - camX; if (sx < -BW * 20 || sx > W + BW * 20) continue;
    if (g.broken) { if (!g.got) drawMote(g, sx); continue; }
    const oRA = RA; if (!g.on) RA *= g.flick ? 0.35 + 0.35 * Math.sin(t * 50) : 0.12;
    if (g.clo > 0) blade(sx, floorY - g.clo * P, floorY, floorY - g.clo * P, g.flash);
    if (g.chi < 1) blade(sx, -40, floorY - g.chi * P, floorY - g.chi * P, g.flash);
    RA = oRA;
    if (!g.got) drawMote(g, sx);
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const x0 = trail[0].wx - camX;
  ctx.beginPath();
  for (let i = 0; i < trail.length; i++) { const p = trail[i]; const x = p.wx - camX; i ? ctx.lineTo(x, p.y) : ctx.moveTo(x, p.y); }
  const boost = 1 + ball.charge * 1.5 + (odT > 0 ? 2 : 0);
  const passes = odT > 0 ? [[R * 2.2, 0.1 * boost], [R * 0.9, 0.22 * boost], [2.4, 0.95]] : [[R * 1.3, 0.07 * boost], [R * 0.45, 0.2 * boost], [1.6, 0.85]];
  for (const [lw, a] of passes) {
    const g = ctx.createLinearGradient(Math.min(x0, ballX - 1), 0, ballX, 0);
    g.addColorStop(0, hsla(hue, 95, 70, 0)); g.addColorStop(0.7, hsla(hue, 95, 72, Math.min(1, a * 0.5))); g.addColorStop(1, hsla(hue, 95, lw < 2 ? 92 : 70, Math.min(1, a)));
    ctx.strokeStyle = g; ctx.lineWidth = lw; ga(1); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// the hover platform, drawn in two passes so its front edge sits in front of the ball
function drawPlate(part, y, fl, isTop) {
  const x = ballX;
  if (isTop) { ctx.save(); ctx.translate(0, 2 * y); ctx.scale(1, -1); }
  const k = 0.1; // fixed tilt so the plate always reads clearly
  if (part === 'back') {
    ctx.globalCompositeOperation = 'lighter';
    // hover beam to the floor
    if (!isTop && floorY - y > 3) {
      const bgd = ctx.createLinearGradient(0, y + PT, 0, floorY);
      bgd.addColorStop(0, hsla(hue, 90, 70, 0.16 + fl * 0.2)); bgd.addColorStop(1, hsla(hue, 90, 60, 0.02));
      ctx.fillStyle = bgd; ga(1);
      ctx.beginPath(); ctx.moveTo(x - PW * 0.55, y + PT); ctx.lineTo(x + PW * 0.55, y + PT); ctx.lineTo(x + PW * 0.85, floorY); ctx.lineTo(x - PW * 0.85, floorY); ctx.closePath(); ctx.fill();
    }
    // glow
    const gg = ctx.createRadialGradient(x, y + PT * 0.5, 0, x, y + PT * 0.5, PW * 1.8);
    gg.addColorStop(0, hsla(hue, 90, 65, 0.22 + fl * 0.35)); gg.addColorStop(1, hsla(hue, 90, 60, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(x, y + PT * 0.5, PW * 1.8, PW * 0.6, 0, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    if (k > 0.005) {
      // top face (seen from above)
      const tf = ctx.createLinearGradient(0, y - PW * k, 0, y + PW * k);
      tf.addColorStop(0, '#1a2238'); tf.addColorStop(1, '#0b0f1c');
      ctx.fillStyle = tf; ctx.beginPath(); ctx.ellipse(x, y, PW, PW * k, 0, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hsla(hue, 95, 80, 0.55 + fl * 0.45); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x, y, PW, PW * k, 0, Math.PI, TAU); ctx.stroke();
      // ball shadow / light on the plate
      if (ball.alive && !isTop) {
        const dist = clamp((ball.h - paddle.h) / (P * 0.5), 0, 1);
        ctx.globalCompositeOperation = 'source-over';
        const rx = R * (1.05 - 0.5 * dist);
        ctx.fillStyle = `rgba(0,0,0,${0.6 * (1 - dist)})`;
        ctx.beginPath(); ctx.ellipse(x, y, rx, Math.max(1, rx * k * 1.2), 0, 0, TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over'; ga(1);
  } else {
    // side band (front edge)
    const sb = ctx.createLinearGradient(0, y, 0, y + PT);
    sb.addColorStop(0, hsla(hue, 95, 85, 0.95)); sb.addColorStop(0.25, '#1b2440'); sb.addColorStop(0.8, '#080b15'); sb.addColorStop(1, hsla(hue, 90, 60, 0.8));
    ctx.fillStyle = sb; ga(1);
    ctx.beginPath();
    if (k > 0.005) {
      ctx.ellipse(x, y, PW, PW * k, 0, 0, Math.PI, false);
      ctx.ellipse(x, y + PT, PW, PW * k, 0, Math.PI, 0, true);
    } else {
      const kk = Math.max(0.005, -k);
      ctx.ellipse(x, y, PW, PW * kk, 0, Math.PI, TAU, false);
      ctx.ellipse(x, y + PT, PW, PW * kk, 0, 0, Math.PI, false);
    }
    ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    // front rim + specular streak
    ctx.strokeStyle = hsla(hue, 95, 82, 0.75 + fl * 0.25); ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(x, y, PW, PW * Math.max(0.005, Math.abs(k)), 0, 0, Math.PI); ctx.stroke();
    const sp = ctx.createLinearGradient(x - PW, 0, x + PW, 0);
    sp.addColorStop(0, 'rgba(255,255,255,0)'); sp.addColorStop(0.3, 'rgba(255,255,255,0.75)'); sp.addColorStop(0.45, 'rgba(255,255,255,0)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp; ctx.fillRect(x - PW, y + PW * Math.max(0, k) + PT * 0.2, PW * 2, Math.max(1, PT * 0.18));
    if (k < -0.005) { // energy underside when above eye level
      ctx.fillStyle = hsla(hue, 90, 65, 0.35 + fl * 0.4);
      ctx.beginPath(); ctx.ellipse(x, y + PT, PW * 0.95, PW * -k * 0.95, 0, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over'; ga(1);
  }
  if (isTop) ctx.restore();
}

function drawPaddle(part) {
  const yb = floorY - paddle.h, yt = yb - GAPH;
  if (part === 'back') {
    // faint frame showing the two platforms are locked together
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createLinearGradient(0, yt, 0, yb);
    fg.addColorStop(0, hsla(hue, 90, 75, 0.25)); fg.addColorStop(0.5, hsla(hue, 90, 75, 0.04)); fg.addColorStop(1, hsla(hue, 90, 75, 0.25));
    ctx.fillStyle = fg; ga(1);
    ctx.fillRect(ballX - PW, yt, 1, yb - yt); ctx.fillRect(ballX + PW - 1, yt, 1, yb - yt);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawPlate(part, yb, paddle.flash, false);
  drawPlate(part, yt, ceilFlash, true);
}

function drawRail() {
  // shows how far the platform can travel
  const x = ballX - PW - R * 0.6, y0 = floorY - ZMIN, y1 = floorY - ZMAX - PT;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = hsla(hue, 70, 75, 0.12); ga(1);
  ctx.fillRect(x, y1, 1, y0 - y1);
  ctx.fillRect(x - 3, y1, 7, 1); ctx.fillRect(x - 3, y0, 7, 1);
  const py = floorY - paddle.h;
  ctx.fillStyle = hsla(hue, 90, 85, 0.6 + paddle.flash * 0.4); ctx.fillRect(x - 2, py - 1, 5, 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawBall(x, y, r, sx, sy) {
  const odOn = odT > 0, bh = hue;
  // halo
  ctx.globalCompositeOperation = 'lighter';
  const hr = r * (odOn ? 4 : 2.8);
  let g = ctx.createRadialGradient(x, y, r * 0.6, x, y, hr);
  g.addColorStop(0, hsla(bh, 95, 62, (odOn ? 0.5 : 0.24) * Math.min(1.6, glowI))); g.addColorStop(1, hsla(bh, 90, 60, 0));
  ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, hr, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(x, y); ctx.scale(sx, sy);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
  // deep glass body, lit from inside
  g = ctx.createRadialGradient(0, r * 0.3, r * 0.05, 0, 0, r * 1.05);
  g.addColorStop(0, hsla(bh, 85, odOn ? 72 : 44, 1)); g.addColorStop(0.5, hsla(bh, 70, odOn ? 40 : 17, 1)); g.addColorStop(1, '#04050b');
  ga(1); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  // swirling energy inside (spins faster after hard hits)
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const a = ball.spin * (k % 2 ? -1 : 1) * (1 + k * 0.35) + k * 2.1;
    const px = Math.cos(a) * r * 0.42, py = Math.sin(a) * r * 0.32 + r * 0.1;
    const sg = ctx.createRadialGradient(px, py, 0, px, py, r * 0.62);
    sg.addColorStop(0, hsla((bh + k * 40 - 30 + 360) % 360, 95, 65, odOn ? 0.55 : 0.3)); sg.addColorStop(1, hsla(bh, 95, 60, 0));
    ctx.fillStyle = sg; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  }
  // bright core
  g = ctx.createRadialGradient(0, r * 0.12, 0, 0, r * 0.12, r * 0.5);
  g.addColorStop(0, `rgba(255,255,255,${odOn ? 0.85 : 0.28 + 0.4 * ball.charge})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  // soft glints from nearby light blades
  for (const gt of gates) {
    if (gt.broken) continue;
    const dx = gt.wx - camX - x;
    if (Math.abs(dx) > W * 0.5) continue;
    const u = dx / (Math.abs(dx) + r * 3.2), px = u * r * 0.85, prox = 1 - Math.abs(dx) / (W * 0.5);
    const sg = ctx.createRadialGradient(px, -r * 0.1, 0, px, -r * 0.1, r * 0.5);
    sg.addColorStop(0, hsla(bh, 90, 85, 0.35 * prox * prox)); sg.addColorStop(1, hsla(bh, 90, 70, 0));
    ctx.save(); ctx.scale(0.35, 1); ctx.fillStyle = sg; ctx.fillRect(-r * 3, -r, r * 6, 2 * r); ctx.restore();
  }
  // caustic: light focused through the glass onto its lower edge
  ctx.save(); ctx.translate(0, r * 0.74); ctx.scale(1, 0.42);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.62);
  g.addColorStop(0, hsla(bh, 100, 88, 0.6)); g.addColorStop(1, hsla(bh, 100, 70, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, TAU); ctx.fill(); ctx.restore();
  // edge falloff
  ctx.globalCompositeOperation = 'source-over';
  g = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(2,3,8,0.55)');
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  // thin-film iridescence
  if (ctx.createConicGradient) {
    ctx.globalCompositeOperation = 'screen'; ga(0.12 + ball.charge * 0.2);
    const cg = ctx.createConicGradient(t * 0.5, 0, 0);
    for (let i = 0; i <= 6; i++) cg.addColorStop(i / 6, `hsl(${(bh + i * 60) % 360},90%,55%)`);
    ctx.fillStyle = cg; ctx.fillRect(-r, -r, 2 * r, 2 * r); ga(1);
  }
  // rim light
  ctx.globalCompositeOperation = 'lighter';
  g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, hsla(bh, 100, 86, 0.75));
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  // studio softbox highlight (a clean window reflection instead of the scene)
  ctx.save(); ctx.beginPath(); ctx.ellipse(-r * 0.06, -r * 0.5, r * 0.6, r * 0.3, -0.12, 0, TAU); ctx.clip();
  g = ctx.createLinearGradient(0, -r * 0.82, 0, -r * 0.22);
  g.addColorStop(0, 'rgba(255,255,255,0.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, r); ctx.restore();
  // hot specular
  g = ctx.createRadialGradient(-r * 0.32, -r * 0.58, 0, -r * 0.32, -r * 0.58, r * 0.16);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.58, r * 0.16, 0, TAU); ctx.fill();
  // cracks show lost shields
  const dmg = state === 'title' ? 0 : Math.min(crackPaths.length, START_SHIELDS - shields);
  if (dmg > 0) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const [lw, col] of [[r * 0.14, hsla(bh, 90, 70, 0.22)], [Math.max(0.8, r * 0.04), 'rgba(255,255,255,0.9)']]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      for (let c = 0; c < dmg; c++) for (const path of crackPaths[c]) { ctx.beginPath(); path.forEach((q, i) => i ? ctx.lineTo(q[0] * r, q[1] * r) : ctx.moveTo(q[0] * r, q[1] * r)); ctx.stroke(); }
    }
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function ballPose() {
  const st = ball.rest ? 0 : Math.min(0.17, Math.abs(ball.vy) / VMAX * 0.15);
  const sq = ball.sq;
  const sy = (1 - sq) * (1 + st), sx = (1 + sq * 0.9) * (1 - st * 0.5);
  const y = ball.anchor === 'top' ? floorY - ball.h - 2 * R + R * sy : floorY - ball.h - R * sy;
  return { x: ballX, y, sx, sy };
}

function drawShards() {
  for (const s of shards) {
    const x = s.x - camX;
    ctx.save(); ctx.translate(x, s.y); ctx.rotate(s.rot);
    const L = 18 + 62 * Math.abs(Math.sin(s.rot * 1.3 + s.seed));
    ga(Math.min(1, s.life / 0.8));
    ctx.fillStyle = `hsl(${hue + 30},18%,${L}%)`;
    ctx.beginPath(); ctx.moveTo(s.pts[0][0], s.pts[0][1]); ctx.lineTo(s.pts[1][0], s.pts[1][1]); ctx.lineTo(s.pts[2][0], s.pts[2][1]); ctx.closePath(); ctx.fill();
    if (L > 62) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = hsla(hue, 90, 80, (L - 62) / 18); ctx.lineWidth = 1; ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.restore();
  }
  ga(1);
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const x = p.x - camX, a = clamp(p.life / p.max, 0, 1);
    if (p.k === 'spark') {
      ctx.strokeStyle = hsla(hue + 10, 95, 80, a); ctx.lineWidth = 1.4; ga(1);
      ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x - p.vx * 0.022, p.y - p.vy * 0.022); ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, R * 0.3);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, hsla(p.h != null ? p.h : 45, 90, 70, 0));
      ctx.fillStyle = g; ga(1); ctx.beginPath(); ctx.arc(x, p.y, R * 0.3, 0, TAU); ctx.fill();
    }
  }
  for (const r of rings) {
    if (!r.air) continue;
    const p = r.t / 0.9, a = Math.pow(1 - p, 2) * 0.8;
    ctx.strokeStyle = hsla(hue + 30, 95, 80, a); ctx.lineWidth = 2 * (1 - p) + 0.5;
    ctx.beginPath(); ctx.arc(r.wx - camX, r.y, Math.max(0.1, R * (0.4 + p * 3 * r.s)), 0, TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawItems() {
  ctx.globalCompositeOperation = 'lighter';
  for (const it of items) {
    const x = it.wx - camX; if (x < -80 || x > W + 80) continue;
    const y = floorY - it.y * P, pul = 1 + 0.08 * Math.sin(t * 4 + it.seed);
    if (it.type === 'coin') {
      if (!it.alive) continue;
      const r = R * 0.32, w = Math.abs(Math.cos(t * 3 + it.seed));
      const cg = ctx.createRadialGradient(x, y, 0, x, y, r * 3); cg.addColorStop(0, hsla(45, 95, 65, 0.3)); cg.addColorStop(1, hsla(45, 95, 60, 0));
      ga(1); ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = hsla(45, 95, 58, 0.95); ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, r * w), r, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,200,0.9)'; ctx.lineWidth = 1; ctx.stroke();
      continue;
    }
    if (it.type === 'pop' && it.alive) {
      const r = R * 0.55 * pul;
      let g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.35)'); g.addColorStop(0.7, hsla(45, 90, 60, 0.06)); g.addColorStop(0.92, hsla(45, 95, 70, 0.55)); g.addColorStop(1, hsla(45, 95, 70, 0));
      ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = hsla((t * 60 + it.seed * 50) % 360, 90, 75, 0.4); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, r * 0.86, -2.4, -0.6); ctx.stroke();
      g = ctx.createRadialGradient(x, y, r, x, y, r * 2.4); g.addColorStop(0, hsla(45, 95, 60, 0.18)); g.addColorStop(1, hsla(45, 95, 60, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, TAU); ctx.fill();
    } else if (it.type === 'ring' && it.alive) {
      const rx = R * 0.42, ry = R * 1.75, a = it.done ? 0.22 : 0.9;
      ga(1); ctx.lineWidth = 10; ctx.strokeStyle = hsla(45, 95, 60, a * 0.15);
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = hsla(45, 95, 70, a); ctx.stroke();
      ctx.lineWidth = 1; ctx.strokeStyle = `rgba(255,255,255,${a * 0.6})`; ctx.beginPath(); ctx.ellipse(x, y, rx * 0.75, ry * 0.93, 0, -1.9, -1.2); ctx.stroke();
    } else if (it.type === 'magnet' && it.alive) {
      const s = R * 0.55 * pul;
      const mg = ctx.createRadialGradient(x, y, 0, x, y, s * 3.2); mg.addColorStop(0, hsla(195, 95, 70, 0.4)); mg.addColorStop(1, hsla(195, 90, 60, 0));
      ga(1); ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(x, y, s * 3.2, 0, TAU); ctx.fill();
      for (let k = 0; k < 3; k++) { const f = ((t * 0.8 + k / 3) % 1); ctx.strokeStyle = hsla(195, 95, 80, 0.5 * (1 - f)); ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, s * (1.1 + f * 1.8), 0, TAU); ctx.stroke(); }
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 2 + it.seed) * 0.25);
      ctx.lineCap = 'butt'; ctx.lineWidth = s * 0.42; ctx.strokeStyle = hsla(195, 90, 62, 0.95);
      ctx.beginPath(); ctx.moveTo(-s * 0.55, -s * 0.6); ctx.lineTo(-s * 0.55, s * 0.05); ctx.arc(0, s * 0.05, s * 0.55, Math.PI, 0, true); ctx.lineTo(s * 0.55, -s * 0.6); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.moveTo(-s * 0.55, -s * 0.6); ctx.lineTo(-s * 0.55, -s * 0.32); ctx.moveTo(s * 0.55, -s * 0.6); ctx.lineTo(s * 0.55, -s * 0.32); ctx.stroke();
      ctx.restore();
    } else if ((it.type === 'shield' || it.type === 'crystal') && it.alive) {
      const h = it.type === 'shield' ? 150 : 280, s = R * 0.5 * pul;
      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3); g.addColorStop(0, hsla(h, 90, 70, 0.4)); g.addColorStop(1, hsla(h, 90, 60, 0));
      ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s * 3, 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(x, y); ctx.rotate(it.type === 'crystal' ? Math.sin(t * 2 + it.seed) * 0.3 : t * 0.8 + it.seed);
      ctx.beginPath();
      if (it.type === 'shield') { for (let k = 0; k < 6; k++) { const an = k / 6 * TAU; ctx.lineTo(Math.cos(an) * s, Math.sin(an) * s); } }
      else { ctx.moveTo(0, -s * 1.5); ctx.lineTo(s * 0.6, 0); ctx.lineTo(0, s * 1.5); ctx.lineTo(-s * 0.6, 0); }
      ctx.closePath(); ctx.fillStyle = hsla(h, 90, 70, 0.4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
      if (it.type === 'shield') { ctx.rotate(-(t * 0.8 + it.seed)); ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fillRect(-s * 0.08, -s * 0.45, s * 0.16, s * 0.9); ctx.fillRect(-s * 0.45, -s * 0.08, s * 0.9, s * 0.16); }
      ctx.restore();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawWarnings() {
  // glowing marks on the right edge show where the next blades will be
  if (state !== 'play') return;
  const look = speed0 * 1.6;
  ctx.globalCompositeOperation = 'lighter';
  for (const g of gates) {
    const sx = g.wx - camX; if (sx <= W - 2 || sx > W + look) continue;
    const a = clamp(1 - (sx - W) / look, 0, 1) * 0.85 + 0.15;
    const segs = [];
    if (g.clo > 0) segs.push([floorY - g.clo * P, floorY]);
    if (g.chi < 1) segs.push([0, floorY - g.chi * P]);
    for (const [y1, y2] of segs) {
      const gg = ctx.createLinearGradient(W, 0, W - 28, 0);
      gg.addColorStop(0, hsla(hue, 95, 70, 0.5 * a)); gg.addColorStop(1, hsla(hue, 95, 70, 0));
      ga(1); ctx.fillStyle = gg; ctx.fillRect(W - 28, y1, 28, y2 - y1);
      ctx.fillStyle = hsla(hue, 95, 88, 0.9 * a); ctx.fillRect(W - 3, y1, 3, y2 - y1);
    }
    if (g.broken) continue;
    if (!g.got) {
      const my = floorY - g.cmy * P;
      ctx.fillStyle = hsla(45, 95, 70, 0.9 * a);
      ctx.beginPath(); ctx.moveTo(W - 5, my); ctx.lineTo(W - 14, my - 6); ctx.lineTo(W - 14, my + 6); ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawFX() {
  ctx.globalCompositeOperation = 'lighter';
  // lasers
  for (const L of lasers) {
    const y = floorY - L.y * P;
    if (!L.fired) {
      const a = 0.35 + 0.35 * Math.sin(L.t * 22);
      ctx.setLineDash([10, 8]); ctx.strokeStyle = hsla(0, 95, 70, a); ctx.lineWidth = 1.2; ga(1);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = hsla(0, 95, 70, a + 0.2);
      for (const ex of [0, W]) { ctx.beginPath(); ctx.moveTo(ex, y - 7); ctx.lineTo(ex + (ex ? -10 : 10), y); ctx.lineTo(ex, y + 7); ctx.closePath(); ctx.fill(); }
    } else {
      const k = clamp(1 - (L.t - 1.2) / 0.7, 0, 1), th = R * (0.9 + 0.5 * k);
      const g = ctx.createLinearGradient(0, y - th, 0, y + th);
      g.addColorStop(0, hsla(0, 95, 60, 0)); g.addColorStop(0.42, hsla(0, 95, 65, 0.55 * k)); g.addColorStop(0.5, `rgba(255,255,255,${k})`); g.addColorStop(0.58, hsla(0, 95, 65, 0.55 * k)); g.addColorStop(1, hsla(0, 95, 60, 0));
      ga(1); ctx.fillStyle = g; ctx.fillRect(0, y - th, W, th * 2);
    }
  }
  // gravity arrows beside the platforms
  if (feat.gravity || gdir < 0) {
    const dir = flipWarned ? -gdir : gdir, warn = flipWarned;
    const cx = ballX + PW + R * 0.9, cyM = floorY - paddle.h - GAPH / 2;
    for (let k = 0; k < 3; k++) {
      const a = warn ? 0.5 + 0.5 * Math.sin(t * 20) : 0.18 + 0.12 * Math.sin(t * 3 - k);
      const yy = cyM + (k - 1) * R * 0.7 * dir;
      ctx.strokeStyle = warn ? hsla(0, 95, 75, a) : hsla(hue, 90, 80, a); ctx.lineWidth = 2; ga(1);
      ctx.beginPath(); ctx.moveTo(cx - R * 0.4, yy - R * 0.25 * dir); ctx.lineTo(cx, yy + R * 0.15 * dir); ctx.lineTo(cx + R * 0.4, yy - R * 0.25 * dir); ctx.stroke();
    }
  }
  // magnet field + tethers
  if (magT > 0 && ball.alive) {
    const cy = floorY - ball.h - R, a = Math.min(1, magT / 1.5);
    ctx.save(); ctx.translate(ballX, cy); ctx.rotate(t * 2);
    ctx.setLineDash([R * 0.4, R * 0.35]); ctx.strokeStyle = hsla(195, 95, 80, 0.5 * a); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, R * 2.1, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    for (const it of items) {
      if (!it.alive || !it.pulled) continue;
      const ix = it.wx - camX, iy = floorY - it.y * P;
      ctx.strokeStyle = hsla(195, 95, 80, 0.18 * a); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ballX, cy); ctx.lineTo(ix, iy); ctx.stroke();
    }
  }
  // overdrive speed lines
  if (odT > 0) {
    const a = Math.min(1, odT / 1.2);
    for (let i = 0; i < 16; i++) {
      const y = Math.random() * H, len = rand(0.08, 0.3) * W, x = Math.random() * W;
      const g = ctx.createLinearGradient(x, 0, x + len, 0);
      g.addColorStop(0, hsla((hue + i * 20) % 360, 95, 75, 0)); g.addColorStop(1, hsla((hue + i * 20) % 360, 95, 75, 0.25 * a));
      ctx.fillStyle = g; ga(1); ctx.fillRect(x, y, len, 1.2);
    }
  }
  // gold flying to the score
  const tx = W / 2, ty = H * 0.032 + 24;
  for (const f of flyers) {
    for (let k = 0; k < 3; k++) {
      const tt = Math.max(0, f.t - k * 0.05), e = tt * tt * (3 - 2 * tt);
      const cx = f.x0 + (tx - f.x0) * e, cy = f.y0 + (ty - f.y0) * e - Math.sin(tt * Math.PI) * H * 0.08;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.35);
      g.addColorStop(0, `rgba(255,236,170,${0.9 - k * 0.28})`); g.addColorStop(1, hsla(45, 95, 60, 0));
      ga(1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.35, 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawPopups() {
  ctx.globalCompositeOperation = 'lighter'; ctx.textAlign = 'center';
  ctx.font = `300 ${Math.round(R * 0.75)}px 'Inter Tight', system-ui, sans-serif`;
  for (const p of popups) {
    ga(Math.pow(clamp(1 - p.t / 1.1, 0, 1), 1.4)); ctx.fillStyle = hsla(45, 95, 78, 1);
    ctx.fillText(p.txt.toUpperCase(), p.wx - camX, p.y);
  }
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

function drawScene() {
  drawGates(); drawItems(); drawTrail();
  drawPaddle('back');
  if (ball.alive) {
    const oRA = RA; if (invuln > 0 && Math.floor(invuln * 14) % 2 === 0) RA *= 0.35;
    const b = ballPose(); drawBall(b.x, b.y, R, b.sx, b.sy); RA = oRA;
  }
  drawPaddle('front');
  drawShards();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ga(1);
  ctx.drawImage(bg, 0, 0, W, H);
  const ox = shake ? rand(-1, 1) * shake : 0, oy = shake ? rand(-1, 1) * shake : 0;
  ctx.translate(ox, oy);
  drawSky();

  // reflections in the glossy floor and ceiling
  ctx.save(); ctx.beginPath(); ctx.rect(-50, floorY, W + 100, H - floorY + 50); ctx.clip();
  ctx.translate(0, 2 * floorY); ctx.scale(1, -1); RA = 0.3; drawScene(); RA = 1; ctx.restore();

  drawSurfaces();
  drawRail();
  drawScene();
  drawParticles();
  if (dk > 0.01) {
    // eclipse: darkness everywhere except around the ball; gold still shines through
    const cy = floorY - ball.h - R;
    const g = ctx.createRadialGradient(ballX, cy, R * 2.5, ballX, cy, Math.max(W, H) * 0.6);
    g.addColorStop(0, 'rgba(1,2,6,0)'); g.addColorStop(0.22, `rgba(1,2,6,${0.86 * dk})`); g.addColorStop(1, `rgba(1,2,6,${0.97 * dk})`);
    ga(1); ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    const oRA = RA; RA = 0.8 * dk; drawItems();
    ctx.globalCompositeOperation = 'lighter'; for (const gt of gates) if (!gt.got) drawMote(gt, gt.wx - camX);
    ctx.globalCompositeOperation = 'source-over'; RA = oRA; ga(1);
  }
  drawPopups();
  drawWarnings();
  drawFX();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flash > 0) { ctx.globalCompositeOperation = 'lighter'; ga(flash * 0.35); ctx.fillStyle = hsla(hue, 80, 75, 1); ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ga(1); }
  if (hitFlash > 0) { ga(hitFlash * 0.18); ctx.fillStyle = '#ff3355'; ctx.fillRect(0, 0, W, H); ga(1); }
  if (gdir < 0) { ctx.globalCompositeOperation = 'lighter'; ga(0.05); ctx.fillStyle = 'hsl(330,80%,40%)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ga(1); }
  if (worldMul < 0.98) { ctx.globalCompositeOperation = 'lighter'; ga((1 - worldMul) * 0.22); ctx.fillStyle = 'hsl(280,80%,25%)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ga(1); }
  ctx.drawImage(vig, 0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const gx = Math.floor(Math.random() * 160), gy = Math.floor(Math.random() * 160);
  ctx.translate(-gx, -gy); ga(0.045); ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width + 160, cv.height + 160);
  ctx.globalCompositeOperation = 'source-over'; ga(1);
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  timeScale += (1 - timeScale) * Math.min(1, rdt * 1.1);
  try { update(rdt * timeScale, rdt); render(); }
  catch (err) { console.error(err); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; RA = 1; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
