<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bounce Lab">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Summit v1 · Sisyphus</title>
<style>
  :root { --accent: #3ef6ff; --gold: #ffc23a; --hot: #ff7a2e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #020308; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .hide { display: none !important; }

  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
  #hudL { display: flex; flex-direction: column; gap: 5px; }
  #score { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; text-shadow: 0 0 18px var(--accent); font-variant-numeric: tabular-nums; }
  #alt { white-space: nowrap; font-size: 12px; opacity: .7; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
  #hudC { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 4px; }
  #mult { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.5); transition: color .2s, transform .2s; }
  #mult.hot { color: var(--gold); text-shadow: 0 0 12px var(--gold); transform: scale(1.15); }
  #prog { width: 90px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  #progFill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transform-origin: left; transform: scaleX(0); }
  #campT { font-size: 10px; letter-spacing: 2px; opacity: .55; white-space: nowrap; }
  #hudR { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  #lives { display: flex; gap: 5px; padding-top: 4px; }
  #lives i { width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8a8f99, #2a2d33 60%, #111 75%); box-shadow: 0 0 0 1px rgba(255,140,60,.55), 0 0 10px rgba(255,120,40,.6); }
  #mute { pointer-events: auto; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); color: #fff; border-radius: 50%;
    width: 36px; height: 36px; font-size: 15px; display: grid; place-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  #banner { position: fixed; left: 50%; top: 21%; transform: translate(-50%, -10px); text-align: center; pointer-events: none; opacity: 0; width: 92vw; }
  #banner.show { animation: ban 3.4s ease forwards; }
  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -14px) scale(.96); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 6px); } }
  #bTitle { font-size: 22px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 22px var(--accent); }
  #bSub { margin-top: 6px; font-size: 13px; opacity: .85; letter-spacing: .3px; }

  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 15px; color: var(--gold); text-shadow: 0 0 10px rgba(255,190,60,.8); white-space: nowrap; will-change: transform, opacity; }
  .pop.big { font-size: 22px; color: #fff; letter-spacing: 2px; text-shadow: 0 0 16px var(--accent); }
  .pop.perfect { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 3px; text-shadow: 0 0 18px var(--gold), 0 0 6px var(--gold); }
  .pop.bad { font-size: 17px; color: #ff7a5c; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,90,60,.8); }
  .pop.dim { font-size: 13px; color: rgba(255,255,255,.6); text-shadow: none; letter-spacing: 2px; }

  #touch { position: fixed; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .15s;
    border: 1.5px solid rgba(255,255,255,.3); background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,0) 70%); }
  #touch.on { opacity: 1; }

  /* smack button */
  #smackBtn { position: fixed; right: calc(env(safe-area-inset-right) + 20px); bottom: calc(env(safe-area-inset-bottom) + 28px); width: 92px; height: 92px; border-radius: 50%;
    pointer-events: auto; display: grid; place-items: center; border: 0; padding: 0; color: #fff; background: none; }
  #smackBtn .ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--p, 1) * 360deg), rgba(255,255,255,.12) 0);
    -webkit-mask: radial-gradient(circle, transparent 41px, #000 42px); mask: radial-gradient(circle, transparent 41px, #000 42px); }
  #smackBtn .face { position: absolute; inset: 6px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: 2px;
    background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.16), rgba(255,255,255,.03) 70%); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .08s, box-shadow .15s; }
  #smackBtn.ready .face { box-shadow: 0 0 22px var(--accent), inset 0 0 14px rgba(62,246,255,.25); }
  #smackBtn.inreach .face { box-shadow: 0 0 30px var(--gold), inset 0 0 18px rgba(255,194,58,.35); border-color: var(--gold); }
  #smackBtn.down .face { transform: scale(.9); }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 24px calc(env(safe-area-inset-bottom) + 52px); text-align: center;
    background: linear-gradient(to top, rgba(2,3,8,.94) 0%, rgba(2,3,8,.6) 45%, rgba(2,3,8,0) 70%); }
  .logo { font-size: 54px; font-weight: 900; letter-spacing: 10px; margin-right: -10px; line-height: 1;
    background: linear-gradient(180deg, #fff 20%, var(--hot)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255,122,46,.8)); }
  .tag { margin-top: 8px; font-size: 13px; letter-spacing: 3px; opacity: .7; text-transform: uppercase; }
  .how { margin: 24px 0 22px; display: grid; gap: 9px; font-size: 15px; opacity: .92; }
  .how b { color: var(--accent); }
  .btn { pointer-events: auto; border: 0; border-radius: 999px; padding: 17px 46px; font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #02040a;
    background: linear-gradient(180deg, #fff, var(--hot)); box-shadow: 0 0 34px rgba(255,122,46,.8); }
  .btn:active { transform: scale(.97); }
  .small { margin-top: 14px; font-size: 12px; opacity: .55; letter-spacing: 1px; min-height: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 26px; margin: 16px 0 22px; font-size: 14px; text-align: left; }
  .stats span { opacity: .6; }
  .stats b { text-align: right; }
  #oScore { font-size: 64px; font-weight: 900; text-shadow: 0 0 30px var(--hot); line-height: 1; margin-top: 6px; }
  #oBest { margin-top: 6px; font-size: 13px; letter-spacing: 2px; color: var(--gold); }
  #oQuote { margin-top: 10px; font-size: 13px; opacity: .6; font-style: italic; max-width: 300px; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(255,60,40,0) 40%, rgba(255,60,40,.55)); transition: opacity .35s; }
  #flash.on { opacity: 1; transition: none; }
</style>

<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="hudL"><div id="score">0</div><div id="alt">0 m</div></div>
  <div id="hudC"><div id="mult">×1</div><div id="prog"><div id="progFill"></div></div><div id="campT">CAMP 1</div></div>
  <div id="hudR"><div id="lives"></div><button id="mute" class="ui" aria-label="Sound">🔊</button></div>

<div id="banner"><div id="bTitle"></div><div id="bSub"></div></div>

<button id="smackBtn" class="ui hide" aria-label="Smack"><div class="ring"></div><div class="face">SMACK</div></button>

<div id="title" class="screen ui">

  <div class="tag">v1 · a sisyphus game</div>
  <div class="how">
    <div><b>Drag</b> anywhere to move your Titan</div>
    <div><b>Tap</b> to smack the boulder up the mountain</div>

  </div>
  <button id="playBtn" class="btn">CLIMB</button>

</div>

<div id="over" class="screen ui hide">
  <div class="tag">the boulder rolls back down</div>
  <div id="oScore">0</div>
  <div id="oBest"></div>
  <div class="stats">
    <span>Highest point</span><b id="oAlt">0 m</b>
